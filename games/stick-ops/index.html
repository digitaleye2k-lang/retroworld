<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STICK OPS: BLACKOUT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #030507; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: 100%; height: 100%; }
  #game canvas { display: block; cursor: none; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #9fb4c0; font: 600 18px 'Rajdhani', 'Segoe UI', sans-serif; letter-spacing: 4px; background: #030507; z-index: 5;
  }
  #boot b { font: 42px 'Black Ops One', Impact, sans-serif; color: #e8eef2; letter-spacing: 6px; margin-bottom: 12px; }
  #boot.hidden { display: none; }
  #err { position: fixed; left: 12px; bottom: 12px; color: #ff6b5b; font: 14px monospace; white-space: pre-wrap; z-index: 9; max-width: 90vw; }
</style>
</head>
<body>
<div id="boot"><b>STICK OPS</b>LOADING...</div>
<div id="game"></div>
<div id="err"></div>
<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err');
    if (el && location.search.indexOf('debug') >= 0) el.textContent += (e.message || e) + '\n';
  });
</script>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
