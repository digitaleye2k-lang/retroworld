<style>
/* Layout: a camp dossier — status strip on top, the camp map left, the prisoner's ledger right; stacks on phones */
:root{
  --night:#12150f;
  --panel:#1a1e16;
  --panel-2:#222820;
  --line:#3a4232;
  --paper:#e6dcc0;
  --khaki:#c4b283;
  --dim:#8e8c76;
  --rust:#cf5a2e;
  --amber:#e6a93c;
  --ok:#93b26e;
  --f-display:'Special Elite','Courier New',monospace;
  --f-body:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--night);color:var(--paper)}
body{font-family:var(--f-body);font-size:16px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;border-bottom:1px solid var(--line);padding-bottom:8px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.55rem;margin:0;letter-spacing:.02em;color:var(--khaki);text-wrap:balance}
h1 small{font-family:var(--f-mono);font-size:.68rem;color:var(--dim);letter-spacing:.12em;margin-left:8px;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto;align-items:center;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.stat b{color:var(--paper);font-weight:600}
.stat span{color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;margin-right:5px}
.heat{display:flex;align-items:center;gap:6px}
.heatbar{width:90px;height:8px;background:var(--panel-2);border:1px solid var(--line);position:relative;overflow:hidden}
.heatbar i{position:absolute;inset:0 auto 0 0;background:var(--amber);width:0%}
.chip{padding:2px 8px;border:1px solid var(--line);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.chip.ok{color:var(--ok);border-color:#4d5f3a}
.chip.bad{color:var(--night);background:var(--rust);border-color:var(--rust)}
.chip.aud{background:none;color:var(--khaki);font-family:var(--f-mono);cursor:pointer}
.chip.aud[aria-pressed="false"]{color:var(--dim);text-decoration:line-through}
.chip.warn{color:var(--amber);border-color:#7a5d26}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
#stage{position:relative;min-width:0;border:1px solid var(--line);background:#0b0d09;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#cv{position:absolute;left:0;top:0;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,8,.78);padding:16px;z-index:5}
.card{background:var(--paper);color:#23201a;max-width:560px;width:100%;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.6);max-height:100%;overflow:auto;position:relative}
.card h2{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:0 0 4px;text-wrap:balance}
.card .stampline{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#7a3a1e;margin-bottom:12px}
.card p{font-size:1.02rem;margin:0 0 10px;max-width:62ch}
.card .keys{font-family:var(--f-mono);font-size:.76rem;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:12px 0 16px;color:#3b362b}
.card .keys b{color:#23201a}
.card .btns{display:flex;flex-wrap:wrap;gap:8px}
.card button{background:#2b2a22;color:var(--paper);border:0;padding:9px 16px;font-family:var(--f-mono);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.card button.alt{background:transparent;color:#2b2a22;border:1px solid #2b2a22}
.card button:hover{background:#7a3a1e;color:var(--paper)}
.odds{font-family:var(--f-mono);font-size:.82rem;border-top:1px dashed #a39674;border-bottom:1px dashed #a39674;padding:8px 0;margin:10px 0 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.odds .no{color:#9a907a;text-decoration:line-through}
.odds .tot{font-weight:600;border-top:1px solid #a39674;padding-top:4px;margin-top:4px}
.stamp{position:absolute;top:18px;right:18px;border:3px solid #9b2d17;color:#9b2d17;font-family:var(--f-display);padding:4px 10px;transform:rotate(-8deg);font-size:1.1rem;opacity:.85}
#dlg{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(22,26,19,.97);border:1px solid var(--khaki);padding:14px 16px;z-index:4;max-height:70%;overflow:auto}
#dlg .who{font-family:var(--f-display);color:var(--khaki);font-size:1.15rem}
#dlg .role{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-left:8px}
#dlg .txt{margin:6px 0 10px;font-size:1.05rem;max-width:70ch}
#dlg .opts{display:flex;flex-direction:column;gap:4px}
#dlg .opts button{text-align:left;background:var(--panel-2);border:1px solid var(--line);padding:6px 10px;font-size:1rem}
#dlg .opts button:hover{border-color:var(--amber)}
#dlg .opts button:disabled{opacity:.45;cursor:default}
#dlg .opts kbd{font-family:var(--f-mono);font-size:.72rem;color:var(--amber);margin-right:8px}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(22,26,19,.95);border:1px solid var(--line);padding:6px 14px;font-size:.95rem;z-index:3;max-width:90%;text-align:center;pointer-events:none;transition:opacity .3s}
#toast.bad{border-color:var(--rust);color:#ffd9c8}
#touch{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;padding:10px;pointer-events:none;z-index:2}
#touch .pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px;pointer-events:auto}
#touch button{background:rgba(30,35,26,.7);border:1px solid var(--line);font-family:var(--f-mono);font-size:1rem;touch-action:none}
#touch .acts{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
#touch .act.sm{width:48px;height:48px;font-size:.85rem}
#obj{position:absolute;top:10px;left:10px;max-width:min(46%,340px);background:rgba(15,18,12,.82);border-left:3px solid var(--amber);padding:7px 10px;font-size:.88rem;line-height:1.3;z-index:2;pointer-events:none}
#obj .mt{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:3px}
#obj .d{color:var(--dim);text-decoration:line-through}
#obj .c{color:var(--paper);font-weight:600}
#obj div:not(.mt):not(.c):not(.d){color:#b9b39c}
@media (max-width:560px){#obj{font-size:.78rem;max-width:62%}}
#touch .act{width:64px;height:64px;border-radius:50%;pointer-events:auto;color:var(--amber);border-color:var(--amber)}
aside{background:var(--panel);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column;max-height:calc(100vh - 110px)}
@media (max-width:900px){aside{max-height:none}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:8px 6px;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--khaki);border-bottom-color:var(--khaki)}
.pane{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sec h3{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;font-weight:600;display:flex;justify-content:space-between}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dotted #2d3427;font-size:.98rem}
.row .nm{flex:1;min-width:0}
.row .ct{font-family:var(--f-mono);font-size:.78rem;color:var(--dim)}
.row .c{width:7px;height:7px;flex:none;background:var(--line)}
.row .c.on{background:var(--rust)}
.row button{background:var(--panel-2);border:1px solid var(--line);font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px}
.row button:disabled{opacity:.35;cursor:default}
.empty{color:var(--dim);font-style:italic;font-size:.92rem}
.hint{color:var(--dim);font-size:.88rem}
.plan{border-left:2px solid var(--line);padding-left:10px}
.plan.ready{border-left-color:var(--ok)}
.plan h4{margin:0 0 3px;font-family:var(--f-display);font-weight:400;font-size:1.05rem;color:var(--khaki)}
.plan ul{list-style:none;margin:0;padding:0;font-size:.93rem}
.plan li{display:flex;gap:6px}
.plan li::before{content:"☐";color:var(--dim);flex:none}
.plan li.done::before{content:"☑";color:var(--ok)}
.plan li.done{color:var(--dim)}
.log{font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.log div{border-bottom:1px dotted #2d3427;padding-bottom:3px}
.log time{font-family:var(--f-mono);font-size:.7rem;color:var(--dim);margin-right:6px}
.log .bad{color:#f0a184}
.log .good{color:#b9d394}
.legend{font-family:var(--f-mono);font-size:.7rem;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 12px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.chip.fsb{color:var(--amber);border-color:#7a5d26}
.chip.fsb:hover{background:#2a2414}
body.fs{padding-block:6px;overflow:hidden;height:100vh;height:100dvh}
body.fs #app{max-width:none;height:100%;gap:6px}
body.fs main{grid-template-columns:minmax(0,1fr) 300px;flex:1;min-height:0}
body.fs aside{max-height:none;height:100%;min-height:0}
body.fs main{align-items:stretch}
body.fs header{padding-bottom:4px;gap:4px 12px}
body.fs h1{font-size:1.15rem}
body.fs h1 small{display:none}
body.fs .stats{font-size:.74rem;gap:4px 12px}
body.fs.nosb main{grid-template-columns:minmax(0,1fr)}
body.fs.nosb aside{display:none}
#bSide{display:none}
body.fs #bSide{display:inline-block}
@media (max-width:900px){body.fs main{grid-template-columns:minmax(0,1fr)} body.fs aside{display:none} body.fs.sb aside{display:flex;position:fixed;right:0;top:0;bottom:0;width:min(330px,88vw);max-height:none;z-index:20}}
body.fs.sb #bSide{position:fixed;z-index:21;top:8px;left:8px;background:var(--night)}
#touch .act,#touch .pad button{-webkit-tap-highlight-color:transparent}
#touch button:active{background:rgba(230,169,60,.35)}
</style>

<div id="app">
  <header>

  <main>

        <button role="tab" aria-selected="false" data-tab="plans" id="tabPlans">Routes</button>
        <button role="tab" aria-selected="false" data-tab="log" id="tabLog">Log</button>
      </div>
      <div class="pane" id="pMissions"></div>
      <div class="pane" id="pKit" hidden></div>
      <div class="pane" id="pPlans" hidden></div>
      <div class="pane" id="pLog" hidden><div class="log" id="logList"></div></div>
    </aside>
  </main>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const dk=document.createElement('canvas'), dctx=dk.getContext('2d');
let TILE=30, VW=800, VH=500, DPR=1;

/* ---------------- MAP ---------------- */
const MW=50, MH=38;
const T={OUT:0,TREE:1,GROUND:2,WALL:3,FLOOR:4,DOOR:5,FENCE:6,DEAD:7,GATE:8,TOWER:9,RES:10,CUT:11,ROAD:12,RFLOOR:13,IFENCE:14,LDOOR:15};
const BLOCK=new Set([T.WALL,T.FENCE,T.GATE,T.TOWER,T.IFENCE,T.LDOOR]);
const OPAQUE=new Set([T.WALL,T.TOWER,T.LDOOR]);
const map=new Uint8Array(MW*MH);
const noise=new Float32Array(MW*MH);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(1945);
function set(x,y,t){if(x>=0&&y>=0&&x<MW&&y<MH)map[y*MW+x]=t}
function get(x,y){if(x<0||y<0||x>=MW||y>=MH)return T.TREE;return map[y*MW+x]}
function fill(x0,y0,x1,y1,t){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,t)}
function building(x0,y0,x1,y1,doors,floor=T.FLOOR){fill(x0,y0,x1,y1,T.WALL);fill(x0+1,y0+1,x1-1,y1-1,floor);doors.forEach(([x,y,t])=>set(x,y,t||T.DOOR))}
const HUTS=[{x0:6,y0:6,x1:16,y1:12},{x0:6,y0:15,x1:16,y1:21}];
const BUILDINGS=[
  {x0:6,y0:6,x1:16,y1:12,doors:[[11,12]],name:'HUT 7'},
  {x0:6,y0:15,x1:16,y1:21,doors:[[11,15],[16,18]],name:'HUT 8'},
  {x0:19,y0:7,x1:29,y1:12,doors:[[24,12]],name:'MESS HALL'},
  {x0:19,y0:15,x1:27,y1:20,doors:[[23,15],[19,18]],name:'WORKSHOP'},
  {x0:6,y0:25,x1:14,y1:30,doors:[[14,27]],name:'INFIRMARY'},
  {x0:35,y0:6,x1:43,y1:11,doors:[[35,9]],name:'WACHE',de:1},
  {x0:35,y0:14,x1:41,y1:18,doors:[[35,16,T.LDOOR]],name:'STORES',de:1},
  {x0:35,y0:22,x1:43,y1:29,doors:[[35,25,T.LDOOR]],name:'KOMMANDANTUR',de:1},
];
const LABELS=[];
function rebuild(){
  LABELS.length=0;
  const r=rng(1945);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const edge=x<=1||x>=48||y<=1||y>=36;const a=r(),b=r();set(x,y,edge&&a<0.62?T.TREE:T.OUT);noise[y*MW+x]=b}
  fill(3,3,46,34,T.FENCE); fill(4,4,45,33,T.DEAD); fill(5,5,44,32,T.GROUND);
  fill(33,5,44,32,T.RES);for(let y=5;y<=32;y++)set(32,y,T.IFENCE);set(32,13,T.GROUND);set(32,14,T.GROUND);
  set(45,18,T.RES);set(45,19,T.RES);set(46,18,T.GATE);set(46,19,T.GATE);fill(47,18,49,19,T.ROAD);
  [[5,5],[44,5],[5,32],[44,32],[24,5],[24,32]].forEach(([x,y])=>set(x,y,T.TOWER));
  BUILDINGS.forEach(b=>{building(b.x0,b.y0,b.x1,b.y1,b.doors,b.de?T.RFLOOR:T.FLOOR);LABELS.push([b.name,(b.x0+b.x1+1)/2,(b.y0+b.y1+1)/2+0.15])});
  set(1,8,T.OUT);set(2,8,T.OUT);
  LABELS.push(['APPELLPLATZ',24.5,30.4]);
}
rebuild();

  {out:'trowel',need:{spoon:1},tool:'file',d:'Grind a spoon into a blade'},
  {out:'lockpick',need:{wire:1},tool:'file',d:'Bend and file wire into a pick'},
  {out:'cutters',need:{pliers:1},tool:'file',d:'Sharpen pliers jaws to bite wire'},
  {out:'bags',need:{blanket:1,string:1},d:'Sew sacks to hide under trousers'},
];
const OBJ=[
  {id:'mybunk',x:7,y:7,k:'bunk',label:'Your bunk'},
  {id:'bunkA',x:9,y:7,k:'board',label:'Empty bunk'},
  {id:'bunkB',x:7,y:10,k:'board',label:'Empty bunk'},

  {id:'bench',x:20,y:16,k:'bench',label:'Tool bench'},
  {id:'scrap',x:26,y:19,k:'scrap',label:'Scrap pile'},
  {id:'work',x:24,y:17,k:'work',label:'Work station'},
  {id:'cabinet',x:7,y:26,k:'cabinet',label:'Medicine cabinet'},
  {id:'shelves',x:40,y:15,k:'shelves',label:'Supply shelves'},
  {id:'locker',x:42,y:7,k:'locker',label:'Kit lockers'},
  {id:'desk',x:42,y:23,k:'desk',label:'Adjutant’s desk'},
  {id:'mapcab',x:42,y:28,k:'mapcab',label:'Map cabinet'},
  {id:'gate',x:45,y:18.5,k:'gate',label:'Main gate'},
  {id:'flag',x:24,y:26,k:'flag',label:'Flagpole'},

const has=(k,n=1)=>(S.inv[k]||0)>=n;
const count=k=>S.inv[k]||0;

const dayOf=t=>Math.floor(t/1440)+1;

const isCurfew=()=>{const m=minOf(S.t);return m>=1320||m<360};
function darkness(){const h=minOf(S.t)/60;if(h>=7&&h<17)return 0;if(h>=17&&h<21)return (h-17)/4*0.84;if(h>=5&&h<7)return (1-(h-5)/2)*0.84;return 0.84}

const P={x:8.5,y:8.6,fx:0,fy:1};
let guards=[];
let keys={}, paused=true, dlgOpen=false, alarm=0, alarmBy=null, channel=null, focus=null, clock=0, flakes=[];
function initGuards(){
  guards=GUARDS.map(g=>({...g,x:0,y:0,a:0,wi:0,pause:0,route:null,onDuty:false,lastFrisk:-9999,seeing:0,blind:false,look:0}));

}
function guardPlan(g){
  const night=isCurfew(), m=minOf(S.t);
  if(g.id==='brandt'){
    if(S.gateDay!==null && dayOf(S.t)===S.gateDay+1 && m>=60 && m<210) return {static:[45.5,18.6],a:Math.PI,blind:true};
    if(night) return null;
    return {route:ROUTES.brandt.day};
  }
  if(g.id==='hartmann'){
    if(S.roll.open) return {static:[24.5,24.6],a:Math.PI/2};
    return {route:night?ROUTES.hartmann.night:ROUTES.hartmann.day};
  }
  if(g.id==='vogel') return {route:ROUTES.vogel.day};
  if(g.id==='lenz'){ if(night) return {route:ROUTES.lenz.night}; return {static:[33.5,13.9],a:Math.PI}; }
}
function placeGuard(g,snap){
  const pl=guardPlan(g); const key=pl?(pl.static?'s'+pl.static.join():JSON.stringify(pl.route)):'off';
  if(g.planKey===key&&!snap)return;
  g.planKey=key; g.inv=null; g.onDuty=!!pl; g.blind=!!(pl&&pl.blind);
  if(!pl)return;
  if(pl.static){g.route=null;g.home=pl.static;g.baseA=pl.a;if(snap||Math.hypot(g.x-pl.static[0],g.y-pl.static[1])>12){g.x=pl.static[0];g.y=pl.static[1]}g.a=pl.a}
  else{g.route=pl.route;g.home=null;
    if(snap||!g.x){g.wi=Math.floor(R()*pl.route.length);const w=pl.route[g.wi];g.x=w[0]+.5;g.y=w[1]+.5;g.wi=(g.wi+1)%pl.route.length}
    else{let best=0,bd=1e9;pl.route.forEach((w,i)=>{const d=Math.hypot(w[0]+.5-g.x,w[1]+.5-g.y);if(d<bd){bd=d;best=i}});g.wi=best;if(bd>10){const w=pl.route[best];g.x=w[0]+.5;g.y=w[1]+.5}}
  }
}
function angNorm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a}
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/0.2);for(let i=1;i<n;i++){const x=ax+(bx-ax)*i/n,y=ay+(by-ay)*i/n;if(OPAQUE.has(get(Math.floor(x),Math.floor(y))))return false}return true}
function updateGuards(dt){
  guards.forEach(g=>{
    placeGuard(g,false);
    if(!g.onDuty)return;
    if(g.inv){investigate(g,dt);return}
    if(!g.blind&&!P.crouch&&P.moving&&Math.hypot(P.x-g.x,P.y-g.y)<2.3){g.a+=angNorm(Math.atan2(P.y-g.y,P.x-g.x)-g.a)*Math.min(1,dt*4);return}
    if(g.home){const tx=g.home[0],ty=g.home[1],d=Math.hypot(tx-g.x,ty-g.y);if(d>0.1){g.x+=(tx-g.x)/d*Math.min(d,g.speed*dt);g.y+=(ty-g.y)/d*Math.min(d,g.speed*dt);g.a=Math.atan2(ty-g.y,tx-g.x)}else{g.look+=dt;g.a=g.baseA+Math.sin(g.look*0.6)*0.8}return}
    if(g.pause>0){g.pause-=dt;g.look+=dt;g.a=g.pa+Math.sin(g.look*1.3)*0.9;return}
    const w=g.route[g.wi],tx=w[0]+.5,ty=w[1]+.5,d=Math.hypot(tx-g.x,ty-g.y);
    if(d<0.08){g.wi=(g.wi+1)%g.route.length;g.pause=1+R()*1.6;g.pa=g.a;g.look=0;return}
    const sp=g.speed*(isCurfew()?0.85:1)*dt;
    g.x+=(tx-g.x)/d*Math.min(d,sp);g.y+=(ty-g.y)/d*Math.min(d,sp);
    const ta=Math.atan2(ty-g.y,tx-g.x);g.a+=angNorm(ta-g.a)*Math.min(1,dt*6);
  });
}
const FOV=Math.PI*0.42;
function illegality(){
  const tx=Math.floor(P.x),ty=Math.floor(P.y),t=get(tx,ty);
  if(channel&&channel.kind==='cut')return{why:'Cutting the wire'};
  if(t===T.DEAD)return{why:'In the dead zone'};
  if(t===T.OUT||t===T.TREE||t===T.CUT||t===T.ROAD)return{why:'Outside the wire'};
  const uni=S.wearing==='uniform';
  if(t===T.RES||t===T.RFLOOR)return uni?{why:'Disguised',disg:1}:{why:'In the German compound'};
  if(isCurfew()&&!inHut(P.x,P.y))return uni?{why:'Disguised',disg:1}:{why:'Out after curfew'};
  return null;
}
function guardSees(g,ill){
  if(!g.onDuty||g.blind)return 0;
  const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy);
  let range=isDark()?4.4:6.5;
  if(ill.disg)range=g.id==='hartmann'?3.4:2.2;
  if(P.crouch)range*=0.62;
  if(isDark()&&!litPlayer())range*=0.75;
  if(d>range)return 0;
  if(d>1.1&&Math.abs(angNorm(Math.atan2(dy,dx)-g.a))>FOV)return 0;
  if(!los(g.x,g.y,P.x,P.y))return 0;
  return 1.25-d/range*0.75;
}
function searchlights(){
  return TOWERS.map(([x,y,b],i)=>{const a=b+0.95*Math.sin(clock*0.33+i*1.9),r=5.5+3*Math.sin(clock*0.5+i*2.3);return{x:x+.5+Math.cos(a)*r,y:y+.5+Math.sin(a)*r,r:2.3,tx:x+.5,ty:y+.5}});
}
function updateDetection(dt){
  const ill=illegality();
  guards.forEach(g=>g.seeing=0);
  let rate=0,by=null;
  if(ill){
    guards.forEach(g=>{const s=guardSees(g,ill);if(s>0){g.seeing=s;rate+=s*1.1;by=by||g}});
    if(!ill.disg){
      if(isDark()){ const tt=get(Math.floor(P.x),Math.floor(P.y)); if(tt!==T.FLOOR&&tt!==T.RFLOOR&&searchlights().some(l=>Math.hypot(l.x-P.x,l.y-P.y)<l.r)){rate+=2.6;by=by||{name:'the tower searchlight'}} }
      else if(ill.why==='In the dead zone'||ill.why==='Cutting the wire'){ if(TOWERS.some(([x,y])=>Math.hypot(x-P.x,y-P.y)<15)){rate+=1.4;by=by||{name:'a tower guard'}} }
    }
  }
  if(rate>0){alarm+=rate*dt*0.75;alarmBy=by}else alarm=Math.max(0,alarm-dt*0.4);
  if(alarm>=1){alarm=0;caught(`${by&&by.name?cap(by.name):'A guard'} caught you. ${ill?ill.why+'.':''}`)}
  const st=$('#hStatus');
  if(!ill){st.textContent=isCurfew()?'In barracks':'In bounds';st.className='chip ok'}
  else if(ill.disg){st.textContent='Disguised';st.className='chip warn'}
  else{st.textContent=ill.why;st.className='chip bad'}
  // frisks
  if(!ill&&!isCurfew()&&S.wearing!=='uniform'){
    guards.forEach(g=>{if(!g.onDuty||g.blind)return;const d=Math.hypot(P.x-g.x,P.y-g.y);if(d<1.4&&S.t-g.lastFrisk>150){g.lastFrisk=S.t;const ch=0.05+S.heat/260+(g.id==='hartmann'?0.12:0);if(R()<ch)frisk(g)}});
  }
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function frisk(g){
  const items=Object.keys(S.inv).filter(k=>ITEMS[k].c);
  if(!items.length){say(`${g.name} frisks you. Nothing found.`);S.heat=Math.max(0,S.heat-2);return}
  const serious=items.find(k=>ITEMS[k].s);
  if(serious){caught(`${g.name} frisked you and found your ${ITEMS[serious].n.toLowerCase()}.`);return}
  items.forEach(k=>delete S.inv[k]);
  S.heat=Math.min(100,S.heat+12);
  say(`${g.name} frisks you and confiscates ${items.map(k=>ITEMS[k].n.toLowerCase()).join(', ')}. Hide contraband in your bunk.`,'bad');
  renderSide();
}

/* ---------------- TIME EVENTS ---------------- */
function morning(day){
  if(day>LAST_DAY){loseDeadline();return}
  S.roll={open:true,attended:false}; S.daily={};sfx('whistle');
  if(S.gateDay!==null&&day>=S.gateDay+1){S.gateDay=null;log('Brandt’s arrangement has lapsed.')}
  S.heat=Math.max(0,S.heat-6);
  if(day%3===1){S.cigs+=10;add('chocolate');add('coffee');log(`Red Cross parcels arrived: +10 cigarettes, chocolate, coffee.`,'good')}
  else{S.cigs+=2;log('Morning issue: +2 cigarettes.')}
  S.orders=S.orders.filter(o=>{if(o.day<=day){add(o.item,1,'stash');log(`${o.from} left your ${ITEMS[o.item].n.toLowerCase()} under your mattress (stash).`,'good');return false}return true});
  if(S.informed>0){
    const lost=Object.keys(S.stash).filter(k=>ITEMS[k].s&&R()<0.6);
    lost.forEach(k=>take(k,99,'stash'));
    S.heat=Math.min(100,S.heat+15);S.informed=0;
    say(lost.length?`Dawn raid on Hut 7. The ferrets went straight to your bunk and took: ${lost.map(k=>ITEMS[k].n.toLowerCase()).join(', ')}. Someone talked.`:'Dawn raid on Hut 7. The ferrets tore up your bunk but found nothing. Someone talked.','bad');
  }
  if(day===LAST_DAY)say('Rumour in the yard: the camp marches west tomorrow at dawn. Tonight is the last chance.','bad');
  else log(`Day ${day}. ${LAST_DAY-day+1} days until the evacuation march.`);
  save();
}
function rollEnd(){S.roll.open=false;if(!S.roll.attended){S.heat=Math.min(100,S.heat+20);say('You missed roll call. The count came up one short.','bad')}else{S.heat=Math.max(0,S.heat-2);log('Roll call: counted and correct.')}}
function rollOpen(){S.roll={open:true,attended:false};sfx('whistle');speak('Appell! Alle raus! Schnell, schnell!','hartmann');say('Whistles. Evening roll call on the Appellplatz until 18:45.')}
function bedCheck(){speak('Licht aus! Alle in die Betten!','hartmann');if(!inHut(P.x,P.y)&&S.wearing!=='uniform'){S.heat=Math.min(100,S.heat+25);say('Bed check at 22:00 and your bunk was empty.','bad')}else log('Bed check. Lights out.')}
const EVENTS=[[360,d=>morning(d)],[405,rollEnd],[1080,rollOpen],[1125,rollEnd],[1260,()=>say('Lights out in one hour. Be in your hut by 22:00.')],[1320,bedCheck]];
function advance(mins){
  const prev=S.t, cur=S.t+mins; S.t=cur;
  for(let d=Math.floor(prev/1440);d<=Math.floor(cur/1440);d++)for(const [m,f] of EVENTS){const a=d*1440+m;if(a>prev&&a<=cur){S.t=a;f(d+1);S.t=cur;if(S.done||ovOpen)return}}
  if(S.heat>=100&&!S.done){S.heat=60;caught('The Kommandant has had enough of you. Suspicion maxed out.')}
}

function kitOdds(route){
  const v=[['Base chance for a lone evader',20,true],
    ['Button compass',15,has('compass')],
    ['Regional map',20,has('map')],
    ['Civilian clothes',15,has('civvies')],
    ['Forged travel papers',15,has('papers')],
    ['Escape rations',10,has('rations')],
    ['Black bread (2+)',5,count('bread')>=2],
  ];
  if(route==='bribe')v.push(['Brandt’s head start',10,true]);
  if(route==='tunnel')v.push(['Tunnel: nobody knows until roll call',5,true]);
  if(route==='disguise')v.push(['Walked out in daylight',5,true]);
  if(S.heat>60)v.push(['Camp on alert (high suspicion)',-10,true]);
  const tot=Math.max(5,Math.min(95,v.reduce((a,[,n,h])=>a+(h?n:0),0)));
  return{v,tot};
}

  showOv(`<div class="stamp">EVACUATED</div><h2>The Long March</h2><div class="stampline">Day 15 · 06:00</div>

/* ---------------- DIALOG ---------------- */
let dlgOptsFns=[];
function dlg(who,text,opts){
  dlgOpen=true;paused=true;
  $('#dWho').textContent=who.name;$('#dRole').textContent=who.role||'';
  $('#dTxt').innerHTML=text;
  const list=opts.filter(Boolean);list.push({t:'Leave',f:closeDlg});
  dlgOptsFns=list;
  $('#dOpts').innerHTML='';
  list.forEach((o,i)=>{const b=document.createElement('button');b.innerHTML=`<kbd>${i+1}</kbd>${o.t}`;if(o.off)b.disabled=true;b.onclick=()=>{if(!o.off)o.f()};$('#dOpts').appendChild(b)});
  $('#dlg').hidden=false;
  sfx('paper');
  if(GUARDS.some(g=>g.id===who.id))bark(who.id);else speak(text,who.id||'narrator');
  renderSide();
}
function closeDlg(silent){hush();dlgOpen=false;$('#dlg').hidden=true;if(silent!==true)paused=ovOpen;renderSide()}
const npc=id=>NPCS.find(n=>n.id===id)||guards.find(g=>g.id===id);
const cost=(n)=>`${n} cig${n===1?'':'s'}`;
function payable(n){return S.cigs>=n}
function talk(id){({kowalski:dKowalski,ollie:dOllie,ashcroft:dAshcroft,duval:dDuval,taff:dTaff,rennick:dRennick,brandt:dBrandt,hartmann:dHartmann,vogel:dGuard,lenz:dGuard})[id](id)}

/* ---------------- INTERACTIONS ---------------- */
function search(id,fn){advance(10);fn();renderSide()}
function once(key,item,msg){if(S.taken[key])return false;S.taken[key]=1;add(item);say(msg,'good');return true}
function interact(){
  if(!focus||paused)return;
  const f=focus;
  if(f.type==='npc'||f.type==='guard'){talk(f.id);return}
  if(f.type==='ldoor'){
    if(!has('lockpick')){say('Locked. A wire lockpick would open it.');return}
    channel={kind:'pick',x:f.x,y:f.y,p:0,dur:3,label:'Picking the lock'};return}
  if(f.type==='fence'){channel={kind:'cut',x:f.x,y:f.y,p:0,dur:4.5,label:'Cutting the wire'};return}
  const o=f.o;
  switch(o.k){
    case 'bunk':return dBunk();
    case 'board':if(S.taken[o.id])say('You already took the board from this bunk.');else{S.taken[o.id]=1;add('board');advance(10);say('You work a bed board loose from the bunk.','good')}break;
    case 'stove':return dStove();
    case 'crate':search(o,()=>{if(!once('spoon','spoon','You pocket a mess spoon.')){if(!S.daily.bread){S.daily.bread=1;add('bread');say('You find a heel of black bread.')}else say('Only turnip peelings left.')}});break;
    case 'bench':search(o,()=>{if(!once('file','file','You slip a metal file up your sleeve.'))say('Nothing else worth taking.')});break;
    case 'scrap':search(o,()=>{if(!S.daily.wire){S.daily.wire=1;add('wire');say('You pull a length of wire from the scrap.','good')}else say('Nothing useful left today.')});break;
    case 'work':{const m=minOf(S.t);if(m<480||m>=960){say('The foreman only takes workers between 08:00 and 16:00.');break}if(S.daily.work){say('You already worked a shift today.');break}S.daily.work=1;advance(180);S.cigs+=4;S.heat=Math.max(0,S.heat-4);say('Three hours mending boots for the Wehrmacht. +4 cigarettes.','good');break}
    case 'cabinet':search(o,()=>{if(!once('iodine','iodine','You pocket a bottle of iodine.'))say('Only bandages and aspirin.')});break;
    case 'shelves':search(o,()=>{if(once('pliers','pliers','You find a pair of pliers.'))return;if(once('shelfstring','string','You take a ball of string.'))return;if(once('shelfblanket','blanket','You take a spare blanket.'))return;say('Shelves of tinned meat with eagle stamps. Nothing you can use.')});break;
    case 'locker':search(o,()=>{if(!once('uniform','uniform','A spare guard tunic and trousers. You stuff them under your coat.'))say('Socks, letters home, a photograph of a girl in Dresden.')});break;
    case 'desk':search(o,()=>{if(S.mission>=3&&once('orders','orders','You find the evacuation orders: \u201cR\u00e4umung des Lagers, 15. Januar.\u201d You fold them into your shirt.'))return;if(once('forms','forms','You take a sheaf of blank travel forms.'))return;if(once('stamp','stamp','You take the Kommandantur rubber stamp.'))return;say('Duty rosters. Nothing else.')});break;
    case 'mapcab':search(o,()=>{if(!once('map','map','You fold a regional map into your boot.'))say('Survey maps of Silesia. You already have the one you need.')});break;
    case 'gate':return dGate();
    case 'flag':say(S.roll.open?'Roll call is on. Stand in the yard to be counted.':'Roll call at 06:00 and 18:00. Be on the Appellplatz.');break;
  }
  renderSide();
}
function dBunk(){
  const m=minOf(S.t);
  const opts=[];
  if(m>=1260||m<350)opts.push({t:'Sleep until 05:50',f:()=>{closeDlg();const d0=Math.floor(S.t/1440)+(m>=1260?1:0);advance(d0*1440+350-S.t);log('You sleep.');sfx('sleep');initGuards()}});
  if(m>=1200)opts.push({t:'Rest until 01:00 (the dead of night)',f:()=>{closeDlg();const d0=Math.floor(S.t/1440)+1;advance(d0*1440+60-S.t);log('You lie awake until one in the morning.');initGuards()}});
  if(m>=360&&m<1200)opts.push({t:'Nap for an hour',f:()=>{closeDlg();advance(60)}});
  dlg({name:'Your bunk',role:'Hut 7 · stash and rest'},'A straw mattress, a thin blanket, and a loose board underneath where nothing is ever found. Use the <b>Stash</b> buttons in the Kit panel to hide items here.',opts);
}
function dStove(){
  const me={name:'Stove',role:'Hut 7'};
  if(!S.tunnel.started){dlg(me,'A squat cast-iron stove on a brick plinth. Kowalski keeps staring at it.',[]);return}
  if(S.tunnel.p<100){
    const night=isCurfew();
    dlg(me,`The plinth lifts away. Below is the shaft. Progress: <b>${S.tunnel.p}%</b>.${night?'':' Too risky by day; dig after 22:00.'}`,[
      {t:'Dig for two hours',off:!night,f:()=>{closeDlg();sfx('dig');advance(120);S.tunnel.p=Math.min(100,S.tunnel.p+20);
        if(has('bags')){S.heat=Math.min(100,S.heat+3);say(`You dig. Tunnel ${S.tunnel.p}%. The sand goes out in your trouser bags.`,'good')}
        else{S.heat=Math.min(100,S.heat+12);say(`You dig. Tunnel ${S.tunnel.p}%. Yellow sand under the hut; the ferrets will notice.`,'bad')}
        if(S.tunnel.p>=100)say('You break through into the pine roots beyond the wire. The tunnel is finished!','good');
        renderSide()}}]);
  }else{
    dlg(me,'The tunnel is through. Sixty metres of crawling and you are in the forest.',[
      {t:'Go now',off:!isCurfew(),f:()=>{closeDlg(true);escape('tunnel')}},
      !isCurfew()&&{t:'(Only after 22:00, when the hut is shut)',off:true,f:()=>{}},
    ]);
  }
}
function dGate(){
  const me={name:'Main gate',role:'German compound'};
  const m=minOf(S.t), d=dayOf(S.t);
  if(S.gateDay!==null&&d===S.gateDay+1&&m>=60&&m<210){dlg(me,'The bolt is drawn back. Brandt is looking very hard at the sky.',[{t:'Walk out',f:()=>{closeDlg(true);escape('bribe')}}]);return}
  if(S.wearing==='uniform'&&m>=420&&m<1140){
    dlg(me,'The gate sentry looks up as you approach. “Ausweis?”',[
      {t:has('papers')?'Show your forged papers':'Bluff it without papers',f:()=>{closeDlg(true);if(has('papers'))escape('disguise');else caught('You had no papers. The sentry raised his rifle.')}}]);
    return;
  }
  dlg(me,S.wearing==='uniform'?'The gate only opens for guards between 07:00 and 19:00.':'Barbed wire on a timber frame, a sentry box and a heavy bolt. Prisoners do not use this gate.',[]);

function craft(r){
  if(r.out==='trowel')S.mf.trowel=true;
  for(const [k,n] of Object.entries(r.need))take(k,n);
  add(r.out);advance(20);sfx('craft');say(`Crafted: ${ITEMS[r.out].n.toLowerCase()}.`,'good');renderSide();
}
function finishChannel(){
  const c=channel;channel=null;
  if(c.kind==='pick'){sfx('unlock');if(c.x===35&&c.y===25)S.mf.komOpen=true;mod(c.x,c.y,T.DOOR);advance(15);say('The lock clicks open.','good')}
  if(c.kind==='cut'){sfx('snip');mod(c.x,c.y,T.CUT);advance(30);say('The last strand parts. There is a gap in the wire.','good')}
}
function computeFocus(){
  focus=null;let best=1.35;
  const tryF=(d,f)=>{if(d<best){best=d;focus=f}};
  NPCS.forEach(n=>{const p=npcPos(n);tryF(Math.hypot(p[0]-P.x,p[1]-P.y),{type:'npc',id:n.id,label:`Talk to ${n.name}`})});
  guards.forEach(g=>{if(g.onDuty&&!illegality())tryF(Math.hypot(g.x-P.x,g.y-P.y),{type:'guard',id:g.id,label:`Talk to ${g.name}`})});
  OBJ.forEach(o=>tryF(Math.hypot(o.x+.5-P.x,o.y+.5-P.y)+0.05,{type:'obj',o,label:objLabel(o)}));
  const tx=Math.floor(P.x),ty=Math.floor(P.y);
  for(let y=ty-1;y<=ty+1;y++)for(let x=tx-1;x<=tx+1;x++){
    const t=get(x,y),d=Math.hypot(x+.5-P.x,y+.5-P.y);
    if(t===T.LDOOR)tryF(d,{type:'ldoor',x,y,label:has('lockpick')?'Pick the lock':'Locked door'});
    if(t===T.FENCE&&has('cutters')&&d<1.2)tryF(d+0.1,{type:'fence',x,y,label:'Cut the wire'});
  }
}
function objLabel(o){
  const v={bunk:'Use your bunk',board:'Take a bed board',stove:'Inspect the stove',work:'Work a shift',gate:'Approach the gate',flag:'Check the flagpole'}[o.k];
  return v||`Search ${o.label.toLowerCase()}`;
}
function npcPos(n){
  if(S.roll.open&&!isCurfew()){const i=NPCS.indexOf(n);return[20.5+i*1.4,28.5]}
  const p=isCurfew()?n.night:n.day;return[p[0]+.5,p[1]+.5];
}

/* ---------------- UPDATE ---------------- */
function blocked(x,y){const r=0.3;for(const [dx,dy] of [[-r,-r],[r,-r],[-r,r],[r,r]]){if(BLOCK.has(get(Math.floor(x+dx),Math.floor(y+dy))))return true}return false}
function update(dt){
  clock+=dt;
  if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').hidden=true}
  if(paused){audioTick(dt,0);return}
  const ox=P.x,oy=P.y;
  P.crouch=!!(keys.crouch||P.ctog);
  let mx=(keys.right?1:0)-(keys.left?1:0), my=(keys.down?1:0)-(keys.up?1:0);
  if(mx||my){
    if(channel){channel=null;toast('Interrupted.')}
    const l=Math.hypot(mx,my);mx/=l;my/=l;P.fx=mx;P.fy=my;
    const sp=(P.crouch?1.9:3.6)*dt;
    if(!blocked(P.x+mx*sp,P.y))P.x+=mx*sp;
    if(!blocked(P.x,P.y+my*sp))P.y+=my*sp;
  }
  if(channel){channel.p+=dt/channel.dur;if(channel.p>=1)finishChannel()}
  P.moving=Math.hypot(P.x-ox,P.y-oy)>0.001;
  {const dt_=get(Math.floor(P.x),Math.floor(P.y));if(dt_===T.DOOR&&P.lastTile!==T.DOOR&&AU.sfx&&window.RWSFX)RWSFX.play('door_creak',{vol:.32,vary:.1,dest:AU.master});P.lastTile=dt_}
  audioTick(dt,Math.hypot(P.x-ox,P.y-oy)*(P.crouch?0.6:1));
  advance(dt*4);
  if(paused)return;
  if(S.roll.open&&inRect(P.x,P.y,ROLL)&&!S.roll.attended&&!isCurfew()){S.roll.attended=true;S.mf.rollcall=true;log('You fall in for roll call.')}
  updateGuards(dt);
  updateDetection(dt);
  if(paused)return;
  if(P.x<2.6||P.x>47.4||P.y<2.6||P.y>35.4){escape('wire');return}
  computeFocus();
  pebbleTick(dt);missionTick(dt);
  S.p.x=P.x;S.p.y=P.y;
}

/* ---------------- RENDER ---------------- */
const COL={snow:'#d8dcd6',ground:'#bdbcae',dead:'#a99f92',res:'#b6af9b',wall:'#4a3a2a',floor:'#8a6c4a',rfloor:'#76705f',door:'#a37b4d',road:'#9a9282',pine:'#2f4430'};
function render2D(){
  const s=TILE;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  let cx=P.x*s-VW/2, cy=P.y*s-VH/2;
  cx=Math.max(0,Math.min(MW*s-VW,cx));cy=Math.max(0,Math.min(MH*s-VH,cy));
  if(MW*s<VW)cx=(MW*s-VW)/2;if(MH*s<VH)cy=(MH*s-VH)/2;
  ctx.fillStyle='#0b0d09';ctx.fillRect(0,0,VW,VH);

/* fences and locked doors change during play, so they are rebuilt */
function rebuildDynamic(){
  paintGround();
  if(W3.dyn){W3.scene.remove(W3.dyn);W3.dyn.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  const grp=W3.dyn=new THREE.Group();
  const isF=t=>t===T.FENCE||t===T.IFENCE;
  const posts=[],segs=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=get(x,y);if(!(isF(t)||t===T.CUT))continue;
    const h=t===T.IFENCE?1.5:2.5;if((x+y)%2===0||t===T.CUT)posts.push([x+.5,y+.5,h]);
    if(t===T.CUT){segs.push(x+.2,1.2,y+.5,x+.35,.2,y+.7,x+.8,1.6,y+.5,x+.7,.3,y+.3);continue}
    [[1,0],[0,1]].forEach(([dx,dy])=>{const t2=get(x+dx,y+dy);if(t2!==t)return;
      const hs=t===T.IFENCE?[.35,.8,1.25]:[.3,.75,1.2,1.65,2.1,2.45];
      hs.forEach(hh=>segs.push(x+.5,hh,y+.5,x+dx+.5,hh,y+dy+.5));
      segs.push(x+.5,.15,y+.5,x+dx+.5,h-.2,y+dy+.5,x+.5,h-.2,y+.5,x+dx+.5,.15,y+dy+.5);
      if(t===T.FENCE){// coil on top
        for(let i=0;i<6;i++){const a1=i/6*Math.PI*2,a2=(i+1)/6*Math.PI*2,fx=(v,a)=>v+Math.cos(a)*.16*(dy?1:0),fz=(v,a)=>v+Math.cos(a)*.16*(dx?1:0);
          segs.push(fx(x+.5+dx*i/6,a1),h+.18+Math.sin(a1)*.16,fz(y+.5+dy*i/6,a1),fx(x+.5+dx*(i+1)/6,a2),h+.18+Math.sin(a2)*.16,fz(y+.5+dy*(i+1)/6,a2))}}
    });
  }
  const pm=new THREE.InstancedMesh(new THREE.BoxGeometry(.11,1,.11),PM(0x4a3a2a),posts.length);
  const d=new THREE.Object3D();
  posts.forEach(([x,z,h],i)=>{d.position.set(x,h/2,z);d.scale.set(1,h+0.25,1);d.updateMatrix();pm.setMatrixAt(i,d.matrix)});
  pm.castShadow=true;grp.add(pm);
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(segs,3));
  grp.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x26221e})));
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(get(x,y)===T.LDOOR){
    const vert=get(x,y-1)===T.WALL;
    box(vert?.22:.92,1.5,vert?.92:.22,PM(0x4e3420),x+.5,.75,y+.5,grp);
    box(.1,.14,.1,PM(0xc9a040,{emissive:0x332200}),x+(vert?.35:.5),.85,y+(vert?.5:.35),grp);
  }
  W3.scene.add(grp);
}

/* ---------------- STEALTH: crouching, pebbles, noise ---------------- */
let pebble=null,ripple=null,throwCd=0;
function clearPath(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/0.2);for(let i=1;i<=n;i++){const x=ax+(bx-ax)*i/n,y=ay+(by-ay)*i/n;if(BLOCK.has(get(Math.floor(x),Math.floor(y))))return false}return true}
function throwPebble(){
  if(paused||throwCd>0||pebble)return;
  let ex=P.x,ey=P.y;const l=Math.hypot(P.fx,P.fy)||1,dx=P.fx/l,dy=P.fy/l;
  for(let d=0.3;d<=4.8;d+=0.15){const x=P.x+dx*d,y=P.y+dy*d;if(BLOCK.has(get(Math.floor(x),Math.floor(y))))break;ex=x;ey=y}
  pebble={sx:P.x,sy:P.y,ex,ey,t:0,dur:.55};throwCd=1.6;sfx('paper');
}
function pebbleTick(dt){
  throwCd=Math.max(0,throwCd-dt);
  if(ripple){ripple.t+=dt;if(ripple.t>1)ripple=null}
  if(!pebble)return;pebble.t+=dt;
  if(pebble.t>=pebble.dur){const {ex,ey}=pebble;pebble=null;ripple={x:ex,y:ey,t:0};sfx('click');sfx('snip');
    let any=false;
    guards.forEach(g=>{if(!g.onDuty||g.blind)return;const d=Math.hypot(g.x-ex,g.y-ey);
      if(d<8&&clearPath(g.x,g.y,ex,ey)){g.inv={x:ex,y:ey,phase:'go',t:0,back:{x:g.x,y:g.y}};if(!any){any=true;speak(['Was war das?','Hm? Wer ist da?','Da war was…'][Math.floor(Math.random()*3)],g.id)}}});
    if(any)toast('A guard goes to look.');
  }
}
function investigate(g,dt){
  const v=g.inv,mv=(tx,ty,sp)=>{const d=Math.hypot(tx-g.x,ty-g.y);if(d<0.15)return true;g.x+=(tx-g.x)/d*Math.min(d,sp*dt);g.y+=(ty-g.y)/d*Math.min(d,sp*dt);g.a+=angNorm(Math.atan2(ty-g.y,tx-g.x)-g.a)*Math.min(1,dt*6);return false};
  if(v.phase==='go'){if(mv(v.x,v.y,g.speed*1.15)){v.phase='look';v.t=3.2;v.a0=g.a}}
  else if(v.phase==='look'){v.t-=dt;g.a=v.a0+Math.sin(v.t*1.6)*1.3;if(v.t<=0)v.phase='back'}
  else if(mv(v.back.x,v.back.y,g.speed))g.inv=null;
}

  const u=W3.me.userData;u.cs=(u.cs||1)+((P.crouch?0.72:1)-(u.cs||1))*Math.min(1,dt*10);W3.me.scale.set(1,u.cs,1);

function drawObjOverlay(){
  const t=objTarget();
  if(t&&!S.done&&!paused){const [sx,sy,ok]=project(t[0],1.2,t[1]);const m=40;
    const on=ok&&sx>m&&sx<VW-m&&sy>m&&sy<VH-m;
    const d=Math.round(Math.hypot(t[0]-P.x,t[1]-P.y)*2);
    ctx.font="600 12px 'IBM Plex Mono', monospace";ctx.textAlign='center';
    if(!on){const cx=VW/2,cy=VH/2;let dx=sx-cx,dy=sy-cy;if(!ok){dx=-dx;dy=-dy}const a=Math.atan2(dy,dx);
      const r=Math.min((VW/2-m)/Math.max(1e-3,Math.abs(Math.cos(a))),(VH/2-m)/Math.max(1e-3,Math.abs(Math.sin(a))));const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#ffb52e';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-4,0);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();ctx.restore();
      ctx.fillStyle='#ffd58a';ctx.fillText(d+' m',x-Math.cos(a)*26,y-Math.sin(a)*26+4)}
    else{const [bx,by]=project(t[0],3.2,t[1]);ctx.fillStyle='#ffd58a';ctx.fillText(d+' m',bx,by)}
  }
  if(S.mission===2)RECON.forEach((r,i)=>{const v=F()['obs'+i];if(v>0&&v<1){const w=190,x=(VW-w)/2,y=VH/2+64;ctx.fillStyle='rgba(15,18,12,.85)';ctx.fillRect(x-6,y-18,w+12,32);ctx.fillStyle='#333';ctx.fillRect(x,y,w,6);ctx.fillStyle='#ffb52e';ctx.fillRect(x,y,w*v,6);ctx.font="600 12px 'IBM Plex Mono', monospace";ctx.fillStyle='#efe6cc';ctx.textAlign='center';ctx.fillText('Observing '+r.n,VW/2,y-5)}});
  if(P.crouch&&!paused){ctx.font="600 12px 'IBM Plex Mono', monospace";ctx.textAlign='left';ctx.fillStyle='rgba(15,18,12,.8)';ctx.fillRect(10,VH-34,112,22);ctx.fillStyle='#93b26e';ctx.fillText('CROUCHED',22,VH-19)}
}

      [`Win Brandt’s trust with chocolate, coffee, cigarettes (${S.trust}/5)`,S.trust>=5||S.gateDay!==null],['Pay coffee + 20 cigarettes for an unbolted gate',S.gateDay!==null],
      [S.gateDay!==null?`Be at the main gate on night of day ${S.gateDay}, 01:00–03:30`:'Be at the main gate 01:00–03:30 that night',false]]},
  ];
  const {v,tot}=kitOdds('');
  $('#pPlans').innerHTML=plans.map(p=>`<div class="plan ${p.ready?'ready':''}"><h4>${p.h}${p.ready?' · ready':''}</h4><ul>${p.steps.map(([t,d])=>`<li class="${d?'done':''}">${t}</li>`).join('')}</ul></div>`).join('')+
  `<div class="sec"><h3><span>Kit for the road</span><span>~${tot}% now</span></h3><p class="hint">Getting outside the wire is half of it. Carry these when you go to improve your odds of reaching Sweden. Escape rations come from Ashcroft once you have a working route.</p>
  <div class="list">${v.slice(1).map(([l,n,h])=>`<div class="row"><i class="c ${h?'on':''}" style="${h?'background:var(--ok)':''}"></i><span class="nm">${l}</span><span class="ct">${n>0?'+':''}${n}%</span></div>`).join('')}</div></div>`;
}
function renderLog(){$('#logList').innerHTML=S.log.map(l=>`<div class="${l.c}"><time>D${l.d} ${l.t}</time>${l.m}</div>`).join('')||'<div class="empty">Nothing yet.</div>'}
function nextEvent(){
  const m=minOf(S.t);
  if(S.roll.open&&!isCurfew())return S.roll.attended?'Counted ✓':'Roll call now!';
  if(m<1080&&m>=405)return'Roll call 18:00';
  if(m<1320&&m>=1125)return'Bed check 22:00';
  return'Roll call 06:00';
}
function renderHeader(){
  $('#hDay').textContent=`${Math.min(dayOf(S.t),LAST_DAY)} / ${LAST_DAY}`;$('#hTime').textContent=hhmm(S.t);$('#hNext').textContent=nextEvent();
  renderTracker();
  $('#hCig').textContent=S.cigs;$('#hHeat').style.width=S.heat+'%';$('#hHeat').style.background=S.heat>66?'var(--rust)':'var(--amber)';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){sideTab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('aside .pane').forEach(p=>p.hidden=p.id!=='p'+cap(sideTab));renderSide();renderLog();return}
  if(b.dataset.wear){const k=b.dataset.wear;S.wearing=S.wearing===k?null:k;say(S.wearing?'You pull on the guard uniform. Keep your distance from real guards.':'You take off the uniform.');renderSide();return}
  if(b.dataset.stash){const k=b.dataset.stash;if(S.wearing===k)S.wearing=null;const n=count(k);take(k,n);add(k,n,'stash');renderSide();return}
  if(b.dataset.take){const k=b.dataset.take;const n=S.stash[k];take(k,n,'stash');add(k,n);renderSide();return}
  if(b.dataset.craft){craft(RECIPES[+b.dataset.craft]);return}
  if(b.id==='bSfx'){toggleSfx();return}
  if(b.id==='bVoice'){toggleVoice();return}
  if(b.id==='bFull'){toggleFull();return}
  if(b.id==='bSide'){toggleSide();return}
});

/* ---------------- INPUT ---------------- */
const KMAP={ShiftLeft:'crouch',ShiftRight:'crouch',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(KMAP[e.code]){keys[KMAP[e.code]]=true;if(!ovOpen)e.preventDefault()}
  if(dlgOpen){if(e.key==='Escape')closeDlg();const n=parseInt(e.key,10);if(n>=1&&n<=dlgOptsFns.length){const o=dlgOptsFns[n-1];if(!o.off)o.f()}return}
  if(W3.ok&&(e.key==='-'||e.key==='='||e.key==='+')){W3.zoom=Math.max(0.55,Math.min(1.6,W3.zoom*(e.key==='-'?1.1:0.9)))}
  if(e.code==='KeyC'&&!dlgOpen&&!ovOpen)P.ctog=!P.ctog;
  if(e.code==='KeyQ'&&!dlgOpen&&!ovOpen)throwPebble();
  if(e.code==='KeyM'&&!dlgOpen)toggleSfx();
  if(e.code==='KeyV'&&!dlgOpen)toggleVoice();
  if(e.code==='KeyF'&&!dlgOpen){e.preventDefault();toggleFull()}
  if(e.code==='Tab'&&document.body.classList.contains('fs')){e.preventDefault();toggleSide()}
  if((e.code==='KeyE'||e.code==='Space')&&!ovOpen){e.preventDefault();interact()}
});
addEventListener('keyup',e=>{if(KMAP[e.code])keys[KMAP[e.code]]=false});
addEventListener('blur',()=>{keys={}});
document.querySelectorAll('#touch [data-k]').forEach(b=>{
  const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});
$('#tAct').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
$('#tCrouch').addEventListener('pointerdown',e=>{e.preventDefault();P.ctog=!P.ctog});
$('#tThrow').addEventListener('pointerdown',e=>{e.preventDefault();throwPebble()});
if(matchMedia('(pointer:coarse)').matches)$('#touch').hidden=false;

/* ---------------- SAVE ---------------- */
const KEY='breakout-45-v1';
function save(){try{S.p={x:P.x,y:P.y};localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}
function useState(st){
  map.fill(0);LABELS.length=0;
  rebuild();worldDirty=true;
  S=st;S.mission=S.mission||0;S.od=S.od||{};S.mf=S.mf||{};S.missionsDone=S.missionsDone||0;applyMods();P.x=S.p.x;P.y=S.p.y;alarm=0;channel=null;initGuards();renderSide();renderLog();
}
function newGame(){
  clearSave();RWB.send('start');
  useState(freshState());
  S.seenIntro=true;
  log('Day 1. 14 days until the evacuation march. Roll call is on: get to the Appellplatz.');
  audioInit();sfx('whistle');speak('January 1945. Fourteen days until the camp is marched west. Roll call is on. Get to the Appellplatz.','narrator');
  hideOv();S.pendingBrief=true;renderSide();
}

/* ---------------- INTRO ---------------- */
function intro(){
  const sv=loadSave();
  showOv(`<div class="stampline">Stalag Waldheim · Prisoner file 7-114</div><h2>Breakout ’45</h2>
  <p>January 1945. You are an Allied airman in Lager Waldheim, a prison camp in snowbound Silesia. The Red Army is sixty kilometres east, and the guards say the whole camp will be marched west in <b>14 days</b>.</p>
  <p>Get out before then. Steal tools, craft gear, and make deals with the other prisoners, or with a guard who can be bought. Dig, cut, bluff or bribe your way past the wire.</p>
  <p>The camp’s escape committee will brief you mission by mission. Follow the amber marker. Crouch to stay unseen and throw pebbles to send guards the wrong way.</p>
  <div class="btns">${sv&&!sv.done?`<button id="bCont">Continue · day ${dayOf(sv.t)}</button><button class="alt" id="bNew">New game</button>`:'<button id="bNew">Begin</button>'}</div>
  <div class="keys"><b>Move</b><span>WASD / arrow keys</span><b>Interact</b><span>E or Space: search, talk, use</span><b>Dialog</b><span>1–9 or click; Esc to leave</span><b>Crouch</b><span>Hold Shift or press C: slower, quieter, harder to see</span><b>Distract</b><span>Q throws a pebble ahead of you; nearby guards go to look</span><b>Camera</b><span>Mouse wheel or +/− to zoom</span><b>Audio</b><span>M toggles sound, V toggles voices. Turn your sound up.</span><b>Screen</b><span>F or the ⛶ button for fullscreen</span><b>Gamepad</b><span>Stick or D-pad move · A interact/confirm · B crouch · X pebble · D-pad picks dialog options</span><b>Survive</b><span>Make every roll call (06:00 and 18:00). Be in your hut by 22:00. Hide contraband in your bunk.</span><b>Stealth</b><span>Stay out of guard sight cones and searchlights when you’re somewhere you shouldn’t be.</span></div>`);
  $('#bNew').onclick=newGame;
  if($('#bCont'))$('#bCont').onclick=()=>{useState(sv);hideOv();RWB.send('start');log('You pick up where you left off.')};
}

/* ---------------- LOOP ---------------- */
function resize(){
  const st=$('#stage');const w=Math.max(1,st.clientWidth);
  TILE=w<560?24:30;DPR=Math.min(2,window.devicePixelRatio||1);
  VW=w;const isFs=document.body.classList.contains('fs');VH=isFs?Math.max(240,Math.round(window.innerHeight-st.getBoundingClientRect().top-8)):Math.round(Math.max(320,Math.min(window.innerHeight*0.74,w*0.66)));
  cv.width=VW*DPR;cv.height=VH*DPR;cv.style.width=VW+'px';cv.style.height=VH+'px';dk.width=cv.width;dk.height=cv.height;
  const gl=$('#gl');gl.style.width=VW+'px';gl.style.height=VH+'px';
  if(W3.ok){W3.r.setPixelRatio(Math.min(1.75,DPR));W3.r.setSize(VW,VH,false);W3.cam.aspect=VW/VH;W3.cam.updateProjectionMatrix()}
}
addEventListener('resize',resize);
try{new ResizeObserver(()=>resize()).observe($('#stage'))}catch(e){}
let last=performance.now(), hudT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  try{if(VW<10)resize();update(dt);if(W3.ok)render3D(dt);else render2D()}catch(err){console.error(err)}
  hudT+=dt;if(hudT>0.4){hudT=0;renderHeader();if(sideTab==='kit'){const nb=nearBunk();if(nb!==frame.nb){frame.nb=nb;renderKit()}}}
  requestAnimationFrame(frame);
}
function start(data){
  renderAudioBtns();
  resize();if(!init3D())console.warn('3D unavailable, using 2D view');resize();
  if(data&&data.S){useState(data.S);if(data.S.seenIntro&&!data.S.done){hideOv()}else intro()}
  else{initGuards();renderSide();renderLog();intro()}
  requestAnimationFrame(frame);
}
/* ---------------- RETRO WORLD bridge ---------------- */
const RWB={send(t,x){try{if(parent!==window)parent.postMessage(Object.assign({source:'retro-world-game',type:t,gameId:'breakout-45.html',title:"BREAKOUT '45"},x||{}),'*')}catch(e){}},ach(k){this.send('achievement',{achievement:k})}};

/* ---------------- FULLSCREEN ---------------- */
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function setFsClass(on){document.body.classList.toggle('fs',on);const b=$('#bFull');if(b)b.textContent=on?'⛶ Exit fullscreen':'⛶ Fullscreen';setTimeout(resize,60);setTimeout(resize,300)}
function toggleFull(){
  const de=document.documentElement;
  if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(document.body.classList.contains('fs')&&!fsEl()){setFsClass(false);return}
  const req=de.requestFullscreen||de.webkitRequestFullscreen;
  if(req){try{const p=req.call(de);if(p&&p.then)p.then(()=>setFsClass(true),()=>setFsClass(true));else setFsClass(true);setTimeout(()=>{if(!document.body.classList.contains('fs'))setFsClass(true)},500)}catch(e){setFsClass(true)}}else setFsClass(true);
  try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>setFsClass(!!fsEl())));
function toggleSide(){const b=document.body;if(matchMedia('(max-width:900px)').matches)b.classList.toggle('sb');else b.classList.toggle('nosb');setTimeout(resize,60)}

/* ---------------- GAMEPAD ---------------- */
const GP={prev:[],sel:0,rep:0};
function gpPoll(dt){
  const pads=navigator.getGamepads?navigator.getGamepads():[];let p=null;for(const x of pads)if(x&&x.connected){p=x;break}
  if(!p){if(GP.had){['up','down','left','right'].forEach(k=>keys[k]=false);GP.had=false}return}
  GP.had=true;
  const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed),hit=i=>b(i)&&!GP.prev[i];
  const ax=p.axes[0]||0,ay=p.axes[1]||0,dz=.35;
  const L=b(14)||ax<-dz,Rr=b(15)||ax>dz,U=b(12)||ay<-dz,D=b(13)||ay>dz;
  if(dlgOpen||ovOpen){
    ['up','down','left','right'].forEach(k=>keys[k]=false);
    const btns=[...document.querySelectorAll(dlgOpen?'#dOpts button':'#ovCard button')].filter(x=>!x.disabled);
    if(btns.length){
      GP.rep-=dt;
      if((U||D)&&GP.rep<=0){GP.sel=(GP.sel+(D?1:-1)+btns.length)%btns.length;GP.rep=.22;btns[GP.sel].focus()}
      if(!U&&!D)GP.rep=0;
      if(hit(0)){const t=btns[Math.min(GP.sel,btns.length-1)]||btns[0];GP.sel=0;t.click()}
      if(hit(1)&&dlgOpen)closeDlg();
    }
  }else{
    keys.left=L;keys.right=Rr;keys.up=U;keys.down=D;GP.sel=0;
    if(hit(0))interact();
    if(hit(1))P.ctog=!P.ctog;
    if(hit(2))throwPebble();
    if(W3.ok&&(b(4)||b(6)))W3.zoom=Math.min(1.6,W3.zoom*(1+dt));
    if(W3.ok&&(b(5)||b(7)))W3.zoom=Math.max(0.55,W3.zoom*(1-dt));
  }
  if(hit(9))toggleFull();
  if(hit(8)){const order=['missions','kit','plans','log'];const nx=order[(order.indexOf(sideTab)+1)%4];const tb=document.querySelector(`.tabs [data-tab="${nx}"]`);tb&&tb.click()}
  GP.prev=p.buttons.map(x=>x.pressed);
}
(function(){let l=performance.now();function loop(n){const dt=Math.min(.05,(n-l)/1000);l=n;try{gpPoll(dt)}catch(e){}requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
addEventListener('gamepadconnected',()=>{try{toast('Controller connected: A interact · B crouch · X pebble')}catch(e){}});
/* pause sound when the tab is hidden */
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();keys={}}});

start({});
</script>
