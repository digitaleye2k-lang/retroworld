<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Popshot · Color Quest</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="game.css"></head><body>
<div id="world"></div><div id="damage"></div><header><button id="back">← RETRO WORLD</button><b>POPSHOT<span>COLOR QUEST</span></b><button id="new-tab">NEW TAB ↗</button><button id="fullscreen">FULLSCREEN</button><button id="sound">SOUND ON</button></header>
<div id="overlay"><section class="panel"><div class="eyebrow">A SOLO CARTOON ADVENTURE</div><h1 id="panel-title">POPSHOT</h1><p id="panel-copy">Loading your adventure…</p><button id="primary" class="primary">LOADING…</button><button id="menu-button" class="secondary hidden">WORLD SELECT</button><div id="level-grid"></div><p class="controls">WASD move · Mouse aim · Click fire · Space ×2 jump<br>Shift sprint · 1–8 weapons · R reload · B build · Esc pause</p></section></div>
<div id="hud" class="hidden"><div class="mission"><small id="level-number"></small><h2 id="level-name"></h2><span id="remaining"></span></div><div class="score"><span>POINTS</span><b id="score">0</b><button id="pause">Ⅱ PAUSE</button></div><div id="boss" class="hidden"><strong id="boss-name"></strong><div><i id="boss-fill"></i></div></div><div class="bottom"><div class="health"><span>♥ HEALTH <b id="health">100</b></span><div><i id="health-fill"></i></div></div><div class="ammunition"><small id="weapon-name"></small><b id="ammo">24</b><span>R TO REFILL</span></div></div><div class="build-tools"><button id="build-button">B · BUILD / BLASTER</button><span id="build-hint" class="hidden"></span></div><div id="loadout"></div><div class="crosshair">+</div><div class="touch"><div id="joystick" aria-label="Movement joystick"><span id="joystick-stick"></span></div><span class="look-hint">SWIPE SCREEN TO LOOK</span><div class="actions"><button id="touch-fire">FIRE / THROW</button><button id="touch-reload">RELOAD</button><button id="touch-jump">JUMP ×2</button></div></div></div><div id="toast"></div>
<script>addEventListener('error',function(e){if(document.getElementById('primary').textContent==='LOADING…'){document.getElementById('panel-title').textContent='3D GAME UNAVAILABLE';document.getElementById('panel-copy').textContent='Enable hardware acceleration in your browser, then reload. '+(e.message||'');}});</script><script src="game.js"></script></body></html>
