<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Popshot · Color Quest</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="game.css"></head><body>
<div id="world"></div><div id="damage"></div><header><button id="back">← RETRO WORLD</button><b>POPSHOT<span>COLOR QUEST</span></b><button id="new-tab">NEW TAB ↗</button><button id="fullscreen">FULLSCREEN</button><button id="sound">SOUND ON</button></header>
<div id="overlay"><section class="panel"><div class="eyebrow">A SOLO CARTOON ADVENTURE</div><h1 id="panel-title">POPSHOT</h1><p id="panel-copy">Loading your adventure…</p><button id="primary" class="primary">LOADING…</button><button id="menu-button" class="secondary hidden">WORLD SELECT</button><div id="level-grid"></div><p class="controls">WASD move · Mouse aim · Click fire · Space ×2 jump<br>Shift sprint · 1–8 weapons · R reload · B build · Esc pause</p></section></div>
<div id="hud" class="hidden"><div class="mission"><small id="level-number"></small><h2 id="level-name"></h2><span id="remaining"></span></div><div class="score"><span>POINTS</span><b id="score">0</b><button id="pause">Ⅱ PAUSE</button></div><div id="boss" class="hidden"><strong id="boss-name"></strong><div><i id="boss-fill"></i></div></div><div class="bottom"><div class="health"><span>♥ HEALTH <b id="health">100</b></span><div><i id="health-fill"></i></div></div><div class="ammunition"><small id="weapon-name"></small><b id="ammo">24</b><span>R TO REFILL</span></div></div><div class="build-tools"><button id="build-button">B · BUILD / BLASTER</button><span id="build-hint" class="hidden"></span></div><div id="loadout"></div><div class="crosshair"><i></i><i></i><i></i><i></i></div><div id="hitmark" aria-hidden="true"></div><div id="combo" aria-hidden="true"></div><div class="touch"><div id="joystick" aria-label="Movement joystick"><span id="joystick-stick"></span></div><span class="look-hint">SWIPE SCREEN TO LOOK</span><div class="actions"><button id="touch-fire">FIRE / THROW</button><button id="touch-reload">RELOAD</button><button id="touch-jump">JUMP ×2</button></div></div></div><div id="toast"></div>
<script>addEventListener('error',function(e){if(document.getElementById('primary').textContent==='LOADING…'){document.getElementById('panel-title').textContent='3D GAME UNAVAILABLE';document.getElementById('panel-copy').textContent='Enable hardware acceleration in your browser, then reload. '+(e.message||'');}});</script><script src="game.js"></script><script>
(()=>{const send=(type,extra={})=>{try{parent.postMessage(Object.assign({source:'retro-world-game',type,gameId:'popshot.html',title:'POPSHOT: COLOR QUEST'},extra),'*')}catch(e){}};let prev='menu',lastScore=-1;setInterval(()=>{try{const snap=window.__popshotCampaign&&window.__popshotCampaign.snapshot?window.__popshotCampaign.snapshot():null;if(!snap)return;if(snap.mode==='play'&&prev!=='play')send('start');if(Number.isFinite(Number(snap.score))&&snap.score!==lastScore){lastScore=snap.score;send('progress',{metric:'score',value:Number(snap.score),higherBetter:true})}if(snap.mode==='clear'&&prev==='play'){send('achievement',{achievement:'world_clear'});let completed=false;try{completed=!!JSON.parse(localStorage.getItem('popshotSoloSave')||'{}').completed}catch(e){}if(completed)send('achievement',{achievement:'campaign_complete'});send('finish',{result:'win',metric:'score',value:Number(snap.score)||0,higherBetter:true})}if(snap.mode==='dead'&&prev==='play')send('finish',{result:'loss',metric:'score',value:Number(snap.score)||0,higherBetter:true});prev=snap.mode}catch(e){}},250)})();
</script><script>
(()=>{
  // ---- extras: hit marker, kill combos, auto-pause, adaptive resolution ----
  const hm=document.getElementById('hitmark'),cb=document.getElementById('combo');
  let hmT=0,streak=0,streakT=0,comboT=0,best=0;
  window.__popHit=(kill)=>{if(!hm)return;hm.className='';void hm.offsetWidth;hm.className=kill?'kill':'hit'};
  window.__popKill=(boss)=>{const now=performance.now();streak=(now-streakT<4200)?streak+1:1;streakT=now;if(streak>best)best=streak;
    const bonus=streak>1?Math.min(10,streak-1)*25:0;
    if(streak>1&&cb){cb.textContent='COMBO x'+streak+'  +'+bonus;cb.className='';void cb.offsetWidth;cb.className='show'}
    return bonus};
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&window.__popPause)try{window.__popPause()}catch(e){}});
  addEventListener('blur',()=>{if(window.__popPause)try{window.__popPause()}catch(e){}});
  // adaptive pixel ratio: drop resolution when the device struggles, never below .7
  let acc=0,n=0,last=performance.now(),ratio=null,calm=0;
  function watch(now){const dt=now-last;last=now;const r=window.__popRenderer;
    if(r&&dt<250){acc+=dt;n++;if(ratio===null)ratio=r.getPixelRatio();
      if(n>=90){const avg=acc/n;acc=0;n=0;
        if(avg>26&&ratio>.7){ratio=Math.max(.7,ratio-.25);r.setPixelRatio(ratio);calm=0}
        else if(avg<15){calm++;if(calm>=4&&ratio<Math.min(devicePixelRatio,1.5)){ratio=Math.min(Math.min(devicePixelRatio,1.5),ratio+.25);r.setPixelRatio(ratio);calm=0}}else calm=0}}
    requestAnimationFrame(watch)}
  requestAnimationFrame(watch);
})();
</script></body></html>
