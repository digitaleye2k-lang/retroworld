 for(const b of BODIES){const x=cx+b.x*s,y=cy+b.y*s;ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(x,y,b.id==='sun'?4:Math.max(1.6,b.R*s*.6),0,TAU);ctx.fill();if(!charted[b.id]){ctx.strokeStyle='rgba(255,230,160,'+(.4+.4*Math.sin(t*4))+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,5+Math.sin(t*4)*1.5,0,TAU);ctx.stroke()}}

 if(navB&&!lastZone){const[sx,sy]=S(navB.x,navB.y);const d=Math.hypot(navB.x-ship.x,navB.y-ship.y);const ex=clamp(sx,40,LW-40),ey=clamp(sy,60,LH-70);if(ex!==sx||ey!==sy){const a=Math.atan2(sy-LH/2,sx-LW/2);ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.fillStyle='rgba(255,230,160,.9)';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-8,9);ctx.fill();ctx.restore();text(navB.name+'  '+Math.round(d/100)/10+'k',clamp(ex-Math.cos(a)*50,70,LW-70),clamp(ey-Math.sin(a)*30,60,LH-60),11,'#ffe9a0')}}

 if(logShow>0){const a=Math.min(1,logShow,(9-logShow)*1.2);ctx.globalAlpha=a*.85;ctx.font='italic 14px Georgia,serif';ctx.textAlign='center';ctx.fillStyle='#cfe0ff';const ls=wrapText(LOGS[logI],560,14);ls.forEach((s,i)=>{ctx.font='italic 14px Georgia,serif';ctx.fillText(s,LW/2,LH-86+i*18)});ctx.globalAlpha=1}
 if(TOUCH&&!stick&&mode==='play'&&score<30)text('DRAG TO FLY · DRAG FAR TO BOOST',LW/2,LH-14,12,'#9fb4e8');else if(!TOUCH&&mode==='play'&&t<9999&&score<30)text('W/A/D fly · S brake · SHIFT boost · SPACE fire (auto-aim on)',LW/2,LH-14,12,'#9fb4e8');
 if(stick){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(stick.sx,stick.sy,56,0,TAU);ctx.stroke();ctx.fillStyle='rgba(160,220,255,.4)';const dx=stick.x-stick.sx,dy=stick.y-stick.sy,d=Math.hypot(dx,dy)||1,k=Math.min(d,56)/d;ctx.beginPath();ctx.arc(stick.sx+dx*k,stick.sy+dy*k,20,0,TAU);ctx.fill()}

/* RETRO WORLD profile bridge: report start / progress / finish to the arcade (trophies, quests, streaks) */
(()=>{const GID="lonely-universe.html",GT="LONELY UNIVERSE".toUpperCase();let act=false,last=0,fin=false;
const send=(t,x)=>{try{parent.postMessage(Object.assign({source:'retro-world-game',type:t,gameId:GID,title:GT},x||{}),'*')}catch(e){}};
const val=()=>{try{return Math.max(0,Math.round(Number(score)||0))}catch(e){return 0}};
const snap=()=>send('progress',{metric:'score',value:val(),higherBetter:true});
setInterval(()=>{let m='';try{m=String(mode)}catch(e){return}
const playing=(m==='play'||m==='clear'||m==='dying'),now=Date.now();
if(playing&&!act){act=true;fin=false;send('start');snap();last=now}
if(act&&playing&&now-last>1500){snap();last=now}
if(act&&!fin&&(m==='win'||m==='over')){fin=true;act=false;send('finish',{metric:'score',value:val(),higherBetter:true,result:m==='win'?'win':'lose'})}
if(!playing&&m==='menu'){act=false}},250);
addEventListener('pagehide',()=>{if(act)snap()});})();
