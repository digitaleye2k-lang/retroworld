function mkTex(id,w,h,cloud){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const R=mul32(id.length*977+id.charCodeAt(0)*31+(cloud?7:0));
 const grad=(cols)=>{const gg=g.createLinearGradient(0,0,0,h);cols.forEach((cc,i)=>gg.addColorStop(i/(cols.length-1),cc));g.fillStyle=gg;g.fillRect(0,0,w,h)};
 const bands=(cols,n,wob,al)=>{for(let i=0;i<n;i++){const y=R()*h,th=3+R()*14;g.globalAlpha=al*(.4+R()*.6);g.fillStyle=cols[Math.floor(R()*cols.length)];g.beginPath();g.moveTo(0,y);for(let x=0;x<=w;x+=16)g.lineTo(x,y+Math.sin(x*.03+i)*wob);for(let x=w;x>=0;x-=16)g.lineTo(x,y+th+Math.sin(x*.025+i*2)*wob);g.closePath();g.fill()}g.globalAlpha=1};
 const blots=(cols,n,sx,sy,al)=>{for(let i=0;i<n;i++){g.globalAlpha=al*(.3+R()*.7);g.fillStyle=cols[Math.floor(R()*cols.length)];g.beginPath();g.ellipse(R()*w,R()*h,sx*(.4+R()),sy*(.4+R()),0,0,TAU);g.fill()}g.globalAlpha=1};
 const craters=(n)=>{for(let i=0;i<n;i++){const x=R()*w,y=R()*h,r=2+R()*R()*22;g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1.2;g.beginPath();g.arc(x-.6,y-.6,r,Math.PI*.9,Math.PI*1.8);g.stroke()}};
 if(cloud){g.clearRect(0,0,w,h);for(let i=0;i<70;i++){g.globalAlpha=.25+R()*.45;g.fillStyle='#fff';const x=R()*w,y=h*.12+R()*h*.76;for(let k=0;k<6;k++){g.beginPath();g.ellipse(x+k*14*R(),y+(R()-.5)*10,16+R()*26,5+R()*8,0,0,TAU);g.fill()}}g.globalAlpha=1;return c}
 switch(id){
 case'sun':grad(['#ff9a20','#ffd45a','#ff9a20']);blots(['#ffe9a0','#e85a10','#fff6c8'],90,40,16,.35);break;

 case'earth':grad(['#06306a','#0e5aa8','#1a78c8','#0e5aa8','#06306a']);for(let k=0;k<26;k++){const cx=R()*w,cy=h*.16+R()*h*.68;for(let q=0;q<26;q++){g.fillStyle=R()<.7?'#2f8a3a':'#b49a5a';if(R()<.12)g.fillStyle='#e8e0c0';g.beginPath();g.ellipse(cx+(R()-.5)*70,cy+(R()-.5)*34,5+R()*16,4+R()*9,R()*3,0,TAU);g.fill()}}g.fillStyle='#f0f8ff';g.fillRect(0,0,w,h*.07);g.fillRect(0,h*.93,w,h*.07);break;
 case'mars':grad(['#a8502a','#c8683a','#b8582e']);blots(['#6a2e1a','#d8884a','#8a3a20'],110,36,14,.4);g.fillStyle='#fff';g.globalAlpha=.8;g.fillRect(0,0,w,h*.045);g.fillRect(0,h*.955,w,h*.045);g.globalAlpha=1;break;
 case'jupiter':grad(['#c8a070','#e8d8b8','#b88858','#f0e0c0','#a87848','#e0c898','#c09060']);bands(['#8a5a3a','#f0e0c0','#d8b88a','#a8794a','#fff0d8'],150,5,.5);g.fillStyle='#b0442a';g.beginPath();g.ellipse(w*.62,h*.64,50,24,0,0,TAU);g.fill();g.strokeStyle='#e8a070';g.lineWidth=4;g.stroke();g.fillStyle='#d8684a';g.beginPath();g.ellipse(w*.62,h*.64,28,12,0,0,TAU);g.fill();break;
 case'saturn':grad(['#d8c088','#f0e0b0','#c8a468','#ead8a0','#c8a468']);bands(['#e8d098','#f8ecc8','#b89458'],90,3,.4);break;

function mkNebula(pal,seed){const S=1024,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d'),R=mul32(seed);g.globalCompositeOperation='lighter';for(let i=0;i<30;i++){const x=R()*S,y=R()*S,r=130+R()*260,col=pal[Math.floor(R()*pal.length)],a=.05+R()*.1;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const X=x+dx*S,Y=y+dy*S;if(X+r<0||X-r>S||Y+r<0||Y-r>S)continue;const gr=g.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,'rgba('+col+','+a+')');gr.addColorStop(.55,'rgba('+col+','+a*.4+')');gr.addColorStop(1,'rgba('+col+',0)');g.fillStyle=gr;g.fillRect(X-r,Y-r,r*2,r*2)}}return c}
function mkGalaxy(seed,hue,arms){const S=420,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d'),R=mul32(seed);g.globalCompositeOperation='lighter';const gl=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S*.22);gl.addColorStop(0,'rgba(255,240,200,.9)');gl.addColorStop(.4,'rgba(255,200,140,.25)');gl.addColorStop(1,'rgba(255,200,140,0)');g.fillStyle=gl;g.fillRect(0,0,S,S);for(let i=0;i<3600;i++){const rr=Math.pow(R(),1.3)*S*.46,arm=Math.floor(R()*arms),th=arm*TAU/arms+rr*.026+(R()-.5)*.55*(1-rr/(S*.5)+.3);const x=S/2+Math.cos(th)*rr,y=S/2+Math.sin(th)*rr*.55;const k=rr/(S*.46);g.fillStyle='hsla('+(hue+k*60)+',80%,'+(80-k*30)+'%,'+(.25+R()*.4)+')';g.fillRect(x,y,1+R()*1.6,1+R()*1.6)}return c}
