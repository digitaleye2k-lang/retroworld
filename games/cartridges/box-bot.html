<!doctype html><html><head><script src="rw-boost.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOX BOT • RETRO WORLD</title><style>
html,body{height:100%;margin:0;background:#03050c;color:#fff;font-family:"Courier New",monospace}
body{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#151735,#03050c 68%);overflow:hidden}
.wrap{width:min(96vw,900px);text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;min-height:34px}
.title{color:#4deaff;font-size:clamp(14px,3vw,20px);font-weight:900;letter-spacing:2px;text-shadow:2px 2px #4c165d}
.diff{display:flex;gap:5px;align-items:center;color:#949abc;font-size:8px}
.diff select{background:#0b0d1d;color:#fff;border:1px solid #4deaff;padding:5px;font:700 9px "Courier New",monospace}
.frame{position:relative;border:3px solid #4deaff;box-shadow:0 0 0 3px #181a36,0 0 28px #00eaff29;background:#050714}
canvas{display:block;width:100%;height:auto;max-height:calc(100dvh - 115px);object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none}
.help{margin-top:7px;color:#858bad;font-size:9px;line-height:1.45}
.help b{color:#e6d36f}
@media(max-width:650px){.wrap{width:99vw}.top{margin:2px 5px 4px}.help{font-size:7px;margin-top:4px}.diff span{display:none}}
</style><script>addEventListener('keydown',function(e){if((e.keyCode||e.which)===461&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'retroworld-tv-back'},'*');}},true);</script></head>
<body><div class="wrap"><div class="top"><div class="title">BOX BOT</div><div class="diff"><span>DIFFICULTY</span><select id="difficultySelect"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option></select></div></div>
<div class="frame"><canvas id="g" width="640" height="700"></canvas></div><div class="help"><b>ARROWS / WASD / SWIPE</b> MOVE • <b>Z</b> UNDO • <b>R</b> RESTART LEVEL • PUSH EVERY CRATE ONTO A PAD</div></div>
<script>

const c=document.getElementById('g'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const W=c.width,H=c.height;
let AC=null;
function beep(f,d,type,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||0.05;g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function ptr(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function txt(s,px,py,size,col,al){x.font='bold '+size+'px Courier New';x.fillStyle=col;x.textAlign=al||'center';x.fillText(s,px,py)}
function overlay(lines){x.fillStyle='rgba(3,5,12,.82)';x.fillRect(0,0,W,H);lines.forEach((l,i)=>txt(l[0],W/2,H/2-40+i*34,l[1],l[2]))}
const LEVELS=[["######", "#  @ #", "# $  #", "#   .#", "#  ###", "######"], ["######", "##   #", "# $  #", "#@#  #", "#.$. #", "######"], ["#######", "#     #", "# $ # #", "#  .$ #", "##  #+#", "#######"], ["#######", "#   # #", "#  $  #", "##@$# #", "##  . #", "#   . #", "#######"], ["#######", "#   ..#", "# $# .#", "# @ # #", "# # $$#", "# #   #", "#######"], ["########", "#.     #", "#$$$#  #", "# # ## #", "#  ..#@#", "#      #", "########"], ["########", "#  @ #.#", "## $ $ #", "# .## *#", "#      #", "#  #   #", "########"], ["########", "# ## $.#", "#.$.  ##", "#      #", "# .#   #", "# $@$  #", "#  # # #", "########"], ["########", "# #   .#", "# $  # #", "#@ #   #", "# #    #", "# $ #$*#", "##.  . #", "########"], ["#########", "#  #    #", "##   .  #", "#       #", "# #.# . #", "# $ $$###", "# *# @  #", "#########"]];
let state='title',difficulty='normal',lvl=0,grid,walls,goals,boxes,player,moves=0,undos=[],score=0,undoLeft=0,flash=0;
function diff(){difficulty=document.getElementById('difficultySelect').value}
function load(n){lvl=n;const rows=LEVELS[n];walls=new Set();goals=new Set();boxes=new Set();
 rows.forEach((row,r)=>[...row].forEach((ch,q)=>{const k=r+','+q;if(ch==='#')walls.add(k);if(ch==='.'||ch==='*'||ch==='+')goals.add(k);if(ch==='$'||ch==='*')boxes.add(k);if(ch==='@'||ch==='+')player=[r,q]}));
 moves=0;undos=[];undoLeft=difficulty==='easy'?999:difficulty==='normal'?15:0}
function reset(){diff();score=0;load(0);state='play'}
function snap(){return{p:player.slice(),b:[...boxes]}}
function step(dr,dc){if(state!=='play')return;const nr=player[0]+dr,nc=player[1]+dc,k=nr+','+nc;if(walls.has(k))return;
 const s=snap();
 if(boxes.has(k)){const bk=(nr+dr)+','+(nc+dc);if(walls.has(bk)||boxes.has(bk))return;boxes.delete(k);boxes.add(bk);beep(200,.05,'square')}else beep(440,.02,'triangle',.02);
 undos.push(s);player=[nr,nc];moves++;
 if([...boxes].every(b=>goals.has(b))){const bonus=Math.max(0,300-moves*3);score+=100+bonus;beep(660,.2);flash=20;if(lvl+1>=LEVELS.length){state='won'}else{setTimeout(()=>{load(lvl+1);flash=0},650)}}}
function undo(){if(state!=='play'||!undos.length)return;if(undoLeft<=0)return;undoLeft--;const s=undos.pop();player=s.p;boxes=new Set(s.b);moves=Math.max(0,moves-1)}
function skip(){if(state==='play'&&difficulty==='easy'&&lvl+1<LEVELS.length)load(lvl+1)}
function draw(){
 x.fillStyle='#050714';x.fillRect(0,0,W,H);
 if(state==='title'){txt('BOX BOT',W/2,170,48,'#4deaff');txt('PUSH EVERY CRATE ONTO A GLOWING PAD',W/2,230,16,'#ffe35b');txt('10 LEVELS • PUSH ONLY — NO PULLING',W/2,265,14,'#b5bbd5');txt('EASY: INFINITE UNDO + SKIP • NORMAL: 15 UNDOS • HARD: NO UNDO',W/2,300,11,'#b5bbd5');txt('CLICK / ENTER TO START',W/2,380,18,'#73ff89');return}
 const rows=LEVELS[lvl],R=rows.length,Cn=Math.max(...rows.map(r=>r.length)),cs=Math.min(64,Math.floor(520/Cn),Math.floor(380/R)),ox=(W-Cn*cs)/2,oy=130+(380-R*cs)/2;
 txt('BOX BOT',W/2,38,24,'#4deaff');txt('LEVEL '+(lvl+1)+'/'+LEVELS.length+'   MOVES '+moves+'   SCORE '+score+(undoLeft<900?'   UNDOS '+undoLeft:''),W/2,72,13,'#ffe35b');
 for(let r=0;r<R;r++)for(let q=0;q<Cn;q++){const k=r+','+q,px=ox+q*cs,py=oy+r*cs;
  if(walls.has(k)){x.fillStyle='#232a6b';x.fillRect(px,py,cs,cs);x.strokeStyle='#4560e0';x.lineWidth=2;x.strokeRect(px+2,py+2,cs-4,cs-4)}
  else if(rows[r][q]!==undefined&&rows[r][q]!==' '||true){const inside=!walls.has(k);if(inside&&(rows[r][q]!==undefined)){x.fillStyle=(r+q)%2?'#0c1030':'#0a0d28';x.fillRect(px,py,cs,cs)}}
  if(goals.has(k)){x.fillStyle='#1d6f4b';x.beginPath();x.arc(px+cs/2,py+cs/2,cs*.22,0,7);x.fill();x.strokeStyle='#73ff89';x.lineWidth=3;x.stroke()}
  if(boxes.has(k)){const on=goals.has(k);x.fillStyle=on?'#73ff89':'#e6a02a';x.fillRect(px+5,py+5,cs-10,cs-10);x.strokeStyle=on?'#0f5a2b':'#7a4b08';x.lineWidth=3;x.strokeRect(px+5,py+5,cs-10,cs-10);x.beginPath();x.moveTo(px+5,py+5);x.lineTo(px+cs-5,py+cs-5);x.moveTo(px+cs-5,py+5);x.lineTo(px+5,py+cs-5);x.stroke()}}
 const pp=player;x.fillStyle='#38e8ff';x.beginPath();x.arc(ox+pp[1]*cs+cs/2,oy+pp[0]*cs+cs/2,cs*.32,0,7);x.fill();x.fillStyle='#050714';x.fillRect(ox+pp[1]*cs+cs*.34,oy+pp[0]*cs+cs*.4,cs*.1,cs*.14);x.fillRect(ox+pp[1]*cs+cs*.58,oy+pp[0]*cs+cs*.4,cs*.1,cs*.14);
 // touch buttons
 const bx=[['◀',60,H-70],['▲',130,H-100],['▼',130,H-40],['▶',200,H-70]];bx.forEach(b=>{x.fillStyle='#14206b';x.fillRect(b[1]-27,b[2]-24,54,48);x.strokeStyle='#4deaff';x.lineWidth=2;x.strokeRect(b[1]-27,b[2]-24,54,48);txt(b[0],b[1],b[2]+8,22,'#fff')});
 [['UNDO',W-190,H-80],['RESTART',W-80,H-80]].forEach(b=>{x.fillStyle='#2a1450';x.fillRect(b[1]-45,b[2]-22,90,44);x.strokeStyle='#ff2bd6';x.strokeRect(b[1]-45,b[2]-22,90,44);txt(b[0],b[1],b[2]+5,13,'#fff')});
 txt('ARROWS / WASD MOVE • Z UNDO • R RESTART'+(difficulty==='easy'?' • N SKIP':''),W/2,H-12,11,'#858bad');
 if(flash>0){flash--;x.fillStyle='rgba(115,255,137,.18)';x.fillRect(0,0,W,H);txt('LEVEL CLEAR!',W/2,112,26,'#73ff89')}
 if(state==='won')overlay([['ALL LEVELS CLEARED!',34,'#73ff89'],['FINAL SCORE '+score,20,'#ffe35b'],['CLICK / ENTER TO PLAY AGAIN',14,'#fff']]);
}
function tap(p){const hit=(bx,by,w,h)=>p.x>=bx-w/2&&p.x<=bx+w/2&&p.y>=by-h/2&&p.y<=by+h/2;
 if(hit(60,H-70,54,48))step(0,-1);else if(hit(130,H-100,54,48))step(-1,0);else if(hit(130,H-40,54,48))step(1,0);else if(hit(200,H-70,54,48))step(0,1);
 else if(hit(W-190,H-80,90,44))undo();else if(hit(W-80,H-80,90,44)){load(lvl)}}
let sw=null;
c.addEventListener('pointerdown',e=>{if(state!=='play'){reset();return}const p=ptr(e);sw=p;tap(p)});
c.addEventListener('pointerup',e=>{if(!sw||state!=='play')return;const p=ptr(e),dx=p.x-sw.x,dy=p.y-sw.y;sw=null;if(Math.hypot(dx,dy)>40&&p.y<H-130){if(Math.abs(dx)>Math.abs(dy))step(0,dx>0?1:-1);else step(dy>0?1:-1,0)}});
addEventListener('keydown',e=>{const k=e.key;if(state!=='play'){if(k==='Enter'||k===' '){reset();e.preventDefault()}return}
 const m={ArrowUp:[-1,0],w:[-1,0],ArrowDown:[1,0],s:[1,0],ArrowLeft:[0,-1],a:[0,-1],ArrowRight:[0,1],d:[0,1]}[k];
 if(m){step(m[0],m[1]);e.preventDefault()}else if(k==='z'||k==='u'||k==='Backspace'){undo();e.preventDefault()}else if(k==='r'){load(lvl)}else if(k==='n'){skip()}});
document.getElementById('difficultySelect').addEventListener('change',()=>{if(state!=='play')diff()});
load(0);setInterval(draw,33);draw();

const RETRO_LOCAL_STATS=(()=>{
  const GAME_ID="box-bot.html", GAME_TITLE="BOX BOT";
  let active=false,lastProgress=0;
  function mode(){try{return String(state||'').toLowerCase()}catch(e){return ''}}
  function metric(){try{return {name:'score',value:Math.round(Number(score)||0),higher:true}}catch(e){return {name:'score',value:0,higher:true}}}
  function send(type,extra={}){try{parent.postMessage(Object.assign({source:'retro-world-game',type,gameId:GAME_ID,title:GAME_TITLE},extra),'*')}catch(e){}}
  function snapshot(){const m=metric();send('progress',{metric:m.name,value:m.value,higherBetter:m.higher})}
  setInterval(()=>{const now=Date.now(),md=mode(),playing=md==='play'||md==='playing'||md==='running',won=md==='win'||md==='won'||md==='victory'||md==='complete',lost=md==='over'||md==='gameover'||md==='lost'||md==='dead'||md==='fail'||md==='failed';
    if(playing&&!active){active=true;send('start');snapshot();lastProgress=now}
    if(active&&playing&&now-lastProgress>1200){snapshot();lastProgress=now}
    if(active&&(won||lost)){const m=metric();snapshot();send('finish',{result:won?'win':'loss',metric:m.name,value:m.value,higherBetter:m.higher});active=false}
  },250);
  addEventListener('pagehide',()=>{if(active)snapshot()});
  return{snapshot};
})();
</script></body></html>
