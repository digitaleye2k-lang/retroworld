 L.forEach((s,i)=>txt(s,W/2,H*.84+i*34,22,215,.75,'center',false));ctx.globalCompositeOperation='source-over'}

function bloomPass(){const hi=Q>.7;
 if(hi){b1x.globalCompositeOperation='copy';b1x.drawImage(cv,0,0,b1.width,b1.height);b2x.globalCompositeOperation='copy';b2x.drawImage(b1,0,0,b2.width,b2.height)}else{b2x.globalCompositeOperation='copy';b2x.drawImage(cv,0,0,b2.width,b2.height)}
 b3x.globalCompositeOperation='copy';b3x.drawImage(b2,0,0,b3.width,b3.height);
 ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';ctx.imageSmoothingEnabled=true;const pu=.82+beatPulse*.18+flash*.5;
 ctx.globalAlpha=.42*pu;ctx.drawImage(b2,0,0,cv.width,cv.height);ctx.globalAlpha=.5*pu;ctx.drawImage(b3,0,0,cv.width,cv.height);if(hi){ctx.globalAlpha=.22;ctx.drawImage(b1,0,0,cv.width,cv.height)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}

 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#02030a';ctx.fillRect(0,0,cv.width,cv.height);
 const sh=shake*.9;camX=sh?rnd(-sh,sh):0;camY=sh?rnd(-sh,sh):0;const z=1+zoom*.025;
 ctx.setTransform(S*z,0,0,S*z,OX+camX*S-(z-1)*W*S/2,OY+camY*S-(z-1)*H*S/2);
 drawBG(tt);drawGrid();drawFx();drawWorld(tt);
 // arena border
 ctx.globalCompositeOperation='lighter';ctx.strokeStyle=hsl(curHue+20,70,.5+beatPulse*.3);ctx.lineWidth=5;ctx.strokeRect(0,0,W,H);ctx.strokeStyle=hsl(curHue+20,50,.14);ctx.lineWidth=22;ctx.strokeRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
 drawHUD(tt);
 bloomPass();
 // flash + vignette
 ctx.setTransform(1,0,0,1,0,0);
 if(flash>0){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(180,220,255,'+Math.min(.4,flash*.35)+')';ctx.fillRect(0,0,cv.width,cv.height);ctx.globalCompositeOperation='source-over'}
 if(redFlash>0){ctx.fillStyle='rgba(255,20,60,'+redFlash*.25+')';ctx.fillRect(0,0,cv.width,cv.height)}
 if(!vig||vig.w!==cv.width||vig.h!==cv.height){const c=mk(cv.width/4,cv.height/4),x=c.getContext('2d'),g=x.createRadialGradient(c.width/2,c.height/2,c.height*.35,c.width/2,c.height/2,c.width*.62);g.addColorStop(0,'rgba(0,0,8,0)');g.addColorStop(1,'rgba(0,0,8,.78)');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);vig={c,w:cv.width,h:cv.height}}
 ctx.drawImage(vig.c,0,0,cv.width,cv.height)}
let vig=null;

let last=performance.now(),acc=0,fpsAcc=0,fpsN=0;
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;
 fpsAcc+=dt;fpsN++;if(fpsAcc>1.5){const ms=fpsAcc/fpsN*1000;if(ms>26&&Q>.35)Q-=.15;else if(ms<18&&Q<1)Q=Math.min(1,Q+.05);fpsAcc=0;fpsN=0}
 if(state!=='paused'){acc+=dt*(hitStop>0?.15:timeScale);let n=0;while(acc>=1/60&&n<4){update(1/60);acc-=1/60;n++}if(n===4)acc=0}
 else{padInput();if(!document.hidden)acc=0}
 music();render()}

(()=>{const GID="neon-rift.html",GT="NEON RIFT";let act=false,fin=false,w8=false,last=0;

if(playing&&!act){act=true;fin=false;w8=false;send('start')}

if(act&&!fin&&s==='over'){fin=true;act=false;let v=0;try{v=Math.max(0,Math.round(score))}catch(e){}send('finish',{metric:'score',value:v,higherBetter:true,result:'lose'})}
if(s==='menu')act=false},300);})();
