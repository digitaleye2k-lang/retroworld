let L,W,H,map,items,guards,gate,loose,debris,P,cam={x:0,y:0},timeLeft=600,lvl=0,kills=0,msg='',msgT=0,t=0,gameOverT=0,deadT=0,wantJump=false,touchOn=false,sparks=[],shake=0,doneT=0;
const K={};const FL='FSLABCabcHMPxE';

function mkP(x,y){return{x,y,vx:0,vy:0,face:1,st:'idle',ground:true,hp:3,maxHp:3,swing:0,swingHit:false,parry:0,pcd:0,stun:0,inv:0,fall0:y,climbT:0,hk:0,tc:0,hd:1,rt:0,dead:false,sheath:true}}

function dmg(n,kb){if(P.inv>0||P.dead)return;P.hp-=n;P.inv=.8;P.stun=.3;shake=8;P.vx=kb*120;tone(120,.2,'sawtooth',.14);noise(.12,.15,300);if(P.hp<=0)die('SLAIN')}

function updP(dt){
 if(P.dead){P.vy+=1500*dt;return}

   let mv=0;if(P.stun<=0&&P.swing<=0&&P.parry<=0){if(L_)mv=-1;if(R_)mv=1}

   // sword

   if(K.atk&&P.swing<=0&&P.pcd<=0&&P.stun<=0){K.atk=false;P.swing=.34;P.swingHit=false;P.pcd=.1;tone(500,.06,'sawtooth',.06,-.3);P.sheath=false}
   if(K.par&&P.parry<=0&&P.pcd<=0&&P.stun<=0){K.par=false;P.parry=.38;P.pcd=.5;P.sheath=false;tone(320,.05,'triangle',.06)}

  }

  else if(P.vy>0){const col=Math.floor(P.x/TW);for(let r=Math.floor((y0-.5)/TH);r<=Math.floor(P.y/TH);r++){const fy=(r+1)*TH;if(fy>=y0-.5&&fy<=P.y&&isFloor(tile(col,r))){P.y=fy;land();break}}}
  if(P.vx){if(K.left&&P.vx>-250)P.vx=Math.max(P.vx-300*dt,-250);if(K.right&&P.vx<250)P.vx=Math.min(P.vx+300*dt,250)}

function updGuards(dt){for(const g of guards){

 const same=!P.dead&&Math.abs(g.y-P.y)<30&&P.ground,dx=P.x-g.x,ad=Math.abs(dx);

  if(g.st==='wind'){if(g.t<=0){g.st='strike';g.t=.14;g.atk=1}}
  else if(g.st==='strike'){if(g.atk&&ad<135){g.atk=0;if(P.parry>0&&Math.sign(g.x-P.x)===P.face){g.stag=.55;sparks.push({x:g.x-g.face*35,y:g.y-90,t:.25});tone(900,.1,'square',.12);shake=3}else if(P.inv<=0)dmg(1,g.face)}if(g.t<=0){g.st='idle';g.t=Math.max(.35,rnd(.6,1.2)-lvl*.1)}}

   else if(ad<=135){g.st='idle';if(g.t<=0){g.st='wind';g.t=.5-lvl*.04;tone(260,.08,'triangle',.05)}
     // parry reaction

  }

  g.st='walk';const nx=g.x+g.face*60*dt;if(!floorAhead(nx+g.face*30)||blocked(nx,g.y)||g.t<-3){g.face*=-1;g.t=1}else g.x=nx}
 }}
function update(dt){t+=dt;if(msgT>0)msgT-=dt;shake*=.9;if(mode==='menu'||mode==='win'||mode==='over'){gameOverT+=dt;return}

 for(const d of debris){d.vy+=1500*dt;d.y+=d.vy*dt;d.r+=dt*4}debris=debris.filter(d=>d.y<H*TH+300);
 for(const g of['A','B','C'])if(gate[g]>0){const open=gate[g]>0;gate[g]-=dt;if(gate[g]<=0){const gc=[];for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(map[r][c]===g&&Math.abs(P.x-(c*TW+TW/2))<TW/2&&Math.abs(P.y-(r+1)*TH)<10)gate[g]=.5}}

/* ---------- drawing ---------- */
function limb(x1,y1,x2,y2,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function heroSprite(x,y,face,st,tm,o){

 let img=HERO.img,CW=HERO.CW,fr;
 if(armed){img=HERO2.img;CW=HERO2.CW;
  if(o.swing>0){const p=1-o.swing/.34;fr=p<.3?5:p<.72?6:7}
  else if(o.parry>0)fr=9;
  else if(st==='run')fr=12+Math.floor(tm*10)%4;
  else fr=3}
 else fr=st==='run'?8+Math.floor(tm*10)%4:st==='jump'?12:st==='fall'?13:st==='crouch'?13:(st==='hang'||st==='climb')?14:Math.floor(t*3)%4;
 ctx.save();ctx.translate(x,y);ctx.scale(face,1);ctx.imageSmoothingEnabled=false;const CH=HERO.CH,AN=110;

function figure(x,y,face,st,tm,o){if(o.hero&&HERO.ok)return heroSprite(x,y,face,st,tm,o);ctx.save();ctx.translate(x,y);ctx.scale(face,1);const cl=o.cloth,sk='#e8b88a',dk=o.dark;
 if(st==='dead'){ctx.rotate(0);ctx.fillStyle=cl;ctx.beginPath();ctx.ellipse(-4,-12,50,12,0,0,TAU);ctx.fill();ctx.fillStyle=sk;ctx.beginPath();ctx.arc(-52,-14,11,0,TAU);ctx.fill();ctx.fillStyle=dk;ctx.beginPath();ctx.arc(-52,-18,11,Math.PI,TAU);ctx.fill();ctx.restore();return}
 let lh=0,rh=0,lk=0,rk=0,bodyDy=0,armA=0,armB=0,lean=0;const sw=Math.sin(tm*14);
 if(st==='run'){lk=sw*26;rk=-sw*26;armA=-sw*0.8;armB=sw*0.8;lean=6;bodyDy=Math.abs(sw)*-4}

 // legs
