];
const padRows=a=>{const w=Math.max(...a.map(r=>r.length));return a.map(r=>r.padEnd(w,'.'))};

let L,W,H,map,items,guards,gate,loose,debris,P,cam={x:0,y:0},timeLeft=600,lvl=0,kills=0,msg='',msgT=0,t=0,gameOverT=0,deadT=0,wantJump=false,touchOn=false,sparks=[],shake=0,doneT=0;

function mkP(x,y){return{x,y,vx:0,vy:0,face:1,st:'idle',ground:true,hp:3,maxHp:3,swing:0,swingHit:false,parry:0,pcd:0,stun:0,inv:0,fall0:y,climbT:0,hk:0,tc:0,hd:1,rt:0,dead:false,sheath:true}}
function newGame(){timeLeft=600;kills=0;score=0;mode='play';const hp0=3;loadLevel(0);gameOverT=0;deadT=0;doneT=0}
function blocked(nx,y){for(const sy of[y-20,y-110]){for(const ox of[-12,12]){const c=Math.floor((nx+ox)/TW),r=Math.floor(sy/TH),ch=tile(c,r);if(ch==='#')return true;if('ABC'.includes(ch)&&gate[ch]<=0)return true}}return false}
function dmg(n,kb){if(P.inv>0||P.dead)return;P.hp-=n;P.inv=.8;P.stun=.3;shake=8;P.vx=kb*120;tone(120,.2,'sawtooth',.14);noise(.12,.15,300);if(P.hp<=0)die('SLAIN')}

 if(!P.dead)P.st='idle'}

 if(!isFloor(tile(tc,k-1))||isFloor(tile(c,k-1))||tile(tc,k)==='#')return false;const edge=d>0?tc*TW:(tc+1)*TW;const gap=(edge-P.x)*d;if(gap<-10||gap>95)return false;
 P.st='hang';P.x=edge-d*20;P.y=k*TH+145;P.vy=0;P.vx=0;P.hk=k;P.tc=tc;P.hd=d;P.ground=false;tone(260,.05,'triangle',.08);msg='';return true}
function sheathCheck(){P.sheath=!guards.some(g=>g.alive&&Math.abs(g.y-P.y)<30&&Math.abs(g.x-P.x)<360)}
function updP(dt){
 if(P.dead){P.vy+=1500*dt;return}
 P.inv-=dt;P.stun-=dt;P.pcd-=dt;P.parry-=dt;P.swing-=dt;sheathCheck();
 const L_=K.left,R_=K.right;
 if(P.st==='climb'){P.climbT+=dt;if(P.climbT>=.45){P.x=P.tc*TW+(P.hd>0?36:TW-36);P.y=P.hk*TH;P.st='idle';P.ground=true;P.fall0=P.y}return}
 if(P.st==='hang'){if(K.up||wantJump){P.st='climb';P.climbT=0}else if(K.down){P.st='fall';P.ground=false;P.fall0=P.y;P.vy=0;P.x-=P.hd*10}wantJump=false;return}
 if(P.ground){

   if('abc'.includes(ch)){const g=ch.toUpperCase();if(gate[g]<=0)tone(380,.2,'square',.08);gate[g]=Math.max(gate[g],12)}

   let mv=0;if(P.stun<=0&&P.swing<=0&&P.parry<=0){if(L_)mv=-1;if(R_)mv=1}
   if(mv){P.face=mv;P.vx=mv*325;P.st='run';P.rt+=dt}else{P.vx*=.5;if(Math.abs(P.vx)<15)P.vx=0;if(P.st==='run')P.st='idle';P.rt=0}
   if(K.down&&!mv)P.st='crouch';else if(P.st==='crouch')P.st='idle';
   if(wantJump&&P.stun<=0){wantJump=false;P.ground=false;P.fall0=P.y;P.vy=mv?-580:-520;P.vx=mv?mv*430:0;{const dd=P.face,cc=Math.floor(P.x/TW),rw=Math.round(P.y/TH)-1;if(K.up&&!isFloor(tile(cc,rw-1))){const e1=isFloor(tile(cc+dd,rw-1)),e2=!e1&&isFloor(tile(cc+2*dd,rw-1));if(e1||e2){P.vx=dd*(e1?70:200);P.vy=-560}}}P.st='jump';tone(300,.12,'sine',.07,1)}
   // sword
   const g=guards.find(g=>g.alive&&Math.abs(g.y-P.y)<30&&Math.abs(g.x-P.x)<130&&Math.sign(g.x-P.x)===P.face);
   if(K.atk&&P.swing<=0&&P.pcd<=0&&P.stun<=0){K.atk=false;P.swing=.34;P.swingHit=false;P.pcd=.1;tone(500,.06,'sawtooth',.06,-.3);P.sheath=false}
   if(K.par&&P.parry<=0&&P.pcd<=0&&P.stun<=0){K.par=false;P.parry=.38;P.pcd=.5;P.sheath=false;tone(320,.05,'triangle',.06)}
   if(P.swing>.17&&P.swing<.26&&!P.swingHit){P.swingHit=true;const tg=guards.find(q=>q.alive&&Math.abs(q.y-P.y)<30&&(q.x-P.x)*P.face>0&&(q.x-P.x)*P.face<125);
     if(tg){if(tg.parry>0){sparks.push({x:tg.x-P.face*30,y:tg.y-90,t:.25});tone(900,.08,'square',.1);P.stun=.35;P.swing=0}else{tg.hp--;tg.stag=.45;tg.x+=P.face*28;tg.flash=.2;shake=4;tone(180,.12,'sawtooth',.12);noise(.08,.12,800);if(tg.hp<=0){tg.alive=false;tg.dying=1;kills++;score+=100}}}}
  }
 }else{

  else if(P.vy>0){const col=Math.floor(P.x/TW);for(let r=Math.floor((y0-.5)/TH);r<=Math.floor(P.y/TH);r++){const fy=(r+1)*TH;if(fy>=y0-.5&&fy<=P.y&&isFloor(tile(col,r))){P.y=fy;land();break}}}

let bolts=[],fx=[],startT=0,startX=0,startY=0,gateO={A:0,B:0,C:0};

let dt_=.016;

   else if(P.inv<=0){b.life=0;dmg(1,Math.sign(b.vx))}}}

function updGuards(dt){dt_=dt;for(const g of guards){
