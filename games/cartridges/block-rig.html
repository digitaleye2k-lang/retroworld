<body><div id="stage"><canvas id="g"></canvas></div><button id="snd" type="button">SFX: ON</button>
<script>
'use strict';
const LW=960,LH=540;
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
function fit(){const dpr=Math.min(2,window.devicePixelRatio||1),s=Math.min(innerWidth/LW,innerHeight/LH);cv.style.width=(LW*s)+'px';cv.style.height=(LH*s)+'px';cv.width=Math.round(LW*s*dpr);cv.height=Math.round(LH*s*dpr)}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));fit();
function ptr(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LH}}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let sfxOn=LS.get('rwMute')!=='1',AC=null;
const sndBtn=document.getElementById('snd');
function sndLabel(){sndBtn.textContent='SFX: '+(sfxOn?'ON':'OFF');sndBtn.className=sfxOn?'':'off'}sndLabel();
sndBtn.addEventListener('click',e=>{sfxOn=!sfxOn;LS.set('rwMute',sfxOn?'0':'1');sndLabel();e.stopPropagation();ac()});
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
addEventListener('pointerdown',ac,{passive:true});addEventListener('keydown',ac);
function tone(f,d,type,vol,slide,delay){if(!sfxOn||!AC)return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,vol,hp){if(!sfxOn||!AC)return;try{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;g.gain.value=vol||.08;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
/* continuous sounds: engine + jet */
let ENG=null,JETS=null;
function engStart(){if(!AC||ENG)return;try{const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=380;g.gain.value=0;o.connect(f);f.connect(g);g.connect(AC.destination);o.start();
 const n=AC.sampleRate,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),f2=AC.createBiquadFilter(),g2=AC.createGain();s.buffer=b;s.loop=true;f2.type='bandpass';f2.frequency.value=900;f2.Q.value=.6;g2.gain.value=0;s.connect(f2);f2.connect(g2);g2.connect(AC.destination);s.start();
 ENG={o,g,f};JETS={s,g:g2}}catch(e){ENG=null;JETS=null}}
function engSet(sp,th,jet){if(!ENG)return;const now=AC.currentTime;ENG.o.frequency.setTargetAtTime(36+sp*5+th*18,now,.08);ENG.g.gain.setTargetAtTime(sfxOn?(.010+th*.022):0,now,.1);JETS.g.gain.setTargetAtTime(sfxOn&&jet?.09:0,now,.06)}
function engStop(){if(ENG){try{const n=AC.currentTime;ENG.g.gain.setTargetAtTime(0,n,.05);JETS.g.gain.setTargetAtTime(0,n,.05);ENG.o.stop(n+.4);JETS.s.stop(n+.4)}catch(e){}}ENG=null;JETS=null}
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function text(s,x,y,size,col,align,font){ctx.font='bold '+size+'px '+(font||'"Courier New",monospace');ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#000';ctx.fillText(s,x,y)}
function outText(s,x,y,size,fill,line,lw,align){ctx.font='bold '+size+'px "Courier New",monospace';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=lw||6;ctx.strokeStyle=line||'#000';ctx.strokeText(s,x,y);ctx.fillStyle=fill||'#fff';ctx.fillText(s,x,y)}

/* ================= GAME DATA ================= */
const SPAWN=-6,GW=16,GH=9,GRAV=18,JT=80,VS=15,VB=21,FS=70,FB=100,LEGW=13,FLEG=40,LAMP=.9,LK=190,LC=34,STROKE=.8;
const PD={
 b1:{n:'BLOCK',w:1,h:1,c:1,m:1,note:'BASIC'},
 b2:{n:'BAR 2',w:2,h:1,c:2,m:1.8,rot:2,note:'2x1'},
 b3:{n:'BAR 3',w:3,h:1,c:3,m:2.6,rot:2,note:'3x1'},
 p2:{n:'PLATE',w:2,h:2,c:4,m:3.6,rot:1,note:'2x2 HEAVY'},
 ws:{n:'WHEEL S',w:1,h:1,c:3,m:.9,R:.5,note:'DRIVES'},
 wl:{n:'WHEEL L',w:2,h:2,c:6,m:1.9,R:1,note:'FAST'},
 leg:{n:'LEG',w:1,h:1,c:4,m:.9,note:'WALKS'},
 jet:{n:'JET',w:1,h:1,c:5,m:1,rot:4,note:'THRUST'},
 seat:{n:'DRIVER',w:1,h:1,c:2,m:1.4,note:'REQUIRED'},
 tb:{n:'TITAN BAR',w:3,h:1,c:4,m:1.2,rot:2,note:'LIGHT 3x1',pro:1,price:150},
 cp:{n:'CARBON PLATE',w:2,h:2,c:5,m:1.5,rot:1,note:'LIGHT 2x2',pro:1,price:200},
 ft:{n:'FUEL TANK',w:1,h:1,c:3,m:1.1,note:'+45 FUEL',pro:1,price:250},
 rw:{n:'RALLY WHEEL',w:1,h:1,c:5,m:.8,R:.5,vmax:21,F:125,mu:1.8,note:'GRIPPY',pro:1,price:250},
 pl:{n:'POWER LEG',w:1,h:1,c:6,m:1,lf:95,note:'STRONG',pro:1,price:300},
 tj:{n:'TURBO JET',w:1,h:1,c:8,m:1.3,rot:4,thr:170,note:'2x THRUST',pro:1,price:400},
 mw:{n:'MEGA WHEEL',w:3,h:3,c:10,m:3.2,R:1.5,vmax:27,F:230,mu:1.4,note:'MONSTER',pro:1,price:600}
};
const BASIC=['b1','b2','b3','p2','ws','wl','leg','jet','seat'],PRO=['tb','cp','ft','rw','pl','tj','mw'];
function fp(p){const d=PD[p.t];return(d.rot===2&&p.r%2===1)?{w:d.h,h:d.w}:{w:d.w,h:d.h}}
function costOf(parts){let c=0;for(const p of parts)c+=PD[p.t].c;return c}
const PRESETS={
 buggy:[['b3',5,6,0],['seat',6,5,0],['ws',5,7,0],['ws',7,7,0],['b1',8,6,0]],
 bike:[['wl',4,6,0],['b2',6,6,0],['wl',8,6,0],['seat',6,5,0],['b1',7,5,0]],
 walker:[['b3',4,5,0],['b3',7,5,0],['seat',6,4,0],['leg',4,6,0],['leg',6,6,0],['leg',7,6,0],['leg',9,6,0]],
 jetcar:[['b3',5,6,0],['seat',6,5,0],['ws',5,7,0],['ws',7,7,0],['jet',4,6,1],['jet',8,6,0]]
};
function preset(k){return PRESETS[k].map(a=>({t:a[0],x:a[1],y:a[2],r:a[3]}))}

/* ---- terrain builder (y is DOWN: negative = higher) ---- */
function Terr(){const P=[[-40,0],[-14,0]];let x=-14,y=0;const marks=[];
 const T={P,marks,
  flat(L){x+=L;P.push([x,y])},
  ramp(L,dh){const n=Math.max(1,Math.ceil(L/1.5));for(let i=1;i<=n;i++)P.push([x+L*i/n,y-dh*i/n]);x+=L;y-=dh},
  hill(L,h){const n=Math.ceil(L);for(let i=1;i<=n;i++)P.push([x+L*i/n,y-h*(1-Math.cos(TAU*i/n))/2]);x+=L},
  step(h,w){marks.push({x:x-3,k:'wall'});const dx=Math.abs(h)*.5;x+=dx;y-=h;P.push([x,y]);x+=w;P.push([x,y])},
  wall(h,w){marks.push({x:x-3,k:'wall'});x+=.14;y-=h;P.push([x,y]);x+=w;P.push([x,y])},
  drop(h,w){const dx=h*.5;x+=dx;y+=h;P.push([x,y]);x+=w;P.push([x,y])},
  pit(w){marks.push({x:x-3,k:'pit'});P.push([x+.3,y+70]);P.push([x+.3+w,y+70]);P.push([x+.6+w,y]);x+=.6+w},
  rocks(n,gap,h){for(let i=0;i<n;i++){x+=gap;P.push([x,y]);P.push([x+.7,y-h]);P.push([x+1.4,y]);x+=1.4}},
  end(){x+=14;P.push([x,y]);const fx=x-7;x+=60;P.push([x,y]);return{P,marks,finish:fx,killY:30}}
 };return T}
const LV=[
 {n:'TEST TRACK',b:25,d:'Gentle hills. Learn the controls.',f(T){T.flat(16);T.hill(14,1.6);T.flat(8);T.hill(18,2.4);T.flat(10);T.ramp(12,-1.2);T.flat(8)}},
 {n:'BUMPY ROAD',b:30,d:'Rocks everywhere. Big wheels smooth it out.',f(T){T.flat(14);T.rocks(4,3.5,.5);T.flat(6);T.hill(12,1.8);T.rocks(6,3,.7);T.flat(6);T.hill(14,2.6);T.flat(8)}},
 {n:'MIND THE GAP',b:35,d:'Pits! Build speed... or jets.',f(T){T.flat(30);T.pit(3);T.flat(10);T.ramp(8,1);T.pit(4.5);T.flat(12);T.pit(5.5);T.flat(10)}},
 {n:'STAIRWAY',b:40,d:'Climb the steps. Legs love stairs.',f(T){T.flat(14);for(let i=0;i<5;i++)T.step(.45,3);T.flat(4);T.ramp(10,-2.2);T.flat(6);for(let i=0;i<4;i++)T.step(.7,3.2);T.flat(10)}},
 {n:'HILL CLIMB',b:40,d:'Power and grip. Light rigs win.',f(T){T.flat(12);T.ramp(30,8);T.flat(4);T.ramp(16,-8);T.flat(8);T.ramp(36,11);T.flat(6);T.ramp(10,-4);T.flat(8)}},
 {n:'THE WALLS',b:50,d:'Walls get taller. Think vertical.',f(T){T.flat(16);T.wall(1.1,7);T.wall(1.6,7);T.wall(2.2,7);T.wall(3,9);T.flat(6)}},
 {n:'CANYON',b:50,d:'Two huge jumps. Launch it!',f(T){T.flat(16);T.ramp(10,2.2);T.pit(9);T.flat(10);T.ramp(10,2.2);T.pit(11);T.flat(10)}},
 {n:'ROCKY ROAD',b:55,d:'Rocks, stairs and hills in a row.',f(T){T.flat(12);T.rocks(5,2.4,.8);T.hill(12,2);T.rocks(4,2.4,.9);for(let i=0;i<4;i++)T.step(.6,2.6);T.rocks(5,2.2,.8);T.hill(14,3);T.flat(8)}},
 {n:'MOUNTAIN PASS',b:60,d:'Steep climbs with pits in between.',f(T){T.flat(12);T.ramp(20,6);T.flat(3);T.pit(4);T.ramp(22,8);T.flat(3);for(let i=0;i<3;i++)T.step(.7,3);T.pit(6);T.ramp(18,5);T.ramp(14,-9);T.flat(8)}},
 {n:'THE GAUNTLET',b:70,d:'Everything at once. Good luck!',f(T){T.flat(12);T.rocks(4,2.5,.7);T.pit(4);T.flat(6);T.ramp(14,4);T.step(1.2,4);T.pit(6);T.flat(6);for(let i=0;i<4;i++)T.step(.6,2.5);T.hill(12,2.5);T.ramp(8,2);T.pit(9);T.flat(6);T.step(1.8,6);T.flat(8)}}
];
function ext(T,i){const k=i/9;
 T.flat(8);T.rocks(2+(i>>1),3.2,.3+.3*k);T.hill(14,1.6+2*k);
 if(i>=2){T.flat(6);T.pit(3+3*k);T.flat(8)}
 T.ramp(14+i,2+3*k);T.flat(4);T.ramp(16,-(2+3*k));
 if(i>=3){T.flat(6);for(let j=0;j<3+(i>>2);j++)T.step(.4+.25*k,3)}
 T.flat(6);T.rocks(3+(i>>1),3,.22+.5*k);
 if(i>=5){T.flat(6);T.wall(1+k,7);T.flat(4);T.pit(5+4*k)}
 T.flat(6);T.hill(16,2+2.5*k);T.flat(6);
 if(i>=1){T.pit(3.5+3*k);T.flat(8)}
 T.rocks(3,3,.7);T.flat(8)}
LV.forEach((l,i)=>{const T=Terr();l.f(T);ext(T,i);l.T=T.end();l.par=Math.ceil((l.T.finish-SPAWN)/8)});
const DEMO=(()=>{const T=Terr();T.flat(10);T.hill(14,1.5);T.flat(6);T.rocks(3,4,.45);T.hill(16,2);T.flat(8);T.hill(12,1.2);T.flat(10);T.rocks(4,3.5,.5);T.flat(10);return T.end()})();

let TX=[],TY=[],TN=0;
function setTerrain(L){TX=L.P.map(p=>p[0]);TY=L.P.map(p=>p[1]);TN=TX.length}
function segIdx(x){let lo=0,hi=TN-2;while(lo<hi){const m=(lo+hi+1)>>1;if(TX[m]<=x)lo=m;else hi=m-1}return lo}
function terrY(x){const i=segIdx(x),x0=TX[i],x1=TX[i+1];if(x<=x0)return TY[i];if(x>=x1)return TY[i+1];return TY[i]+(TY[i+1]-TY[i])*(x-x0)/(x1-x0)}
const NR={d:0,nx:0,ny:-1};
function nearest(px,py){const i=segIdx(px);let best=1e18,cx=0,cy=0;const a=Math.max(0,i-5),b=Math.min(TN-2,i+5);
 for(let j=a;j<=b;j++){const ax=TX[j],ay=TY[j],dx=TX[j+1]-ax,dy=TY[j+1]-ay;let u=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);u=u<0?0:u>1?1:u;const qx=ax+dx*u,qy=ay+dy*u,e=(px-qx)*(px-qx)+(py-qy)*(py-qy);if(e<best){best=e;cx=qx;cy=qy}}
 const d=Math.sqrt(best);if(d<1e-7){NR.d=0;NR.nx=0;NR.ny=-1;return}
 if(py>terrY(px)){NR.d=-d;NR.nx=(cx-px)/d;NR.ny=(cy-py)/d}else{NR.d=d;NR.nx=(px-cx)/d;NR.ny=(py-cy)/d}}

/* ================= RIG + PHYSICS ================= */
function makeRig(parts){
 const info=[];let M=0,cx=0,cy=0;
 for(const p of parts){const d=PD[p.t],f=fp(p),q={p,d,f,px:p.x+f.w/2,py:p.y+f.h/2};info.push(q);M+=d.m;cx+=d.m*q.px;cy+=d.m*q.py}
 cx/=M;cy/=M;let I=0;
 for(const q of info){const dx=q.px-cx,dy=q.py-cy,d=q.d;I+=(d.R?d.m*d.R*d.R/2:d.m*(q.f.w*q.f.w+q.f.h*q.f.h)/12)+d.m*(dx*dx+dy*dy)}
 const occ={};for(const q of info)for(let i=0;i<q.f.w;i++)for(let j=0;j<q.f.h;j++)occ[(q.p.x+i)+','+(q.p.y+j)]=1;
 const O=(x,y)=>!!occ[x+','+y];
 const seen={},pts=[],wheels=[],feet=[],jets=[],draw=[];
 const JTX=[0,1,0,-1],JTY=[-1,0,1,0],JANG=[Math.PI/2,Math.PI,-Math.PI/2,0];
 for(const q of info){const t=q.p.t,lx=q.px-cx,ly=q.py-cy;
  if(q.d.R){const w={lx,ly,R:q.d.R,big:t==='wl',spin:0,av:0,vmax:q.d.vmax||(t==='wl'?VB:VS),F:q.d.F||(t==='wl'?FB:FS),mu:q.d.mu||1.3};wheels.push(w);draw.push({q,lx,ly,w});continue}
  const dr={q,lx,ly};
  if(t==='leg'||t==='pl'){const f={hx:lx,hy:ly,bx:lx,by:ly+2,ph:0,fx:lx,fy:ly+2,down:false,F:q.d.lf||FLEG};feet.push(f);dr.f=f}
  if(t==='jet'||t==='tj'){const r=q.p.r&3;const j={lx,ly,tx:JTX[r],ty:JTY[r],ang:JANG[r],T:q.d.thr||JT};jets.push(j);dr.j=j}
  draw.push(dr);
  for(let i=0;i<q.f.w;i++)for(let j=0;j<q.f.h;j++){const gx=q.p.x+i,gy=q.p.y+j;
   for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){if(!ox&&!oy)continue;const hx=gx*2+1+ox,hy=gy*2+1+oy,key=hx*1000+hy;
    if(key in seen){if(t==='seat'&&oy===-1&&seen[key])seen[key].head=true;continue}
    let inner;
    if(hx%2===0&&hy%2===0){const a=hx/2,b=hy/2;inner=O(a-1,b-1)&&O(a,b-1)&&O(a-1,b)&&O(a,b)}
    else if(hx%2===0){const a=hx/2,b=(hy-1)/2;inner=O(a-1,b)&&O(a,b)}
    else{const a=(hx-1)/2,b=hy/2;inner=O(a,b-1)&&O(a,b)}
    if(inner){seen[key]=null;continue}
    const pt={lx:hx/2-cx,ly:hy/2-cy,head:t==='seat'&&oy===-1};seen[key]=pt;pts.push(pt)}}}
 feet.sort((a,b)=>a.hx-b.hx);const nf=feet.length;feet.forEach((f,i)=>{f.ph=nf===3?(i%3)*TAU/3:(i%2)*Math.PI});const duty=nf===3?.67:(nf>=2?.6:.5);
 let tanks=0;for(const q of info)if(q.p.t==='ft')tanks++;
 let low=-1e9,front=-1e9,rear=1e9;
 for(const p of pts){low=Math.max(low,p.ly);front=Math.max(front,p.lx);rear=Math.min(rear,p.lx)}
 for(const w of wheels){low=Math.max(low,w.ly+w.R);front=Math.max(front,w.lx+w.R);rear=Math.min(rear,w.lx-w.R)}
 for(const f of feet){low=Math.max(low,f.by)}
 return{x:0,y:0,a:0,vx:0,vy:0,w:0,m:M,I,invM:1/M,invI:1/I,pts,wheels,feet,jets,draw,fuel:70+tanks*40,fuelMax:70+tanks*40,headT:0,act:0,low,front,rear,hasJet:jets.length>0,duty,vleg:LAMP*2*LEGW/TAU/duty,slope:0,dead:false,firing:false,grounded:false,cw:[],cx,cy,spd:0,maxJetT:0};
}
function placeRig(R,x){R.x=x;R.y=terrY(x)-R.low-.02;R.a=0;R.vx=R.vy=R.w=0;R.fuel=R.fuelMax;R.headT=0;R.dead=false}
function legStance(R,f){return f.ph/TAU<R.duty||R.act<.05}
function footLocal(R,f){const a=R.act,u=f.ph/TAU,d=R.duty;let x,l=0;if(u<d){x=LAMP*(1-2*u/d)}else{const s=(u-d)/(1-d);x=-LAMP+2*LAMP*s;l=.65*Math.sin(Math.PI*s)}return[f.bx+x*a,f.by-l*a]}
function genContacts(R,inp){
 const C=[],ca=Math.cos(R.a),sa=Math.sin(R.a);
 for(const q of R.pts){const rx=ca*q.lx-sa*q.ly,ry=sa*q.lx+ca*q.ly;nearest(R.x+rx,R.y+ry);if(NR.d<.08)C.push({k:0,rx,ry,nx:NR.nx,ny:NR.ny,d:NR.d,head:q.head})}
 for(const w of R.wheels){const rx=ca*w.lx-sa*w.ly,ry=sa*w.lx+ca*w.ly;nearest(R.x+rx,R.y+ry);const d=NR.d-w.R;if(d<.08)C.push({k:1,w,rx:rx-NR.nx*w.R,ry:ry-NR.ny*w.R,nx:NR.nx,ny:NR.ny,d})}
 for(const f of R.feet){const l=footLocal(R,f);f.fx=l[0];f.fy=l[1];const rx=ca*l[0]-sa*l[1],ry=sa*l[0]+ca*l[1];nearest(R.x+rx,R.y+ry);
  const stance=legStance(R,f);f.pen=Math.max(0,Math.min(STROKE,-NR.d));f.down=NR.d<.05;if(NR.d<STROKE+.08)C.push({k:2,f,stance,rx,ry,nx:NR.nx,ny:NR.ny,d:NR.d,dd:NR.d+STROKE,pen:-NR.d})}
 return C}
function simSub(R,inp,dt){

 btn('◄ BACK',24,480,120,40,goMenu,{size:15});text('Complete a level to unlock the next one.',LW/2,500,14,'#000')}
function drawRun(){
 HOR=LH*.62;const r=run,R=r.R;drawWorld(r.L,R,true);
 // HUD
 ctx.fillStyle='#000';ctx.fillRect(0,0,LW,44);text('LEVEL '+(lv+1)+' • '+LV[lv].n,12,22,15,'#fff','left');
 const pr=clamp((R.x-SPAWN)/(r.L.finish-SPAWN),0,1);ctx.fillStyle='#fff';ctx.fillRect(330,16,300,12);ctx.fillStyle='#000';ctx.fillRect(333,19,294,6);ctx.fillStyle='#fff';ctx.fillRect(333,19,294*pr,6);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(333+294*pr,22,8,0,TAU);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#000';ctx.stroke();text('⚑',638,22,14,'#fff','left');
 text(r.t.toFixed(1)+'s',LW-12,22,17,'#fff','right');text(Math.round(R.spd*3.6)+' km/h',LW-110,22,14,'#fff','right');
 if(R.hasJet){text('FUEL',14,64,12,'#000','left');ctx.fillStyle='#fff';ctx.fillRect(56,56,120,14);ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeRect(56,56,120,14);ctx.fillStyle='#000';ctx.fillRect(58,58,116*R.fuel/R.fuelMax,10)}
 if(r.t<5&&r.state==='go'){const a=clamp(1.4-r.t/4,0,1);ctx.globalAlpha=a;outText('► GO   ◄ REVERSE   ▼ BRAKE'+(R.hasJet?'   ▲ JET':''),LW/2,96,18,'#fff','#000',6);ctx.globalAlpha=1}
 text('[ESC] BACK TO BUILD   [R] RESTART',LW/2,LH-14,12,'#000');
 // touch pads
 pads=[];if(seenTouch||('ontouchstart' in window)){const P=[['left','◄',16,440,92,84],['brake','▼',116,440,92,84],['jet','JET',752,440,92,84,R.hasJet],['right','►',852,440,92,84]];
  for(const p of P){if(p[6]===false)continue;pads.push({n:p[0],x:p[2],y:p[3],w:p[4],h:p[5]});const on=tp[p[0]];ctx.globalAlpha=.85;ctx.fillStyle='#000';ctx.fillRect(p[2]+4,p[3]+4,p[4],p[5]);ctx.fillStyle=on?'#000':'#fff';ctx.fillRect(p[2],p[3],p[4],p[5]);ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeRect(p[2],p[3],p[4],p[5]);text(p[1],p[2]+p[4]/2,p[3]+p[5]/2,p[0]==='jet'?22:34,on?'#fff':'#000');ctx.globalAlpha=1}}
 btns=[];if(r.state!=='go'&&r.endT>.5)drawResult();
}
function drawResult(){const r=run,w=r.state==='win',l=LV[lv];ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,LW,LH);panel(250,110,460,w?300:250);
 text(w?'FINISH!':r.reason,480,w?150:160,w?40:34,'#000');
 if(w){const b=r.bits;text('TIME '+r.t.toFixed(1)+'s    COST '+r.cost+'    +'+r.gain+' BOLTS',480,196,17,'#000');
  [[1,'FINISH THE LEVEL'],[2,'UNDER '+l.par+' SECONDS'],[4,'COST ≤ '+Math.floor(l.b*.6)]].forEach((g,i)=>{const ok=b&g[0];text((ok?'★ ':'☆ ')+g[1],480,232+i*28,18,ok?'#000':'#888')});
  btn('RETRY',276,330,128,44,()=>{startRun()},{size:16});btn('REBUILD',414,330,128,44,()=>{goBuild()},{size:16});
  if(lv<LV.length-1)btn('NEXT ►',552,330,134,44,()=>{goBuild(lv+1)},{size:17,on:Math.sin(gt*4)>0});else btn('LEVELS',552,330,134,44,goLevels,{size:16})}
 else{text('Distance '+Math.round(r.dist)+' m    +'+r.gain+' BOLTS',480,205,18,'#000');text('Tip: keep your driver off the ground!',480,236,13,'#555');
  btn('RETRY',276,270,128,44,()=>{startRun()},{size:16,on:Math.sin(gt*4)>0});btn('REBUILD',414,270,128,44,()=>{goBuild()},{size:16});btn('LEVELS',552,270,134,44,goLevels,{size:16})}}

function draw(){
 ctx.setTransform(cv.width/LW,0,0,cv.height/LH,0,0);btns=[];
 if(scene==='menu')drawMenu();else if(scene==='levels'){drawLevels();if(helpOpen)drawHelp()}else if(scene==='build')drawBuild();else if(scene==='run')drawRun();
 cv.style.cursor=btns.some(b=>!b.dis&&mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h)?'pointer':(scene==='build'&&cellAt(mouse)?'crosshair':'default');
}

/* ================= INPUT ================= */
function padAt(p){for(const d of pads)if(p.x>=d.x&&p.x<=d.x+d.w&&p.y>=d.y&&p.y<=d.y+d.h)return d.n;return null}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{ac();const p=ptr(e);mouse=p;if(e.pointerType==='touch')seenTouch=true;
 for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(!b.dis&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.cb(p,e);return}}
 if(scene==='run'&&run.state==='go'){const n=padAt(p);if(n){tp[n]=true;tp.ids[e.pointerId]=n;try{cv.setPointerCapture(e.pointerId)}catch(_){}}return}
 if(scene==='build'&&!helpOpen){const c=cellAt(p);if(c){pushUndo();painting=true;paintMode=(e.button===2||K.shift)?1:0;lastCell=c.x+','+c.y;applyCell(c);try{cv.setPointerCapture(e.pointerId)}catch(_){}}}
});
cv.addEventListener('pointermove',e=>{const p=ptr(e);mouse=p;if(painting){const c=cellAt(p);if(c){const k=c.x+','+c.y;if(k!==lastCell){lastCell=k;applyCell(c)}}}});
const pup=e=>{if(painting){painting=false;if(undo.length&&undo[undo.length-1]===JSON.stringify(design))undo.pop()}const n=tp.ids[e.pointerId];if(n){tp[n]=false;delete tp.ids[e.pointerId]}};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('pointerleave',()=>{mouse={x:-99,y:-99}});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright','tab'].includes(k))e.preventDefault();
 if(e.repeat&&scene!=='run')return;K[k]=true;K.shift=e.shiftKey;
 if(scene==='menu'){if(k==='enter'||k===' ')goLevels();return}
 if(scene==='levels'){if(helpOpen){if(k==='enter'||k==='escape'||k===' ')helpOpen=false;return}if(k==='escape')goMenu();else if(k>='1'&&k<='9'){const i=+k-1;if(unlocked(i))goBuild(i)}else if(k==='0'&&unlocked(9))goBuild(9);return}
 if(scene==='build'){if(helpOpen){if(k==='enter'||k==='escape'||k==='h'||k===' ')helpOpen=false;return}
  if(k==='tab'){palTab=1-palTab}else if(k>='1'&&k<='9'){const L=palTab?PRO:BASIC,t=L[+k-1];if(t&&(!PD[t].pro||save.own[t]||buyPart(t))){sel=t;selRot=0}}else if(k==='r')rotSel();else if(k==='e')sel=sel==='erase'?'b1':'erase';else if(k==='z')doUndo();else if(k==='enter')startRun();else if(k==='escape')goLevels();else if(k==='h')helpOpen=true;return}
 if(scene==='run'){if(k==='escape'||k==='b'){goBuild()}else if(k==='r'&&!e.repeat){startRun()}else if(run.state!=='go'&&(k==='enter'||k===' ')){if(run.state==='win'&&lv<LV.length-1)goBuild(lv+1);else startRun()}}
});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false;K.shift=e.shiftKey});
addEventListener('blur',()=>{for(const k in K)K[k]=false;tp.left=tp.right=tp.brake=tp.jet=false;painting=false});
let _last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-_last)/1000);_last=now;update(dt);draw()}
goMenu();requestAnimationFrame(loop);

/* RETRO WORLD profile bridge: report start / progress / finish to the arcade (trophies, quests, streaks) */
(()=>{const GID="block-rig.html",GT="BLOCK RIG".toUpperCase();let act=false,last=0,fin=false;
const send=(t,x)=>{try{parent.postMessage(Object.assign({source:'retro-world-game',type:t,gameId:GID,title:GT},x||{}),'*')}catch(e){}};
const val=()=>{try{return Math.max(0,Math.round(Number(score)||0))}catch(e){return 0}};
window.__rwAch=k=>send('achievement',{achievement:k});
const snap=()=>send('progress',{metric:'score',value:val(),higherBetter:true});
setInterval(()=>{let m='';try{m=String(mode)}catch(e){return}
const playing=(m==='play'||m==='clear'||m==='dying'),now=Date.now();
if(playing&&!act){act=true;fin=false;send('start');snap();last=now}
if(act&&playing&&now-last>1500){snap();last=now}
if(act&&!fin&&(m==='win'||m==='over')){fin=true;act=false;send('finish',{metric:'score',value:val(),higherBetter:true,result:m==='win'?'win':'lose'})}
if(!playing&&m==='menu'){act=false}},250);
addEventListener('pagehide',()=>{if(act)snap()});})();
