  if(paused){if(UP(k))cur=(cur+2)%3;else if(DN(k))cur=(cur+1)%3;else if(OKK(k)){[()=>{paused=false},()=>{ML.ret='fight';ML.ci=G.F[0].ci;ML.sc=0;scr='movelist'},()=>{startAttract();go('title');paused=false}][cur]()}else if(k==='escape'||k==='p')paused=false;return}
  if(G.phase==='end'&&G.pt>45){if(OKK(k)||k==='enter'){const w=G.winM,o=G.o;if(o==='arcade'){if(w===0){if(ARC.i<ARC.list.length-1){ARC.i++;arcNext(true)}else{startAttract();go('title')}}else rematch()}else rematch()}else if(k==='escape'){startAttract();go('title')}return}
  if(k==='escape'||k==='p'){paused=true;cur=0;return}
  if(G.train){if(k==='t')G.dummy=(G.dummy+1)%5;else if(k==='r'){const m=G.F.map(f=>f.meter);resetRound();G.phase='fight';G.F.forEach(f=>f.meter=100)}else if(k==='l'){ML.ret='fight';ML.ci=G.F[0].ci;ML.sc=0;scr='movelist'}}}
}
/* ================= LOOP ================= */
let padPrev={};
function padNav(){if(scr==='fight'&&!paused&&G&&G.phase!=='end')return;const p=PADS[0],now={u:p.u,d:p.d,l:p.l,r:p.r,a:p.b[2],b:p.b[3]||p.b[1],st:p.sp};
 if(now.u&&!padPrev.u)onKey('arrowup',{});if(now.d&&!padPrev.d)onKey('arrowdown',{});if(now.l&&!padPrev.l)onKey('arrowleft',{});if(now.r&&!padPrev.r)onKey('arrowright',{});if(now.a&&!padPrev.a)onKey('enter',{});if(now.b&&!padPrev.b)onKey('escape',{});padPrev=now}
function render(){ctx.setTransform(CSC,0,0,CSC,0,0);ctx.clearRect(0,0,LW,LH);btns=[];
 switch(scr){case'title':drawTitle();break;case'csel':drawCsel();break;case'diff':drawDiff();break;case'ssel':drawSsel();break;case'vscard':drawVsCard();break;case'movelist':drawML();break;case'how':drawHow();break;
  case'fight':drawMatch();if(paused)drawPause();break}}
let _acc=0,_last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=now-_last;_last=now;if(dt>100)dt=100;_acc+=dt;pollPads();padNav();
 let n=0;while(_acc>=16.667&&n<4){_acc-=16.667;n++;if(G&&((scr==='fight'&&!paused)||scr==='title'))updateMatch();else frameN++}
 musTick(scr==='fight'&&!paused||scr==='title'||scr==='csel');render()}
startAttract();requestAnimationFrame(loop);
/* RETRO WORLD profile bridge */
(()=>{const GID="stick-fury.html",GT="STICK FURY";let act=false,last=0,fin=false;
const send=(t,x)=>{try{parent.postMessage(Object.assign({source:'retro-world-game',type:t,gameId:GID,title:GT},x||{}),'*')}catch(e){}};
const val=()=>{try{return Math.max(0,Math.round(Number(score)||0))}catch(e){return 0}};
window.__rwAch=k=>send('achievement',{achievement:k});
const snap=()=>send('progress',{metric:'score',value:val(),higherBetter:true});
setInterval(()=>{let m='';try{m=String(mode)}catch(e){return}
const playing=(m==='play'),now=Date.now();
if(playing&&!act){act=true;fin=false;send('start');snap();last=now}
if(act&&playing&&now-last>1500){snap();last=now}
if(act&&!fin&&(m==='win'||m==='over')){fin=true;act=false;send('finish',{metric:'score',value:val(),higherBetter:true,result:m==='win'?'win':'lose'})}
if(!playing&&m==='menu'){act=false}},250);
addEventListener('pagehide',()=>{if(act)snap()});})();
