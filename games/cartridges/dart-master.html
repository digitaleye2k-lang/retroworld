<!doctype html><html lang="en"><head><script src="rw-boost.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05060f">
<title>DART MASTER • RETRO WORLD</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:"Courier New",monospace;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 30%,#15153a,#05060f 70%)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;box-shadow:0 0 50px #00ffff22;border-radius:6px;cursor:crosshair}
#snd{position:fixed;left:6px;top:40px;z-index:5;font:700 11px "Courier New",monospace;color:#67ff67;background:#0b0b1ccc;border:1px solid #67ff67;padding:5px 8px;cursor:pointer;border-radius:4px}
#snd.off{color:#8a8ab0;border-color:#6a6a90}

</style>
<script>addEventListener('keydown',function(e){if((e.keyCode||e.which)===461&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'retroworld-tv-back'},'*');}},true);</script></head>
<body><div id="stage"><canvas id="g"></canvas></div><button id="snd" type="button">SFX: ON</button>

<script>
'use strict';
const LW=480,LH=800;
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
function fit(){const dpr=Math.min(2,window.devicePixelRatio||1),s=Math.min(innerWidth/LW,innerHeight/LH);cv.style.width=(LW*s)+'px';cv.style.height=(LH*s)+'px';cv.width=Math.round(LW*s*dpr);cv.height=Math.round(LH*s*dpr);ctx.setTransform(cv.width/LW,0,0,cv.height/LH,0,0)}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));fit();
function ptr(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LH}}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const GKEY='rw-dart-master';
let sfxOn=LS.get('rwMute')!=='1',AC=null;
const sndBtn=document.getElementById('snd');
function sndLabel(){sndBtn.textContent='SFX: '+(sfxOn?'ON':'OFF');sndBtn.className=sfxOn?'':'off'}sndLabel();
sndBtn.addEventListener('click',e=>{sfxOn=!sfxOn;LS.set('rwMute',sfxOn?'0':'1');sndLabel();e.stopPropagation();ac()});
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
addEventListener('pointerdown',ac,{passive:true});addEventListener('keydown',ac);
function tone(f,d,type,vol,slide,delay){if(!sfxOn||!AC)return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,vol,hp){if(!sfxOn||!AC)return;try{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;g.gain.value=vol||.08;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,size,col,align,font){ctx.font='bold '+size+'px '+(font||'"Courier New",monospace');ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function glowText(s,x,y,size,col,glow,align){ctx.save();ctx.shadowColor=glow||col;ctx.shadowBlur=18;text(s,x,y,size,col,align);ctx.restore()}
let best=parseInt(LS.get(GKEY+'-best')||'0',10)||0;
function saveBest(v){if(v>best){best=v;LS.set(GKEY+'-best',String(best));return true}return false}

let mode='menu',score=0,t=0,overT=0,won=false,overMsg='';
const K={};
function endGame(w,m){if(mode!=='play')return;won=!!w;mode=w?'win':'over';overMsg=m||'';overT=0;saveBest(score);tone(w?880:180,.5,w?'square':'sawtooth',.1,w?1.5:.5)}
function bgFill(a,b){const g=ctx.createLinearGradient(0,0,0,LH);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH)}
function hud(l,r,c){ctx.fillStyle='#0b0b1ecc';ctx.fillRect(0,0,LW,44);ctx.fillStyle='#ffffff22';ctx.fillRect(0,43,LW,2);text(l,12,23,16,c||'#ffe85c','left');text(r,LW-12,23,16,'#fff','right')}
function startGame(){mode='play';score=0;overT=0;onStart()}
const META={"title": "DART MASTER", "sub": "301 DOUBLE OUT", "help": ["Drag to aim, release to throw", "Count down from 301 \u2014 must finish on a double", "Beat the CPU to zero"], "c1": "#d8232a", "c2": "#1a8a3a", "win": "GAME SHOT!"};

let rem,darts,phase,mx,my,pwr,dir_,thrown,turn,pops2,fly,round2,cpu,scoreP,scoreC,cx,cy;
const DX=240,DY=250,DR=170;
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
function onInit(){pops2=[];thrown=[];darts=3;scoreP=301;scoreC=301;turn='p';phase='aim'}
function onStart(){scoreP=301;scoreC=301;turn='p';darts=3;phase='aim';fly=null;pops2=[];score=0;thrown=[];round2=0;sway=0}
let sway=0,tgt={x:240,y:250};
function pts(x,y){const dx=x-DX,dy=y-DY,d=Math.hypot(dx,dy);if(d>DR)return{s:0,l:'MISS'};if(d<DR*.045)return{s:50,l:'BULL 50'};if(d<DR*.1)return{s:25,l:'25'};let a=Math.atan2(dx,-dy);if(a<0)a+=TAU;const seg=Math.floor(((a+Math.PI/20)%TAU)/(TAU/20));const n=ORDER[seg];if(d>DR*.93)return{s:n*2,l:'D'+n,dbl:true};if(d>DR*.58&&d<DR*.65)return{s:n*3,l:'T'+n};return{s:n,l:''+n}}
function onTap(p){if(turn!=='p'||phase!=='aim'||fly)return;phase='drag';tgt=p}
function onMove(p){if(phase==='drag')tgt=p}
function onUp(p){if(phase!=='drag')return;throwDart(tgt.x+Math.sin(sway*2.3)*18,tgt.y+Math.cos(sway*1.9)*14,1)}
function onKey(k){if(k===' '&&turn==='p'&&!fly){if(phase==='aim'){phase='drag';tgt={x:240,y:250}}else if(phase==='drag')throwDart(tgt.x+Math.sin(sway*2.3)*18,tgt.y+Math.cos(sway*1.9)*14,1)}else if(phase==='drag'){const m={arrowleft:[-12,0],arrowright:[12,0],arrowup:[0,-12],arrowdown:[0,12]}[k];if(m){tgt.x+=m[0];tgt.y+=m[1]}}}
function throwDart(x,y,who){phase='fly';fly={x,y,t:0,who};tone(600,.1,'triangle',.08,.5)}
function land(){const p=pts(fly.x,fly.y);thrown.push({x:fly.x,y:fly.y,who:fly.who});pops2.push({x:fly.x,y:fly.y-20,t:1,s:p.l||p.s});
 const who=fly.who;let cur=who?scoreP:scoreC;const nw=cur-p.s;tone(p.s>=40?900:400,.1,'square',.1);
 if(nw<0||nw===1||(nw===0&&!p.dbl)){/*bust*/darts=0;pops2.push({x:240,y:120,t:1,s:'BUST',c:'#ff4b64'});bust=true}else{if(who)scoreP=nw;else scoreC=nw;if(nw===0){win(who);return}}
 darts--;fly=null;if(darts<=0||bust){if(bust){/*revert*/}endTurn()}else if(!who){setTimeout(cpuThrow,500)}else{phase='aim'}}
let bust=false;
function endTurn(){bust=false;thrown=[];setTimeout(()=>{if(mode!=='play')return;if(turn==='p'){turn='c';darts=3;phase='cpu';setTimeout(cpuThrow,600)}else{turn='p';darts=3;phase='aim'}},700)}
function win(w){score=w?Math.max(100,(301-scoreC)+500):301-scoreC;setTimeout(()=>endGame(!!w,w?'You checked out!':'CPU finished first'),700)}
function cpuThrow(){if(mode!=='play'||turn!=='c')return;let cur=scoreC;let aimx=DX,aimy=DY;
 if(cur<=40&&cur%2===0){const n=cur/2;const seg=ORDER.indexOf(n);const a=seg*TAU/20;aimx=DX+Math.sin(a)*DR*.96;aimy=DY-Math.cos(a)*DR*.96}else if(cur<=50){const n=cur>20?20:cur;const a=ORDER.indexOf(n>20?20:n)*TAU/20;aimx=DX+Math.sin(a)*DR*.4;aimy=DY-Math.cos(a)*DR*.4}else{const a=0;aimx=DX+Math.sin(a)*DR*.61;aimy=DY-Math.cos(a)*DR*.61}
 const err=34;throwDart(aimx+rnd(-err,err),aimy+rnd(-err,err),0);phase='fly'}
function onUpdate(dt){sway+=dt;for(const p of pops2){p.t-=dt;p.y-=20*dt}pops2=pops2.filter(p=>p.t>0);if(fly){fly.t+=dt*3;if(fly.t>=1)land()}}
function onDraw(){bgFill('#1a0e08','#3a2214');ctx.fillStyle='#2a1a10';for(let i=0;i<8;i++)ctx.fillRect(i*64,0,3,800);
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(DX,DY,DR+14,0,TAU);ctx.fill();
 for(let i=0;i<20;i++){const a0=(i-.5)*TAU/20-Math.PI/2,a1=(i+.5)*TAU/20-Math.PI/2;const dark=i%2===0;const rings=[[1,.93,dark?'#d8232a':'#1a8a3a'],[.93,.65,dark?'#111':'#e8d9b0'],[.65,.58,dark?'#d8232a':'#1a8a3a'],[.58,.1,dark?'#111':'#e8d9b0']];for(const[r1,r0,c]of rings){ctx.fillStyle=c;ctx.beginPath();ctx.arc(DX,DY,DR*r1,a0,a1);ctx.arc(DX,DY,DR*r0,a1,a0,true);ctx.closePath();ctx.fill()}
  const a=i*TAU/20;text(''+ORDER[i],DX+Math.sin(a)*(DR+2)*1.0,DY-Math.cos(a)*(DR+2)*1.0,0.1,'#fff')}
 ctx.fillStyle='#1a8a3a';ctx.beginPath();ctx.arc(DX,DY,DR*.1,0,TAU);ctx.fill();ctx.fillStyle='#d8232a';ctx.beginPath();ctx.arc(DX,DY,DR*.045,0,TAU);ctx.fill();
 for(let i=0;i<20;i++){const a=i*TAU/20;text(''+ORDER[i],DX+Math.sin(a)*(DR+10),DY-Math.cos(a)*(DR+10),10,'#ffe9b8')}
 for(const d of thrown){ctx.fillStyle=d.who?'#ffe85c':'#ff8a3d';ctx.beginPath();ctx.arc(d.x,d.y,4,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke()}
 if(fly){const q=Math.min(1,fly.t),s=2.2-1.2*q;ctx.save();ctx.translate(lerp(240,fly.x,q),lerp(780,fly.y,q));ctx.scale(s,s);ctx.fillStyle=fly.who?'#ffe85c':'#ff8a3d';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-4,16);ctx.lineTo(4,16);ctx.fill();ctx.fillStyle='#ddd';ctx.fillRect(-1,16,2,18);ctx.restore()}
 if(phase==='drag'){const ax=tgt.x+Math.sin(sway*2.3)*18,ay=tgt.y+Math.cos(sway*1.9)*14;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ax,ay,12,0,TAU);ctx.moveTo(ax-18,ay);ctx.lineTo(ax+18,ay);ctx.moveTo(ax,ay-18);ctx.lineTo(ax,ay+18);ctx.stroke()}
 for(const p of pops2){ctx.globalAlpha=Math.min(1,p.t*2);glowText(''+p.s,p.x,p.y,22,p.c||'#fff','#000');ctx.globalAlpha=1}
 ctx.fillStyle='#00000088';rr(30,470+30,190,110,12);ctx.fill();rr(260,500,190,110,12);ctx.fill();text('YOU',125,525,14,'#ffe85c');text(''+scoreP,125,565,44,'#ffe85c');text('CPU',355,525,14,'#ff8a3d');text(''+scoreC,355,565,44,'#ff8a3d');
 text((turn==='p'?'YOUR THROW':'CPU THROWING')+' · darts '+darts,240,650,18,'#fff');if(mode==='play')text('Drag to aim, release to throw · finish exactly on a double',240,LH-30,12,'#c9a');hud('301 DOUBLE-OUT','')}

function step(dt){t+=dt;if(mode==='play')onUpdate(dt);else overT+=dt}
function overlay(){
 const big=LW>600?1:.72,cx=LW/2;
 if(mode==='menu'){ctx.fillStyle='#050510dd';ctx.fillRect(0,0,LW,LH);glowText(META.title,cx,LH*.22,Math.round(54*big),META.c1||'#00ffff',META.c2||'#ff2bd6');text(META.sub||'',cx,LH*.22+46*big,Math.round(18*big),'#ffe85c');
  const h=META.help||[];h.forEach((l,i)=>text(l,cx,LH*.40+i*30*big,Math.round(16*big),'#c5cae8'));
  text('BEST '+best,cx,LH*.40+h.length*30*big+34,Math.round(16*big),'#8a90b8');if(Math.sin(t*5)>0)glowText('TAP TO START',cx,LH*.86,Math.round(28*big),'#ffe85c')}
 else if(mode==='win'||mode==='over'){ctx.fillStyle='#050510cc';ctx.fillRect(0,0,LW,LH);const w=mode==='win';glowText(w?(META.win||'YOU WIN!'):(META.over||'GAME OVER'),cx,LH*.3,Math.round(46*big),w?'#67ff67':'#ff4b64');
  if(overMsg)text(overMsg,cx,LH*.3+46*big,Math.round(17*big),'#c5cae8');text('SCORE',cx,LH*.48,Math.round(14*big),'#8a90b8');glowText(String(score),cx,LH*.48+46*big,Math.round(52*big),'#ffe85c');text('BEST '+best,cx,LH*.48+96*big,Math.round(16*big),'#fff');
  if(overT>.8&&Math.sin(t*5)>0)text('TAP TO PLAY AGAIN',cx,LH*.82,Math.round(20*big),'#00ffff')}}
function draw(){ctx.save();ctx.setTransform(cv.width/LW,0,0,cv.height/LH,0,0);onDraw();overlay();ctx.restore()}
cv.addEventListener('pointerdown',e=>{ac();const p=ptr(e);if(mode!=='play'){if(mode==='menu'||overT>.8)startGame();return}try{cv.setPointerCapture(e.pointerId)}catch(_){}if(typeof onTap==='function')onTap(p,e)});
cv.addEventListener('pointermove',e=>{if(mode==='play'&&typeof onMove==='function')onMove(ptr(e),e)});
const _up=e=>{if(mode==='play'&&typeof onUp==='function')onUp(ptr(e),e)};cv.addEventListener('pointerup',_up);cv.addEventListener('pointercancel',_up);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(mode!=='play'){if((k===' '||k==='enter')&&(mode==='menu'||overT>.8))startGame();return}if(K[k])return;K[k]=true;if(typeof onKey==='function')onKey(k,e)});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();K[k]=false;if(mode==='play'&&typeof onKeyUp==='function')onKeyUp(k,e)});
let _last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-_last)/1000);_last=now;step(dt);draw()}
if(typeof onInit==='function')onInit();requestAnimationFrame(loop);

/* RETRO WORLD profile bridge: report start / progress / finish to the arcade (trophies, quests, streaks) */
(()=>{const GID="dart-master.html",GT="DART MASTER".toUpperCase();let act=false,last=0,fin=false;
const send=(t,x)=>{try{parent.postMessage(Object.assign({source:'retro-world-game',type:t,gameId:GID,title:GT},x||{}),'*')}catch(e){}};
const val=()=>{try{return Math.max(0,Math.round(Number(score)||0))}catch(e){return 0}};
const snap=()=>send('progress',{metric:'score',value:val(),higherBetter:true});
setInterval(()=>{let m='';try{m=String(mode)}catch(e){return}
const playing=(m==='play'||m==='clear'||m==='dying'),now=Date.now();
if(playing&&!act){act=true;fin=false;send('start');snap();last=now}
if(act&&playing&&now-last>1500){snap();last=now}
if(act&&!fin&&(m==='win'||m==='over')){fin=true;act=false;send('finish',{metric:'score',value:val(),higherBetter:true,result:m==='win'?'win':'lose'})}
if(!playing&&m==='menu'){act=false}},250);
addEventListener('pagehide',()=>{if(act)snap()});})();
</script></body></html>
