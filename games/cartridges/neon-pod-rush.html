<div class="touch-hint">TOUCH: LEFT/RIGHT STEER • UP THROTTLE • DOWN BRAKE/DRIFT • A BOOST • START MENU</div></div><script>

const MOBILE_TOUCH=(()=>{
  const keyValue=v=>v==='SPACE'?' ':v==='ENTER'?'Enter':v;
  function fire(type,key){
    const ev=new KeyboardEvent(type,{key:keyValue(key),bubbles:true,cancelable:true});
    window.dispatchEvent(ev);
  }
  document.querySelectorAll('[data-touch-key]').forEach(btn=>{
    const key=btn.dataset.touchKey;
    const down=e=>{
      e.preventDefault();
      try{btn.setPointerCapture(e.pointerId)}catch(_){}
      btn.classList.add('pressed');
      fire('keydown',key);
    };
    const up=e=>{
      e.preventDefault();
      btn.classList.remove('pressed');
      fire('keyup',key);
    };
    btn.addEventListener('pointerdown',down,{passive:false});
    btn.addEventListener('pointerup',up,{passive:false});
    btn.addEventListener('pointercancel',up,{passive:false});
    btn.addEventListener('pointerleave',e=>{if(btn.classList.contains('pressed'))up(e)},{passive:false});
  });

  // Makes mouse-driven games work on phones too.
  // Tap = normal click, long-press = secondary/right click.
  const canvas=document.getElementById('g');
  if(canvas){
    let holdTimer=null,held=false,startX=0,startY=0;
    const mouse=(button,cx,cy)=>{
      canvas.dispatchEvent(new MouseEvent('mousedown',{
        bubbles:true,cancelable:true,button,
        clientX:cx,clientY:cy,view:window
      }));
    };
    canvas.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='touch')return;
      e.preventDefault(); held=false; startX=e.clientX; startY=e.clientY;
      holdTimer=setTimeout(()=>{held=true;mouse(2,startX,startY)},520);
    },{passive:false});
    canvas.addEventListener('pointermove',e=>{
      if(e.pointerType!=='touch'||!holdTimer)return;
      if(Math.hypot(e.clientX-startX,e.clientY-startY)>16){clearTimeout(holdTimer);holdTimer=null}
    },{passive:false});
    canvas.addEventListener('pointerup',e=>{
      if(e.pointerType!=='touch')return;
      e.preventDefault();
      if(holdTimer){clearTimeout(holdTimer);holdTimer=null}
      if(!held)mouse(0,e.clientX,e.clientY);
      held=false;

const RACING_TOUCH=(()=>{
  const base=document.getElementById('joystickBase'),knob=document.getElementById('joystickKnob');
  const toggle=document.getElementById('controlModeBtn'),hint=document.querySelector('.touch-hint');
  const STORAGE='retroWorldRacingControlMode';
  const arrows={ArrowLeft:false,ArrowRight:false,ArrowUp:false,ArrowDown:false};
  window.RACING_JOYSTICK={x:0,y:0,active:false,mode:'dpad'};
  function fire(type,key){window.dispatchEvent(new KeyboardEvent(type,{key,bubbles:true,cancelable:true}))}
  function setArrow(key,on){on=!!on;if(arrows[key]===on)return;arrows[key]=on;fire(on?'keydown':'keyup',key)}
  function releaseArrows(){Object.keys(arrows).forEach(k=>setArrow(k,false))}
  function resetStick(){
    window.RACING_JOYSTICK.x=0;window.RACING_JOYSTICK.y=0;window.RACING_JOYSTICK.active=false;
    if(knob)knob.style.transform='translate(-50%,-50%)';releaseArrows()
  }
  function setMode(mode,saveIt=true){
    mode=mode==='joystick'?'joystick':'dpad';resetStick();window.RACING_JOYSTICK.mode=mode;
    document.body.classList.toggle('joystick-mode',mode==='joystick');
    if(toggle){toggle.textContent=mode==='joystick'?'CTRL: JOY':'CTRL: D-PAD';toggle.classList.toggle('joy',mode==='joystick');toggle.setAttribute('aria-pressed',mode==='joystick'?'true':'false')}
    if(hint)hint.textContent=mode==='joystick'?'TOUCH: ANALOG JOYSTICK • A ACTION/BOOST • START':'TOUCH: D-PAD • A ACTION/BOOST • START';
    if(saveIt)try{localStorage.setItem(STORAGE,mode)}catch(_){}
  }
  function updateStick(e){
    if(!base||!knob)return;
    const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy;
    const knobR=knob.getBoundingClientRect().width/2,max=Math.max(22,r.width/2-knobR-7),len=Math.hypot(dx,dy);
    if(len>max){dx=dx/len*max;dy=dy/len*max}
    let nx=Math.max(-1,Math.min(1,dx/max)),ny=Math.max(-1,Math.min(1,dy/max));
    if(Math.hypot(nx,ny)<.10){nx=0;ny=0;dx=0;dy=0}
    knob.style.transform=`translate(-50%,-50%) translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`;
    window.RACING_JOYSTICK.x=nx;window.RACING_JOYSTICK.y=ny;window.RACING_JOYSTICK.active=true;
    setArrow('ArrowLeft',nx<-.28);setArrow('ArrowRight',nx>.28);setArrow('ArrowUp',ny<-.28);setArrow('ArrowDown',ny>.28)
  }
  if(toggle)toggle.addEventListener('click',e=>{e.preventDefault();setMode(window.RACING_JOYSTICK.mode==='joystick'?'dpad':'joystick')});
  if(base){
    const down=e=>{if(window.RACING_JOYSTICK.mode!=='joystick')return;e.preventDefault();try{base.setPointerCapture(e.pointerId)}catch(_){}updateStick(e)};
    const move=e=>{if(window.RACING_JOYSTICK.mode!=='joystick'||!window.RACING_JOYSTICK.active)return;e.preventDefault();updateStick(e)};
    const up=e=>{if(window.RACING_JOYSTICK.mode!=='joystick')return;e.preventDefault();resetStick()};
    base.addEventListener('pointerdown',down,{passive:false});base.addEventListener('pointermove',move,{passive:false});
    base.addEventListener('pointerup',up,{passive:false});base.addEventListener('pointercancel',up,{passive:false});
    base.addEventListener('lostpointercapture',up,{passive:false});base.addEventListener('contextmenu',e=>e.preventDefault())
  }
  let saved='dpad';try{saved=localStorage.getItem(STORAGE)||'dpad'}catch(_){}
  setMode(saved,false);return{setMode,reset:resetStick}
})();


const SFX=(()=>{
  let ac=null, master=null, engineOsc=null, engineGain=null;
  let enabled=true;
  try{ enabled=localStorage.getItem('retroWorldSFX')!=='off'; }catch(e){}
  function ensure(){
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=0.7; master.connect(ac.destination);
    }
    if(ac.state==='suspended') ac.resume();
    return ac;
  }
  function tone(freq=440,dur=.06,type='square',vol=.05,endFreq=null){
    if(!enabled) return;
    ensure();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(Math.max(20,freq),ac.currentTime);
    if(endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),ac.currentTime+dur);
    g.gain.setValueAtTime(Math.max(.0001,vol),ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+dur+.01);
  }
  function noise(dur=.12,vol=.05){
    if(!enabled) return;
    ensure();
    const len=Math.max(1,Math.floor(ac.sampleRate*dur));
    const buf=ac.createBuffer(1,len,ac.sampleRate), data=buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
    const s=ac.createBufferSource(), g=ac.createGain();
    s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(master); s.start();
  }
  function laser(){ tone(980,.09,'square',.045,260); }
  function enemyLaser(){ tone(330,.08,'sawtooth',.035,140); }
  function hit(){ tone(240,.045,'square',.045,125); }
  function paddle(){ tone(520,.035,'square',.04,620); }
  function wall(){ tone(300,.025,'square',.025); }
  function boom(big=false){ noise(big?.28:.15,big?.09:.055); tone(big?70:110,big?.25:.13,'sawtooth',big?.07:.045,big?30:55); }
  function pickup(){ tone(660,.055,'square',.04,880); setTimeout(()=>tone(990,.07,'square',.035,1320),45); }
  function success(){ tone(523,.08,'square',.04); setTimeout(()=>tone(659,.08,'square',.04),90); setTimeout(()=>tone(784,.14,'square',.04),180); }
  function fail(){ tone(180,.12,'sawtooth',.05,90); setTimeout(()=>tone(90,.18,'sawtooth',.04,45),90); }
  function jump(){ tone(260,.11,'square',.04,650); }
  function step(){ tone(115,.025,'square',.018); }
  function flag(){ tone(760,.04,'square',.025); }
  function flip(){ tone(420,.035,'square',.025); }
  function mismatch(){ tone(180,.1,'square',.035,130); }
  function cannon(){ noise(.07,.055); tone(95,.12,'square',.055,55); }
  function line(n=1){ tone(400+n*80,.07,'square',.04); setTimeout(()=>tone(650+n*90,.11,'square',.035),60); }
  function score(){ tone(700,.045,'square',.025,900); }
  function engine(on=true,freq=95,vol=.018){
    if(!enabled){ stopEngine(); return; }
    ensure();
    if(on){
      if(!engineOsc){
        engineOsc=ac.createOscillator(); engineGain=ac.createGain();
        engineOsc.type='sawtooth'; engineOsc.frequency.value=freq;
        engineGain.gain.value=vol; engineOsc.connect(engineGain); engineGain.connect(master); engineOsc.start();
      }
      engineOsc.frequency.setTargetAtTime(Math.max(35,freq),ac.currentTime,.04);
      engineGain.gain.setTargetAtTime(vol,ac.currentTime,.04);
    } else stopEngine();
  }
  function stopEngine(){
    if(engineOsc){try{engineOsc.stop()}catch(e){} engineOsc=null;engineGain=null;}
  }
  function toggle(){
    enabled=!enabled;
    try{localStorage.setItem('retroWorldSFX',enabled?'on':'off')}catch(e){}
    if(!enabled) stopEngine();
    updateButton();
    if(enabled) tone(660,.05,'square',.025);
  }
  function updateButton(){
    const b=document.getElementById('sfxToggle');
    if(b){b.textContent=enabled?'SFX: ON':'SFX: OFF';b.classList.toggle('off',!enabled);}
  }
  addEventListener('pointerdown',()=>{if(enabled)ensure()},{once:true});
  addEventListener('keydown',()=>{if(enabled)ensure()},{once:true});
  addEventListener('load',updateButton);
  return {tone,noise,laser,enemyLaser,hit,paddle,wall,boom,pickup,success,fail,jump,step,flag,flip,mismatch,cannon,line,score,engine,stopEngine,toggle,updateButton};
})();

const PORTABLE_GAMEPAD=(()=>{
  const state={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false,' ':false,Enter:false};
  let raf=0,connected=false;

  function emit(key,down){
    if(state[key]===down)return;
    state[key]=down;
    window.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{
      key,bubbles:true,cancelable:true
    }));
  }

  function readButton(gp,i){return !!(gp&&gp.buttons&&gp.buttons[i]&&gp.buttons[i].pressed)}

  function loop(){
    const pads=navigator.getGamepads?navigator.getGamepads():[];
    let gp=null;
    for(const p of pads){if(p&&p.connected){gp=p;break}}

    if(gp){
      connected=true;
      const ax0=gp.axes&&gp.axes.length>0?gp.axes[0]:0;
      const ax1=gp.axes&&gp.axes.length>1?gp.axes[1]:0;
      const dead=.38;

      emit('ArrowLeft', ax0<-dead || readButton(gp,14));
      emit('ArrowRight',ax0> dead || readButton(gp,15));
      emit('ArrowUp',   ax1<-dead || readButton(gp,12));
      emit('ArrowDown', ax1> dead || readButton(gp,13));
      emit(' ',readButton(gp,0));
      emit('Enter',readButton(gp,9));
    }else if(connected){
      connected=false;
      Object.keys(state).forEach(k=>emit(k,false));
    }
    raf=requestAnimationFrame(loop);
  }

  addEventListener('gamepadconnected',()=>{
    if(!raf)raf=requestAnimationFrame(loop);
    try{SFX.tone(620,.05,'square',.02,820)}catch(e){}
  });

  if(navigator.getGamepads)raf=requestAnimationFrame(loop);
  return {};
})();

 }

function buildTrack(def){
 const raw=def.pts;
 // Run every circuit in the opposite direction while keeping the same
 // start/finish location. Reversing the control points reverses tangents,
 // AI pathing, lap progress and the player's starting heading together.
 const cps=[raw[0],...raw.slice(1).reverse()],n=cps.length,samples=[];
 const per=18;
 for(let i=0;i<n;i++){
   const p0=cps[(i-1+n)%n],p1=cps[i],p2=cps[(i+1)%n],p3=cps[(i+2)%n];
   for(let k=0;k<per;k++)samples.push(catmull(p0,p1,p2,p3,k/per))
 }
 let cum=[0],length=0;
 for(let i=0;i<samples.length;i++){
   const a=samples[i],b=samples[(i+1)%samples.length];
   length+=dist(a.x,a.y,b.x,b.y);cum.push(length)
 }
 const tang=[],normals=[];
 for(let i=0;i<samples.length;i++){
   const a=samples[(i-1+samples.length)%samples.length],b=samples[(i+1)%samples.length];
   const t=norm(b.x-a.x,b.y-a.y);tang.push(t);normals.push({x:-t.y,y:t.x})
 }
 return{def,samples,cum,length,tang,normals,width:def.width,reverse:true}
}
function pointAtS(s,offset=0){
 s=mod(s,track.length);

 while(lo<hi){
   const mid=(lo+hi+1)>>1;
   if(track.cum[mid]<=s)lo=mid;else hi=mid-1
 }
 const i=lo,a=track.samples[i],b=track.samples[(i+1)%track.samples.length];
 const seg=track.cum[i+1]-track.cum[i]||1,t=(s-track.cum[i])/seg;
 const px=L(a.x,b.x,t),py=L(a.y,b.y,t);
 const ta=track.tang[i],no=track.normals[i];
 return{x:px+no.x*offset,y:py+no.y*offset,tx:ta.x,ty:ta.y,nx:no.x,ny:no.y,a:Math.atan2(ta.y,ta.x),i}
}
function nearestTrack(px,py){
 let bestD=1e12,best=null;
 const pts=track.samples,N=pts.length;
 for(let i=0;i<N;i++){
   const a=pts[i],b=pts[(i+1)%N],vx=b.x-a.x,vy=b.y-a.y,l2=vx*vx+vy*vy||1;
   const t=C(((px-a.x)*vx+(py-a.y)*vy)/l2,0,1);
   const qx=a.x+vx*t,qy=a.y+vy*t,dx=px-qx,dy=py-qy,d2=dx*dx+dy*dy;
   if(d2<bestD){
     const segLen=Math.sqrt(l2),s=track.cum[i]+segLen*t;
     const tn=norm(vx,vy),nn={x:-tn.y,y:tn.x};
     bestD=d2;best={d:Math.sqrt(d2),qx,qy,s,tx:tn.x,ty:tn.y,nx:nn.x,ny:nn.y,side:dx*nn.x+dy*nn.y}
   }
 }

function vehiclePhysics(dt){
 const st=selectedStats();
 const joy=window.RACING_JOYSTICK,analog=joy&&joy.mode==='joystick'&&joy.active;
 let throttle=analog?C(-joy.y,0,1):((K.arrowup||K.w)?1:0);
 let brake=analog?C(joy.y,0,1):((K.arrowdown||K.s)?1:0);
 let steer=analog?joy.x:(((K.arrowright||K.d)?1:0)-((K.arrowleft||K.a)?1:0));
 const boostKey=!!(K[' ']||K.x);
 if(countdown>0){throttle=0;brake=0;steer=0}

 const fx=Math.cos(car.a),fy=Math.sin(car.a),rx=-fy,ry=fx;
 let lon=dot(car.vx,car.vy,fx,fy),lat=dot(car.vx,car.vy,rx,ry);
 const speed=Math.hypot(car.vx,car.vy);
 const n=car.nearest||nearestTrack(car.x,car.y);
 const roadHalf=track.width*.5;
 const onRoad=n.d<roadHalf;
 car.offroad=!onRoad;

 // Hover-racer engine model.
 let accel=st.accel*throttle;
 let top=st.top;
 let grip=st.grip*cfg.grip;
 const drifting=brake&&speed>145&&Math.abs(steer)>.2;
 if(drifting)grip*=.46; // deliberate controllable drift mode

 let boosting=boostKey&&car.boost>0&&car.heat<100&&throttle>0&&onRoad;
 if(boosting){
   accel+=410*st.boost;
   top*=1.23;
   car.boost=Math.max(0,car.boost-29*cfg.boostUse*dt);
   car.heat=Math.min(115,car.heat+38*st.heat*cfg.heat*dt);
 }else{
   car.boost=Math.min(100,car.boost+(onRoad?8.5:5)*dt);
   car.heat=Math.max(0,car.heat-(onRoad?24:18)*dt)
 }

 // Longitudinal propulsion / braking.
 if(lon<top)lon+=accel*dt;
 if(brake){
   if(lon>0){
     const brakeForce=drifting?(185+speed*.10):(500+speed*.30);
     lon=Math.max(0,lon-brakeForce*dt)
   }else lon=Math.max(-95,lon-150*dt)
 }
 // Aerodynamic and rolling drag.
 const drag=(onRoad?.42:1.35)+(Math.abs(lon)/Math.max(1,top))*.38;
 lon*=Math.max(0,1-drag*dt);
 if(!throttle&&!brake)lon*=Math.max(0,1-.32*dt);

 // Lateral grip: stronger at moderate speed, still lets the pod drift.
 const speedGrip=C(speed/180,.25,1.15);
 lat*=Math.max(0,1-grip*speedGrip*dt);

 // Steering based on forward speed. Reversing flips direction.
 const steerGain=C(Math.abs(lon)/210,.16,1);
 const targetAV=steer*st.turn*steerGain*(drifting?1.10:1)*(lon>=0?1:-1);
 car.angVel=L(car.angVel,targetAV,1-Math.exp(-6.2*dt));
 car.angVel*=Math.max(0,1-1.2*dt);
 car.a+=car.angVel*dt;

 // Reconstruct world velocity after local tire forces.
 const nfX=Math.cos(car.a),nfY=Math.sin(car.a),nrX=-nfY,nrY=nfX;
 car.vx=nfX*lon+nrX*lat;
 car.vy=nfY*lon+nrY*lat;

 if(!onRoad){
   car.vx*=Math.max(.82,1-1.15*dt);
   car.vy*=Math.max(.82,1-1.15*dt);
 }

 car.x+=car.vx*dt;car.y+=car.vy*dt;
 car.nearest=nearestTrack(car.x,car.y);

 // Physical barrier response, not teleport/stick.
 const limit=roadHalf+30;
 if(car.nearest.d>limit){
   const q=car.nearest,sgn=q.side>=0?1:-1;
   const nx=q.nx*sgn,ny=q.ny*sgn;
   car.x=q.qx+nx*limit;car.y=q.qy+ny*limit;
   const vn=dot(car.vx,car.vy,nx,ny);
   if(vn>0){
     car.vx-=nx*vn*1.38;car.vy-=ny*vn*1.38;
     const impact=Math.abs(vn);
     if(car.inv<=0&&impact>80){
       const dmg=Math.round(C((impact-70)*.065,2,18)*cfg.barrier*cfg.damage);
       car.hull-=dmg;car.inv=.55;shake=.16;flash=.12;SFX.hit()
     }
   }
 }

 car.inv=Math.max(0,car.inv-dt);

 // Continuous race progress from closest spline distance.
 const s=car.nearest.s;
 let ds=s-car.lastS;
 if(ds>track.length*.5)ds-=track.length;
 if(ds<-track.length*.5)ds+=track.length;
 // Ignore impossible jumps, otherwise allow reversing to lose progress.
 if(Math.abs(ds)<140)car.totalS+=ds;
 car.lastS=s;
 car.wrong=ds<-2?Math.min(2,car.wrong+dt):Math.max(0,car.wrong-dt*2);

 if(car.hull<=0){car.hull=0;state='over';SFX.stopEngine();SFX.fail()}
 if(car.totalS>=track.length*track.def.laps)finishRace();

 const pitch=70+C(Math.hypot(car.vx,car.vy)/5,0,130)+(boosting?32:0);
 SFX.engine(true,pitch,.015)
}
function updateAI(dt){
 const playerS=car.totalS;
 for(const a of ais){
   a.contact=Math.max(0,a.contact-dt);a.think-=dt;
   const catchup=C((playerS-a.totalS)/900,-.05,.055);
   const targetSpeed=selectedStats().top*a.base*(.78+catchup);
   a.speed=L(a.speed,targetSpeed,1-Math.exp(-2.4*dt));
   a.totalS+=a.speed*dt;
   if(a.think<=0){
     a.think=R(.5,1.1);
     // AI picks a racing-line offset but avoids crowding nearby rivals/player.
     const options=[-track.width*.26,-track.width*.13,0,track.width*.13,track.width*.26];
     let best=a.lane,bestScore=-999;
     for(const off of options){
       let sc=-Math.abs(off)*.0015;
       for(const b of ais)if(b!==a&&Math.abs(b.totalS-a.totalS)<105&&Math.abs(b.lane-off)<28)sc-=1.2;
       if(Math.abs(playerS-a.totalS)<125){
         const pn=car.nearest.side;
         if(Math.abs(pn-off)<32)sc-=1.45
       }
       if(sc>bestScore){bestScore=sc;best=off}
     }
     a.targetLane=best
   }
   a.lane=L(a.lane,a.targetLane,1-Math.exp(-2.7*dt));

   const ap=pointAtS(a.totalS,a.lane);
   const pv={x:ap.tx*a.speed,y:ap.ty*a.speed};
   const d=dist(car.x,car.y,ap.x,ap.y);
   if(d<32&&a.contact<=0&&car.inv<=0){
     const nn=norm(car.x-ap.x,car.y-ap.y);
     const rvx=car.vx-pv.x,rvy=car.vy-pv.y;
     const closing=-dot(rvx,rvy,nn.x,nn.y);
     if(closing>20){
       const impulse=(closing*.55+42)/selectedStats().mass;
       car.vx+=nn.x*impulse;car.vy+=nn.y*impulse;
       car.x+=nn.x*8;car.y+=nn.y*8;
       a.lane-=dot(nn.x,nn.y,ap.nx,ap.ny)*22;
       a.targetLane=C(a.lane,-track.width*.30,track.width*.30);
       a.contact=1.15;car.inv=.55;shake=.12;SFX.hit();
       car.hull-=Math.round(C(closing*.018,1,8)*cfg.damage)
     }
   }
 }
}
function updatePickups(){
 for(const q of pickups){
   if(q.hit)continue;
   const p=pointAtS(q.s,q.offset);
   if(dist(car.x,car.y,p.x,p.y)<35){
     q.hit=true;
     if(q.type==='boost'){car.boost=C(car.boost+42,0,100);score+=80;SFX.pickup()}
     else if(q.type==='repair'){car.hull=C(car.hull+Math.round(car.maxHull*.24),0,car.maxHull);score+=60;SFX.pickup()}
     else{score+=200;SFX.score()}
   }
 }
}
function update(dt){
 bannerT=Math.max(0,bannerT-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);
 if(state!=='play')return;

 if(countdown>0){
   countdown-=dt;
   // Player physics is still called with controls zeroed so camera/road state
   // remains stable, but AI and the race clock are completely frozen.
   vehiclePhysics(dt);
   camera.x=L(camera.x,car.x,1-Math.exp(-7*dt));
   camera.y=L(camera.y,car.y,1-Math.exp(-7*dt));
   camera.a=L(camera.a,car.a,1-Math.exp(-7*dt));
   if(countdown<=0){
     countdown=0;
     banner='GO!';bannerT=.65;SFX.success();
     // Give every AI pod its engine speed on the same GO frame.
     for(const a of ais)a.speed=0
   }
   return
 }

 raceTime+=dt;
 vehiclePhysics(dt);
 if(state!=='play')return;
 updateAI(dt);updatePickups();
 camera.x=L(camera.x,car.x,1-Math.exp(-7*dt));
 camera.y=L(camera.y,car.y,1-Math.exp(-7*dt));
 camera.a=L(camera.a,car.a,1-Math.exp(-7*dt));
}

 x.fillStyle=col;x.fillRect(-22,-23,12,39);x.fillRect(10,-23,12,39);
 x.fillStyle='#a7f7ff';x.fillRect(-19,-19,6,10);x.fillRect(13,-19,6,10);
 x.strokeStyle=col;x.lineWidth=3;x.beginPath();x.moveTo(-10,-4);x.lineTo(-3,1);x.moveTo(10,-4);x.lineTo(3,1);x.stroke();
 x.fillStyle='#effcff';x.beginPath();x.moveTo(0,-17);x.lineTo(8,7);x.lineTo(0,13);x.lineTo(-8,7);x.closePath();x.fill();
 x.fillStyle='#172544';x.fillRect(-4,-7,8,9);x.restore()
}
function drawRace(){
 x.save();
 if(shake>0)x.translate(R(-3,3)*shake/.16,R(-2,2)*shake/.16);
 worldTransform();drawTrackWorld();drawVehiclesWorld();x.restore();
 drawHUD();
 if(flash>0){x.fillStyle=`rgba(255,45,70,${flash*1.2})`;x.fillRect(0,0,W,H)}
}
function drawEnd(){
 drawRace();
 x.fillStyle='rgba(0,0,0,.86)';x.fillRect(78,132,484,202);
 const ok=state==='clear'||state==='win';
 txt(state==='win'?'ECLIPSE CHAMPION':ok?'QUALIFIED!':'RACE FAILED',W/2,157,29,ok?'#6cff8b':'#ff576d','center');
 txt('FINISH: '+finishRank+' / '+(ais.length+1),W/2,207,17,'#ffe066','center');
 txt('TIME '+raceTime.toFixed(2)+'s',W/2,237,12,'#fff','center');
 if(state==='over'&&track?.def.boss)txt('CHAMPION EVENT REQUIRES 1ST',W/2,263,10,'#ff8bab','center');
 else if(state==='over')txt('FINISH TOP 3 TO ADVANCE',W/2,263,10,'#ff8bab','center');
 txt('ENTER / START',W/2,298,13,'#59eaff','center')
}
function draw(){
 if(state==='title')drawTitle();
 else if(state==='select')drawTrackSelect();
 else if(state==='garage')drawGarage();
 else if(state==='play')drawRace();
 else drawEnd()
}

function cyclePart(row,dir){
 if(row===0){save.color=mod(save.color+dir,COLORS.length)}
 else{
   const arr=row===1?CHASSIS:row===2?ENGINES:FINS;
   let idx=row===1?save.chassis:row===2?save.engine:save.fins;
   for(let n=0;n<arr.length;n++){
     idx=mod(idx+dir,arr.length);
     if(partUnlocked(arr[idx]))break
   }
   if(row===1)save.chassis=idx;else if(row===2)save.engine=idx;else save.fins=idx
 }
 saveLocal();SFX.step()
}
function menuKeys(){
 if(menuLatch){
   if(!(K.arrowleft||K.arrowright||K.arrowup||K.arrowdown||K.enter||K[' ']))menuLatch=0;
   return
 }
 if(state==='title'){
   if(K.enter){state='select';trackChoice=C(save.unlocked,1,10);menuLatch=1;SFX.success()}
   else if(K[' ']){state='garage';menuLatch=1;SFX.pickup()}
 }else if(state==='select'){
   if(K.arrowleft){trackChoice=Math.max(1,trackChoice-1);menuLatch=1;SFX.step()}
   else if(K.arrowright){trackChoice=Math.min(10,trackChoice+1);menuLatch=1;SFX.step()}
   else if(K[' ']){state='garage';menuLatch=1;SFX.pickup()}
   else if(K.enter){
     if(trackChoice<=save.unlocked){beginRace();menuLatch=1}else SFX.wall()
   }
 }else if(state==='garage'){
   if(K.arrowup){garageRow=mod(garageRow-1,4);menuLatch=1;SFX.step()}
   else if(K.arrowdown){garageRow=mod(garageRow+1,4);menuLatch=1;SFX.step()}
   else if(K.arrowleft){cyclePart(garageRow,-1);menuLatch=1}
   else if(K.arrowright){cyclePart(garageRow,1);menuLatch=1}
   else if(K.enter){state='select';menuLatch=1;SFX.success()}
 }else if(['clear','over','win'].includes(state)&&K.enter){
   if(state==='clear'){trackChoice=Math.min(10,Math.max(trackChoice+1,save.unlocked))}
   state='select';menuLatch=1
 }
}
function loop(t){
 const dt=Math.min(.033,(t-last)/1000||0);last=t;
 if(state==='play')update(dt);else menuKeys();
 draw();requestAnimationFrame(loop)
}
requestAnimationFrame(loop);

window.__gameDebug=()=>({
 state,difficulty,trackChoice,unlocked:save.unlocked,finishRank,score,raceTime,
 track:track?{name:track.def.name,length:track.length,width:track.width,laps:track.def.laps,boss:track.def.boss}:null,
 car:car?{x:car.x,y:car.y,vx:car.vx,vy:car.vy,a:car.a,speed:Math.hypot(car.vx,car.vy),hull:car.hull,boost:car.boost,heat:car.heat,totalS:car.totalS,offroad:car.offroad}:null,
 rivals:ais.map(a=>({name:a.name,totalS:a.totalS,lane:a.lane,speed:a.speed,boss:a.boss}))
});
window.__gameTest={
 setDifficulty:v=>{const e=document.getElementById('difficultySelect');if(e)e.value=v},
 unlock:n=>{save.unlocked=C(n,1,10);saveLocal()},
 select:n=>{trackChoice=C(n,1,10);state='select'},
 start:()=>beginRace(),
 countdown:()=>countdown,
 aiProgress:()=>ais.map(a=>a.totalS),
 step:(dt=.016,n=1)=>{for(let i=0;i<n;i++)update(dt)},
 setKeys:o=>{Object.keys(K).forEach(k=>K[k]=0);Object.assign(K,o)},
 setCar:(o={})=>{if(!car)beginRace();Object.assign(car,o);car.nearest=nearestTrack(car.x,car.y)},
 nearest:()=>car?nearestTrack(car.x,car.y):null,
 forceFinish:(rank=1)=>{
   if(!car)beginRace();
   const target=track.length*track.def.laps+4;car.totalS=target;
   ais.forEach((a,i)=>a.totalS=rank===1?target-60-i*15:(i<rank-1?target+80+i*15:target-50-i*10));
   finishRace()
 },
 stats:()=>selectedStats(),
 debug:()=>window.__gameDebug()
};
const RETRO_LOCAL_STATS=(()=>{
 const GAME_ID="neon-pod-rush.html",GAME_TITLE="NEON POD RUSH";let active=false,lastProgress=0;
 function mode(){try{return String(state||'').toLowerCase()}catch(e){return ''}}
 function metric(){try{return{name:'score',value:Math.round(score||0),higher:true}}catch(e){return{name:'score',value:0,higher:true}}}
 function send(type,extra={}){try{parent.postMessage(Object.assign({source:'retro-world-game',type,gameId:GAME_ID,title:GAME_TITLE},extra),'*')}catch(e){}}
 function snap(){const q=metric();send('progress',{metric:q.name,value:q.value,higherBetter:q.higher})}
 setInterval(()=>{const now=Date.now(),md=mode(),playing=md==='play',won=md==='win',lost=md==='over';
   if(playing&&!active){active=true;send('start');snap();lastProgress=now}
   if(active&&playing&&now-lastProgress>1200){snap();lastProgress=now}
   if(active&&(won||lost)){const q=metric();snap();send('finish',{result:won?'win':'loss',metric:q.name,value:q.value,higherBetter:q.higher});active=false}
 },250);
 addEventListener('pagehide',()=>{if(active)snap()});return{snapshot:snap};
})();
</script></body></html>
