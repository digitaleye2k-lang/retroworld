<!doctype html><html><head><script src="rw-boost.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MERGE 2048 • RETRO WORLD</title><style>
html,body{height:100%;margin:0;background:#03050c;color:#fff;font-family:"Courier New",monospace}
body{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#151735,#03050c 68%);overflow:hidden}
.wrap{width:min(96vw,900px);text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;min-height:34px}
.title{color:#4deaff;font-size:clamp(14px,3vw,20px);font-weight:900;letter-spacing:2px;text-shadow:2px 2px #4c165d}
.diff{display:flex;gap:5px;align-items:center;color:#949abc;font-size:8px}
.diff select{background:#0b0d1d;color:#fff;border:1px solid #4deaff;padding:5px;font:700 9px "Courier New",monospace}
.frame{position:relative;border:3px solid #4deaff;box-shadow:0 0 0 3px #181a36,0 0 28px #00eaff29;background:#050714}
canvas{display:block;width:100%;height:auto;max-height:calc(100dvh - 115px);object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none}
.help{margin-top:7px;color:#858bad;font-size:9px;line-height:1.45}
.help b{color:#e6d36f}
@media(max-width:650px){.wrap{width:99vw}.top{margin:2px 5px 4px}.help{font-size:7px;margin-top:4px}.diff span{display:none}}
</style><script>addEventListener('keydown',function(e){if((e.keyCode||e.which)===461&&window.parent!==window){e.preventDefault();window.parent.postMessage({type:'retroworld-tv-back'},'*');}},true);</script></head>
<body><div class="wrap"><div class="top"><div class="title">MERGE 2048</div><div class="diff"><span>DIFFICULTY</span><select id="difficultySelect"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option></select></div></div>
<div class="frame"><canvas id="g" width="640" height="640"></canvas></div><div class="help"><b>SWIPE / ARROWS / WASD</b> SLIDE TILES • MATCHING NUMBERS MERGE • REACH THE GOAL TILE</div></div>
<script>

const c=document.getElementById('g'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const W=c.width,H=c.height;
let AC=null;
function beep(f,d,type,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||0.05;g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function ptr(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function txt(s,px,py,size,col,al){x.font='bold '+size+'px Courier New';x.fillStyle=col;x.textAlign=al||'center';x.fillText(s,px,py)}
function overlay(lines){x.fillStyle='rgba(3,5,12,.82)';x.fillRect(0,0,W,H);lines.forEach((l,i)=>txt(l[0],W/2,H/2-40+i*34,l[1],l[2]))}

let state='title',difficulty='normal',g,score=0,target=2048,best=0,msg='',anims=[],spawnP=.1;
const N=4,CS=110,GX=100,GY=130;
const COLS={0:'#0c1030',2:'#1d3b7a',4:'#1f6fa3',8:'#18a0a8',16:'#18b07a',32:'#4fc74a',64:'#a8d63a',128:'#ffe05a',256:'#ffb13b',512:'#ff7a3b',1024:'#ff4b64',2048:'#ff2bd6',4096:'#b04bff',8192:'#7a4bff'};
function diff(){difficulty=document.getElementById('difficultySelect').value;target=difficulty==='easy'?512:2048;spawnP=difficulty==='hard'?.3:.1}
function empty(){const e=[];for(let r=0;r<N;r++)for(let q=0;q<N;q++)if(!g[r][q])e.push([r,q]);return e}
function spawn(){const e=empty();if(!e.length)return;const [r,q]=e[Math.floor(Math.random()*e.length)];g[r][q]=Math.random()<spawnP?4:2}
function reset(){diff();g=Array.from({length:N},()=>Array(N).fill(0));score=0;msg='';spawn();spawn();state='play'}
function slide(line){const a=line.filter(v=>v);let gain=0;for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;gain+=a[i];a.splice(i+1,1)}}while(a.length<N)a.push(0);return{a,gain}}
function move(dir){if(state!=='play')return;let moved=false,gainT=0;const ng=g.map(r=>r.slice());
 for(let i=0;i<N;i++){let line=[];for(let j=0;j<N;j++){const r=dir==='up'?j:dir==='down'?N-1-j:i,q=dir==='left'?j:dir==='right'?N-1-j:i;line.push(g[r][q])}
  const res=slide(line);gainT+=res.gain;for(let j=0;j<N;j++){const r=dir==='up'?j:dir==='down'?N-1-j:i,q=dir==='left'?j:dir==='right'?N-1-j:i;if(ng[r][q]!==res.a[j])moved=true;ng[r][q]=res.a[j]}}
 if(!moved)return;g=ng;score+=gainT;if(gainT)beep(300+Math.min(600,gainT*3),.08,'triangle');else beep(180,.03,'square',.02);spawn();best=Math.max(best,score);
 if(g.flat().some(v=>v>=target)){state='won';beep(784,.4);return}
 if(!canMove())state='over'}
function canMove(){if(empty().length)return true;for(let r=0;r<N;r++)for(let q=0;q<N;q++){if(q<N-1&&g[r][q]===g[r][q+1])return true;if(r<N-1&&g[r][q]===g[r+1][q])return true}return false}
function draw(){
 x.fillStyle='#050714';x.fillRect(0,0,W,H);
 if(state==='title'){txt('MERGE 2048',W/2,170,46,'#4deaff');txt('SLIDE TILES • MATCHING NUMBERS MERGE',W/2,230,16,'#ffe35b');txt('EASY: REACH 512 • NORMAL: 2048 • HARD: 2048, MORE 4s',W/2,268,13,'#b5bbd5');txt('SWIPE / ARROWS / WASD',W/2,310,14,'#b5bbd5');txt('CLICK / TAP / ENTER TO START',W/2,380,18,'#73ff89');return}
 txt('MERGE 2048',W/2,44,26,'#4deaff');txt('SCORE '+score+'    BEST '+best+'    GOAL '+target,W/2,84,15,'#ffe35b');
 x.fillStyle='#10143a';x.fillRect(GX-10,GY-10,N*CS+10,N*CS+10);
 for(let r=0;r<N;r++)for(let q=0;q<N;q++){const v=g[r][q],px=GX+q*CS,py=GY+r*CS;x.fillStyle=COLS[v]||'#ff2bd6';x.fillRect(px,py,CS-10,CS-10);if(v){x.strokeStyle='#ffffff55';x.lineWidth=2;x.strokeRect(px,py,CS-10,CS-10);txt(String(v),px+(CS-10)/2,py+(CS-10)/2+(v>=1000?10:14),v>=1000?30:v>=100?36:42,v<=4?'#e8f1ff':'#050714')}}
 txt('SWIPE ON THE BOARD • ARROWS / WASD',W/2,H-24,12,'#858bad');
 if(state==='won')overlay([['YOU MADE '+target+'!',38,'#73ff89'],['SCORE '+score,20,'#ffe35b'],['CLICK / ENTER TO PLAY AGAIN',14,'#fff']]);
 if(state==='over')overlay([['NO MOVES LEFT',38,'#ff5a79'],['SCORE '+score,20,'#ffe35b'],['CLICK / ENTER TO TRY AGAIN',14,'#fff']]);
}
let sw=null;
c.addEventListener('pointerdown',e=>{if(state!=='play'){reset();return}sw=ptr(e)});
c.addEventListener('pointerup',e=>{if(!sw||state!=='play')return;const p=ptr(e),dx=p.x-sw.x,dy=p.y-sw.y;sw=null;if(Math.hypot(dx,dy)<24)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up')});
addEventListener('keydown',e=>{const k=e.key;if(state!=='play'){if(k==='Enter'||k===' '){reset();e.preventDefault()}return}
 const m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[k];if(m){move(m);e.preventDefault()}});
document.getElementById('difficultySelect').addEventListener('change',()=>{if(state!=='play')diff()});
g=Array.from({length:N},()=>Array(N).fill(0));setInterval(draw,33);draw();

const RETRO_LOCAL_STATS=(()=>{
  const GAME_ID="merge-2048.html", GAME_TITLE="MERGE 2048";
  let active=false,lastProgress=0;
  function mode(){try{return String(state||'').toLowerCase()}catch(e){return ''}}
  function metric(){try{return {name:'score',value:Math.round(Number(score)||0),higher:true}}catch(e){return {name:'score',value:0,higher:true}}}
  function send(type,extra={}){try{parent.postMessage(Object.assign({source:'retro-world-game',type,gameId:GAME_ID,title:GAME_TITLE},extra),'*')}catch(e){}}
  function snapshot(){const m=metric();send('progress',{metric:m.name,value:m.value,higherBetter:m.higher})}
  setInterval(()=>{const now=Date.now(),md=mode(),playing=md==='play'||md==='playing'||md==='running',won=md==='win'||md==='won'||md==='victory'||md==='complete',lost=md==='over'||md==='gameover'||md==='lost'||md==='dead'||md==='fail'||md==='failed';
    if(playing&&!active){active=true;send('start');snapshot();lastProgress=now}
    if(active&&playing&&now-lastProgress>1200){snapshot();lastProgress=now}
    if(active&&(won||lost)){const m=metric();snapshot();send('finish',{result:won?'win':'loss',metric:m.name,value:m.value,higherBetter:m.higher});active=false}
  },250);
  addEventListener('pagehide',()=>{if(active)snapshot()});
  return{snapshot};
})();
</script></body></html>
