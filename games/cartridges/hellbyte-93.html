const MOBILE_TOUCH=(()=>{
  const keyValue=v=>v==='SPACE'?' ':v==='ENTER'?'Enter':v;
  function fire(type,key){
    const ev=new KeyboardEvent(type,{key:keyValue(key),bubbles:true,cancelable:true});
    window.dispatchEvent(ev);
  }
  document.querySelectorAll('[data-touch-key]').forEach(btn=>{
    const key=btn.dataset.touchKey;
    const down=e=>{
      e.preventDefault();
      try{btn.setPointerCapture(e.pointerId)}catch(_){}
      btn.classList.add('pressed');
      fire('keydown',key);
    };
    const up=e=>{
      e.preventDefault();
      btn.classList.remove('pressed');
      fire('keyup',key);
    };
    btn.addEventListener('pointerdown',down,{passive:false});
    btn.addEventListener('pointerup',up,{passive:false});
    btn.addEventListener('pointercancel',up,{passive:false});
    btn.addEventListener('pointerleave',e=>{if(btn.classList.contains('pressed'))up(e)},{passive:false});
  });

  // Makes mouse-driven games work on phones too.
  // Tap = normal click, long-press = secondary/right click.
  const canvas=document.getElementById('g');
  if(canvas){
    let holdTimer=null,held=false,startX=0,startY=0;
    const mouse=(button,cx,cy)=>{
      canvas.dispatchEvent(new MouseEvent('mousedown',{
        bubbles:true,cancelable:true,button,
        clientX:cx,clientY:cy,view:window
      }));
    };
    canvas.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='touch')return;
      e.preventDefault(); held=false; startX=e.clientX; startY=e.clientY;
      holdTimer=setTimeout(()=>{held=true;mouse(2,startX,startY)},520);
    },{passive:false});
    canvas.addEventListener('pointermove',e=>{
      if(e.pointerType!=='touch'||!holdTimer)return;
      if(Math.hypot(e.clientX-startX,e.clientY-startY)>16){clearTimeout(holdTimer);holdTimer=null}
    },{passive:false});
    canvas.addEventListener('pointerup',e=>{
      if(e.pointerType!=='touch')return;
      e.preventDefault();
      if(holdTimer){clearTimeout(holdTimer);holdTimer=null}
      if(!held)mouse(0,e.clientX,e.clientY);
      held=false;
    },{passive:false});
    canvas.addEventListener('pointercancel',()=>{
      if(holdTimer)clearTimeout(holdTimer);holdTimer=null;held=false;
    },{passive:false});
  }

  // Block long-press browser UI (Select / Select All / copy callout / drag)
  // only inside the on-screen game controls.
  const touchRoot=document.getElementById('touchControls');
  if(touchRoot){
    ['contextmenu','selectstart','dragstart'].forEach(type=>{
      touchRoot.addEventListener(type,e=>e.preventDefault(),{capture:true});
    });
    touchRoot.addEventListener('touchstart',e=>e.preventDefault(),{passive:false,capture:true});
    touchRoot.addEventListener('touchmove',e=>e.preventDefault(),{passive:false,capture:true});

    // Some mobile browsers can still create a Selection during a long hold.
    document.addEventListener('selectionchange',()=>{
      const sel=window.getSelection&&window.getSelection();
      if(!sel||sel.rangeCount===0)return;
      const node=sel.anchorNode;
      const el=node&&(node.nodeType===1?node:node.parentElement);
      if(el&&touchRoot.contains(el)){
        try{sel.removeAllRanges()}catch(_){}
      }
    });
  }

  return {};
})();



const SFX=(()=>{
  let ac=null, master=null, engineOsc=null, engineGain=null;
  let enabled=true;
  try{ enabled=localStorage.getItem('retroWorldSFX')!=='off'; }catch(e){}
  function ensure(){
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=0.7; master.connect(ac.destination);
    }
    if(ac.state==='suspended') ac.resume();
    return ac;
  }
  function tone(freq=440,dur=.06,type='square',vol=.05,endFreq=null){
    if(!enabled) return;
    ensure();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(Math.max(20,freq),ac.currentTime);
    if(endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),ac.currentTime+dur);
    g.gain.setValueAtTime(Math.max(.0001,vol),ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+dur+.01);
  }
  function noise(dur=.12,vol=.05){
    if(!enabled) return;
    ensure();
    const len=Math.max(1,Math.floor(ac.sampleRate*dur));
    const buf=ac.createBuffer(1,len,ac.sampleRate), data=buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
    const s=ac.createBufferSource(), g=ac.createGain();
    s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(master); s.start();
  }
  function laser(){ tone(980,.09,'square',.045,260); }
  function enemyLaser(){ tone(330,.08,'sawtooth',.035,140); }
  function hit(){ tone(240,.045,'square',.045,125); }
  function paddle(){ tone(520,.035,'square',.04,620); }
  function wall(){ tone(300,.025,'square',.025); }
  function boom(big=false){ noise(big?.28:.15,big?.09:.055); tone(big?70:110,big?.25:.13,'sawtooth',big?.07:.045,big?30:55); }
  function pickup(){ tone(660,.055,'square',.04,880); setTimeout(()=>tone(990,.07,'square',.035,1320),45); }
  function success(){ tone(523,.08,'square',.04); setTimeout(()=>tone(659,.08,'square',.04),90); setTimeout(()=>tone(784,.14,'square',.04),180); }
  function fail(){ tone(180,.12,'sawtooth',.05,90); setTimeout(()=>tone(90,.18,'sawtooth',.04,45),90); }
  function jump(){ tone(260,.11,'square',.04,650); }
  function step(){ tone(115,.025,'square',.018); }
  function flag(){ tone(760,.04,'square',.025); }

const PORTABLE_GAMEPAD=(()=>{
  const state={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false,' ':false,Enter:false};
  let raf=0,connected=false;

  function emit(key,down){
    if(state[key]===down)return;
    state[key]=down;
    window.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{
      key,bubbles:true,cancelable:true
    }));
  }

  function readButton(gp,i){return !!(gp&&gp.buttons&&gp.buttons[i]&&gp.buttons[i].pressed)}

  function loop(){
    const pads=navigator.getGamepads?navigator.getGamepads():[];
    let gp=null;
    for(const p of pads){if(p&&p.connected){gp=p;break}}

    if(gp){
      connected=true;
      const ax0=gp.axes&&gp.axes.length>0?gp.axes[0]:0;
      const ax1=gp.axes&&gp.axes.length>1?gp.axes[1]:0;
      const dead=.38;

      emit('ArrowLeft', ax0<-dead || readButton(gp,14));
      emit('ArrowRight',ax0> dead || readButton(gp,15));
      emit('ArrowUp',   ax1<-dead || readButton(gp,12));
      emit('ArrowDown', ax1> dead || readButton(gp,13));
      emit(' ',readButton(gp,0));
      emit('Enter',readButton(gp,9));
    }else if(connected){
      connected=false;
      Object.keys(state).forEach(k=>emit(k,false));
    }
    raf=requestAnimationFrame(loop);
  }

  addEventListener('gamepadconnected',()=>{
    if(!raf)raf=requestAnimationFrame(loop);
    try{SFX.tone(620,.05,'square',.02,820)}catch(e){}
  });

  if(navigator.getGamepads)raf=requestAnimationFrame(loop);
  return {};
})();

const MAP_N=19,FOV=Math.PI/3,RAY_STEP=2,MAX_RAY=24;
let map=[],state='title',level=1,score=0,levelKills=0,totalKills=0;
let player={x:1.5,y:1.5,a:0,hp:100,armor:0,ammo:18,key:false};
let enemies=[],pickups=[],projectiles=[],exitCell={x:17.5,y:17.5};
let depth=[],pathField=[],pathTick=0,fireCooldown=0,weaponKick=0,damageFlash=0,message='',messageT=0,levelTimer=0;
let levelSeed=0,mouseDX=0,roadBob=0;

const LEVEL_NAMES=['CINDER LAB','VOID FOUNDRY','ASH CATHEDRAL','BLOOD CIRCUIT','OBSIDIAN CORE'];
const ENEMY_TYPES={
  fiend:{name:'BYTE FIEND',hp:58,speed:.72,damage:8,score:140,color:'#d53d52',accent:'#ffad4f',range:.72,cool:1.0},
  skull:{name:'VOID SKULL',hp:38,speed:1.0,damage:6,score:115,color:'#7e4bca',accent:'#f06cff',range:.62,cool:.72},

function rng(seed){
  let h=seed>>>0;
  return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}

function shuffle(a,r){

  return a;
}
function indexOfCell(cx,cy){return cy*MAP_N+cx}
function inBounds(cx,cy){return cx>=0&&cy>=0&&cx<MAP_N&&cy<MAP_N}

function carveRooms(grid,r,lv){
  const rooms=2+lv;
  for(let n=0;n<rooms;n++){
    let w=3+(Math.floor(r()*2)*2),h=3+(Math.floor(r()*2)*2);
    let rx=1+Math.floor(r()*(MAP_N-w-2)),ry=1+Math.floor(r()*(MAP_N-h-2));
    if(rx%2===0)rx++;if(ry%2===0)ry++;
    for(let y=ry;y<Math.min(MAP_N-1,ry+h);y++)
      for(let xx=rx;xx<Math.min(MAP_N-1,rx+w);xx++)grid[y][xx]=0;
  }
}
function bfsDistances(grid,sx,sy){
  const dist=Array(MAP_N*MAP_N).fill(9999),q=[[sx,sy]];
  dist[indexOfCell(sx,sy)]=0;
  let qi=0;
  while(qi<q.length){
    const [cx,cy]=q[qi++],d=dist[indexOfCell(cx,cy)]+1;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx,ny=cy+dy;
      if(!inBounds(nx,ny)||grid[ny][nx]!==0)continue;
      const id=indexOfCell(nx,ny);
      if(d<dist[id]){dist[id]=d;q.push([nx,ny])}
    }
  }
  return dist;
}
function buildLevel(lv){
  levelSeed=9300+lv*177;
  const r=rng(levelSeed);
  let grid=Array.from({length:MAP_N},()=>Array(MAP_N).fill(1));
  const stack=[[1,1]];grid[1][1]=0;
  while(stack.length){
    const [cx,cy]=stack[stack.length-1];
    const dirs=shuffle([[2,0],[-2,0],[0,2],[0,-2]],r);
    let carved=false;
    for(const [dx,dy] of dirs){
      const nx=cx+dx,ny=cy+dy;
      if(nx<=0||ny<=0||nx>=MAP_N-1||ny>=MAP_N-1||grid[ny][nx]===0)continue;
      grid[cy+dy/2][cx+dx/2]=0;grid[ny][nx]=0;stack.push([nx,ny]);carved=true;break;
    }
    if(!carved)stack.pop();
  }
  carveRooms(grid,r,lv);
  for(let i=0;i<MAP_N;i++){grid[0][i]=1;grid[MAP_N-1][i]=1;grid[i][0]=1;grid[i][MAP_N-1]=1}

  const dist=bfsDistances(grid,1,1);
  let open=[];
  for(let y=1;y<MAP_N-1;y++)for(let xx=1;xx<MAP_N-1;xx++)
    if(grid[y][xx]===0&&dist[indexOfCell(xx,y)]<9999)open.push({x:xx,y,d:dist[indexOfCell(xx,y)]});
  open.sort((a,b)=>a.d-b.d);
  const far=open[open.length-1];
  const keyPos=open[Math.max(2,Math.floor(open.length*.72))];

  map=grid.map((row,y)=>row.map((v,xx)=>v?1+((xx*7+y*11+lv*3)%3):0));
  exitCell={x:far.x+.5,y:far.y+.5};
  player.x=1.5;player.y=1.5;player.a=0;player.key=false;

  enemies=[];pickups=[];projectiles=[];levelKills=0;
  const candidates=open.filter(p=>p.d>4&&Math.hypot(p.x-far.x,p.y-far.y)>2.2);
  shuffle(candidates,r);

  const enemyCount=5+lv*3;
  for(let i=0;i<enemyCount&&i<candidates.length;i++){
    const p=candidates[i];
    let type=lv===1?(r()<.7?'fiend':'skull'):(r()<.48?'fiend':r()<.72?'skull':'wraith');
    enemies.push(makeEnemy(type,p.x+.5,p.y+.5));
  }

  if(lv===5){
    const bp=keyPos;
    enemies.push(makeEnemy('boss',bp.x+.5,bp.y+.5,true));
  }else{
    pickups.push({type:'key',x:keyPos.x+.5,y:keyPos.y+.5,alive:true});
  }

  let pi=enemyCount+1;
  const addPickup=(type,n)=>{
    for(let k=0;k<n&&pi<candidates.length;k++,pi++){
      const p=candidates[pi];pickups.push({type,x:p.x+.5,y:p.y+.5,alive:true});
    }
  };
  addPickup('ammo',3+lv);addPickup('health',2);addPickup('armor',1+Math.floor(lv/2));

  message='LEVEL '+lv+' — '+LEVEL_NAMES[lv-1];messageT=2.2;
  computePathField();
}
function makeEnemy(type,x0,y0,dropsKey=false){
  const t=ENEMY_TYPES[type];
  return{type,x:x0,y:y0,hp:t.hp,maxHp:t.hp,alive:true,attack:0,wake:false,dropsKey,anim:R(0,6.2)};
}
function resetGame(){

  level=1;score=0;totalKills=0;
  player={x:1.5,y:1.5,a:0,hp:100,armor:0,ammo:18,key:false};

  buildLevel(level);state='play';
}
function completeLevel(){

function damagePlayer(amount){
  if(state!=='play')return;
  let left=amount;
  if(player.armor>0){
    const absorb=Math.min(player.armor,Math.ceil(amount*.55));
    player.armor-=absorb;left-=absorb;
  }
  player.hp=Math.max(0,player.hp-left);damageFlash=.38;SFX.hit();
  if(player.hp<=0){state='over';SFX.fail()}
}
function computePathField(){
  const sx=Math.floor(player.x),sy=Math.floor(player.y);
  pathField=Array(MAP_N*MAP_N).fill(9999);
  const q=[[sx,sy]];pathField[indexOfCell(sx,sy)]=0;let qi=0;
  while(qi<q.length){
    const [cx,cy]=q[qi++],nd=pathField[indexOfCell(cx,cy)]+1;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx,ny=cy+dy;if(isWallCell(nx,ny))continue;
      const id=indexOfCell(nx,ny);if(nd<pathField[id]){pathField[id]=nd;q.push([nx,ny])}
    }
  }
}
function lineOfSight(ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy),steps=Math.ceil(d/.08);
  for(let i=1;i<steps;i++){
    const t=i/steps;if(isWall(ax+dx*t,ay+dy*t))return false;
  }
  return true;
}
function moveCircle(obj,dx,dy,r=.19){
  const nx=obj.x+dx,ny=obj.y+dy;
  if(!isWall(nx+r,obj.y)&&!isWall(nx-r,obj.y))obj.x=nx;
  if(!isWall(obj.x,ny+r)&&!isWall(obj.x,ny-r))obj.y=ny;
}
function angleTo(ax,ay,bx,by){return Math.atan2(by-ay,bx-ax)}
function spawnOrb(e,t){
  const a=angleTo(e.x,e.y,player.x,player.y),sp=t.boss?3.05:2.45;
  projectiles.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:4,damage:t.damage,boss:!!t.boss});
  SFX.enemyLaser();
}
function shoot(){
  if(state!=='play'||fireCooldown>0)return;
  if(player.ammo<=0){SFX.tone(95,.07,'square',.025,70);message='NO AMMO';messageT=.55;fireCooldown=.22;return}
  player.ammo--;fireCooldown=.42;weaponKick=1;SFX.cannon();

  let best=null,bestDist=999;
  for(const e of enemies){
    if(!e.alive)continue;
    const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);
    if(d>10||d>=bestDist)continue;
    const da=Math.abs(normAng(Math.atan2(dy,dx)-player.a));
    const aim=.055+.17/Math.max(1,d);
    if(da<aim&&lineOfSight(player.x,player.y,e.x,e.y)){best=e;bestDist=d}
  }
  if(best){
    const dmg=38+Math.floor(R(0,22));
    best.hp-=dmg;best.wake=true;SFX.hit();

  }
}
function killEnemy(e){
  if(!e.alive)return;
  e.alive=false;levelKills++;totalKills++;
  const t=ENEMY_TYPES[e.type];score+=t.score;SFX.boom(!!t.boss);

}
function updatePickups(){
  for(const p of pickups){
    if(!p.alive)continue;
    if(Math.hypot(player.x-p.x,player.y-p.y)>.48)continue;
    p.alive=false;SFX.pickup();
    if(p.type==='ammo'){player.ammo+=8;score+=40;message='+8 AMMO'}
    if(p.type==='health'){player.hp=Math.min(100,player.hp+28);score+=35;message='+HEALTH'}
    if(p.type==='armor'){player.armor=Math.min(100,player.armor+30);score+=45;message='+ARMOR'}

  }
}
function updateEnemies(dt){
  pathTick-=dt;
  if(pathTick<=0){computePathField();pathTick=.24}
  for(const e of enemies){
    if(!e.alive)continue;
    e.anim+=dt*5;e.attack=Math.max(0,e.attack-dt);
    const t=ENEMY_TYPES[e.type],dist=Math.hypot(player.x-e.x,player.y-e.y);
    const sees=dist<9&&lineOfSight(e.x,e.y,player.x,player.y);
    if(sees)e.wake=true;
    if(!e.wake)continue;

    if(t.ranged&&sees&&dist<t.range&&e.attack<=0){
      spawnOrb(e,t);e.attack=t.cool;continue;
    }
    if(!t.ranged&&dist<t.range&&e.attack<=0){
      damagePlayer(t.damage);e.attack=t.cool;continue;
    }

    if(dist>.58){
      const cx=Math.floor(e.x),cy=Math.floor(e.y);
      let best={x:cx,y:cy,d:pathField[indexOfCell(cx,cy)]};
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx,ny=cy+dy;if(isWallCell(nx,ny))continue;
        const dd=pathField[indexOfCell(nx,ny)];
        if(dd<best.d)best={x:nx,y:ny,d:dd};
      }
      let tx=best.x+.5,ty=best.y+.5;
      if(sees&&dist<2.2){tx=player.x;ty=player.y}
      const a=Math.atan2(ty-e.y,tx-e.x),sp=t.speed*dt;
      moveCircle(e,Math.cos(a)*sp,Math.sin(a)*sp,.16);
    }
  }
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.life-=dt;
    const nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;
    if(p.life<=0||isWall(nx,ny)){projectiles.splice(i,1);continue}
    p.x=nx;p.y=ny;
    if(Math.hypot(player.x-p.x,player.y-p.y)<.28){
      damagePlayer(p.damage);projectiles.splice(i,1);continue;
    }
  }
}
function update(dt){
  fireCooldown=Math.max(0,fireCooldown-dt);
  weaponKick=Math.max(0,weaponKick-dt*5.5);
  damageFlash=Math.max(0,damageFlash-dt);
  messageT=Math.max(0,messageT-dt);
  if(state==='levelclear'){levelTimer-=dt;if(levelTimer<=0)startNextLevel();return}
  if(state!=='play')return;

  const turn=((K.arrowright||K.d)?1:0)-((K.arrowleft||K.a)?1:0);
  player.a=normAng(player.a+turn*dt*1.9+mouseDX*.003);mouseDX=0;

  const fwd=((K.arrowup||K.w)?1:0)-((K.arrowdown||K.s)?1:0);
  const strafe=((K.e)?1:0)-((K.q)?1:0);
  const speed=fwd>=0?2.15:1.45;
  const dx=Math.cos(player.a)*fwd*speed*dt + Math.cos(player.a+Math.PI/2)*strafe*1.75*dt;
  const dy=Math.sin(player.a)*fwd*speed*dt + Math.sin(player.a+Math.PI/2)*strafe*1.75*dt;
  moveCircle(player,dx,dy,.20);

  if(K[' '])shoot();

  updateEnemies(dt);updateProjectiles(dt);updatePickups();

  if(Math.hypot(player.x-exitCell.x,player.y-exitCell.y)<.45){
    if(player.key)completeLevel();
    else if(messageT<=0){message='CORE KEY REQUIRED';messageT=.75;SFX.wall()}
  }
}
function castRay(a){
  const sin=Math.sin(a),cos=Math.cos(a);
  let mapX=Math.floor(player.x),mapY=Math.floor(player.y);
  const ddx=Math.abs(1/(cos||1e-9)),ddy=Math.abs(1/(sin||1e-9));
  let stepX,stepY,sideX,sideY;
  if(cos<0){stepX=-1;sideX=(player.x-mapX)*ddx}else{stepX=1;sideX=(mapX+1-player.x)*ddx}
  if(sin<0){stepY=-1;sideY=(player.y-mapY)*ddy}else{stepY=1;sideY=(mapY+1-player.y)*ddy}
  let side=0,dist=MAX_RAY,tile=1;
  for(let i=0;i<80;i++){
    if(sideX<sideY){sideX+=ddx;mapX+=stepX;side=0}else{sideY+=ddy;mapY+=stepY;side=1}

      dist=side===0?(mapX-player.x+(1-stepX)/2)/(cos||1e-9):(mapY-player.y+(1-stepY)/2)/(sin||1e-9);
      break;
    }
  }
  const hx=player.x+cos*dist,hy=player.y+sin*dist;
  const tex=side===0?(hy-Math.floor(hy)):(hx-Math.floor(hx));
  return{dist:Math.max(.001,dist),tile,side,tex};
}
function wallColor(tile,side,tex,band){

  else if(tile===2)base=[72,78,86];
  else base=[70,54,108];
  let shade=side?0.68:0.9;
  if((Math.floor(tex*8)&1)===0)shade*=.88;
  if(band)shade*=band;
  return`rgb(${Math.floor(base[0]*shade)},${Math.floor(base[1]*shade)},${Math.floor(base[2]*shade)})`;
}
function renderWorld(){
  const cg=x.createLinearGradient(0,0,0,H*.55);cg.addColorStop(0,'#08060c');cg.addColorStop(1,'#24101e');
  x.fillStyle=cg;x.fillRect(0,0,W,H*.56);
  const fg=x.createLinearGradient(0,H*.46,0,H);fg.addColorStop(0,'#1a1114');fg.addColorStop(1,'#070609');
  x.fillStyle=fg;x.fillRect(0,H*.46,W,H*.54);

  for(let yy=250;yy<H;yy+=12){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}

  depth=[];
  for(let sx=0;sx<W;sx+=RAY_STEP){
    const rayA=player.a-FOV/2+(sx/W)*FOV,hit=castRay(rayA);

function screenProjection(wx,wy){
  const dx=wx-player.x,dy=wy-player.y,dist=Math.hypot(dx,dy);
  const rel=normAng(Math.atan2(dy,dx)-player.a);
  if(Math.abs(rel)>FOV*.72)return null;
  const sx=W/2+Math.tan(rel)*(W/2)/Math.tan(FOV/2);
  return{sx,dist,rel};
}
function spriteVisible(sx,dist){
  const ix=Math.floor(C(sx/RAY_STEP,0,depth.length-1));

}

    x.beginPath();x.moveTo(28,-18);x.lineTo(42,-42);x.lineTo(12,-28);x.closePath();x.fill();

function drawProjectiles(){

function renderSprites(){
  const all=[];
  enemies.filter(e=>e.alive).forEach(e=>all.push({kind:'enemy',obj:e,d:Math.hypot(e.x-player.x,e.y-player.y)}));
  pickups.filter(p=>p.alive).forEach(p=>all.push({kind:'pickup',obj:p,d:Math.hypot(p.x-player.x,p.y-player.y)}));
  all.sort((a,b)=>b.d-a.d);

  for(const it of all){

const RW_LEVEL_SYSTEM=(()=>{
  const GAME_ID="hellbyte-93.html", KIND="action", NATIVE_LEVEL=true, SCALE_ENABLED=true;
  const MAX_LEVEL=10, MODE="native", PER_LEVEL=1, PROGRESS_LABEL="NATIVE";
  const sel=document.getElementById('difficultySelect');
  const DIFF={
    easy:{label:'EASY',base:.90,step:.042,challenge:.08},
    normal:{label:'NORMAL',base:1.00,step:.070,challenge:.15},
    hard:{label:'HARD',base:1.16,step:.098,challenge:.23}
  };
  let difficulty='normal',rwLevel=1,active=false,lastMode='',bannerTimer=0,challengeUntil=0;
  let baseMetric=0,peakMetric=0,completed=0,lastCompletionMode='',metricName=PROGRESS_LABEL;
  const frame=document.querySelector('.frame'),topbar=document.querySelector('.top');
  let hud=null,banner=null;

  function readMode(){
    try{if(typeof state!=='undefined')return String(state).toLowerCase()}catch(e){}
    try{if(typeof st!=='undefined')return String(st).toLowerCase()}catch(e){}
    return ''
  }
  function readNativeStage(){
    if(!NATIVE_LEVEL)return 1;
    try{const v=(level);if(Number.isFinite(v))return Math.max(1,Math.floor(v))}catch(e){}
    return 1
  }
  function readMetric(){
    try{
      if(MODE==='metric'){
        const v=(score);
        return Number.isFinite(v)?Number(v):null
      }
      if(MODE==='minefield'){
        if(!Array.isArray(reveal)||!Array.isArray(board))return null;
        let shown=0;
        for(let y=0;y<reveal.length;y++)for(let z=0;z<(reveal[y]||[]).length;z++)
          if(reveal[y][z]&&board[y]&&board[y][z]!==-1)shown++;
        return shown
      }
    }catch(e){}
    return null
  }
  function loadDifficulty(){
    let v='normal';try{v=localStorage.getItem('rwDifficulty:'+GAME_ID)||'normal'}catch(e){}
    if(!DIFF[v])v='normal';difficulty=v;if(sel)sel.value=v
  }
  function saveDifficulty(){
    if(sel&&DIFF[sel.value])difficulty=sel.value;
    try{localStorage.setItem('rwDifficulty:'+GAME_ID,difficulty)}catch(e){}
    updateHud()
  }
  loadDifficulty();if(sel)sel.addEventListener('change',saveDifficulty);
  function cfg(){return DIFF[difficulty]||DIFF.normal}
  function currentStage(){return NATIVE_LEVEL?Math.min(MAX_LEVEL,readNativeStage()):rwLevel}
  function challengeActive(){return Date.now()<challengeUntil}
  function speedScale(){
    if(!SCALE_ENABLED)return 1;
    const lv=currentStage();
    let s=cfg().base+(lv-1)*cfg().step+(challengeActive()?cfg().challenge:0);
    if(KIND==='cards')s=1+(s-1)*.48;
    if(KIND==='puzzle')s=1+(s-1)*.72;
    return Math.max(.78,Math.min(2.25,s))
  }

  if(!NATIVE_LEVEL&&topbar){
    hud=document.createElement('div');hud.className='rw-level-hud';
    hud.innerHTML='<span class="rw-level">LV 1/'+MAX_LEVEL+'</span><span class="rw-diff">NORMAL</span><span class="rw-next"></span><span class="rw-boss">CHALLENGE</span>';
    const diff=topbar.querySelector('.rw-diffbox');topbar.insertBefore(hud,diff||null)
  }
  if(!NATIVE_LEVEL&&frame){
    banner=document.createElement('div');banner.className='rw-level-banner';banner.textContent='LEVEL 1';frame.appendChild(banner)
  }
  function nextThreshold(){
    if(MODE==='metric'||MODE==='minefield')return PER_LEVEL*rwLevel;
    return null
  }
  function progressValue(){
    if(MODE==='metric'||MODE==='minefield')return Math.max(0,peakMetric-baseMetric);
    if(MODE==='completion')return completed;
    return 0
  }
  function updateHud(){
    if(!hud)return;
    const a=hud.querySelector('.rw-level'),d=hud.querySelector('.rw-diff'),n=hud.querySelector('.rw-next');
    if(a)a.textContent='LV '+rwLevel+'/'+MAX_LEVEL;
    if(d)d.textContent=cfg().label;
    if(n){
      if(rwLevel>=MAX_LEVEL)n.textContent='MAX';
      else if(MODE==='metric'||MODE==='minefield')n.textContent='NEXT '+Math.ceil(nextThreshold());
      else if(MODE==='completion')n.textContent='NEXT '+PROGRESS_LABEL;
      else n.textContent=''
    }
    hud.classList.toggle('boss',challengeActive())
  }
  function flash(text,challenge=false){
    if(!banner)return;
    banner.textContent=text;banner.classList.add('show');bannerTimer=Date.now()+1350;
    if(challenge){
      challengeUntil=Date.now()+7000;
      try{SFX.tone(150,.15,'sawtooth',.03,90)}catch(e){}
    }else try{SFX.tone(720,.06,'square',.025,960)}catch(e){}
  }
  function startSession(){
    active=true;rwLevel=1;completed=0;challengeUntil=0;
    const m=readMetric();baseMetric=m===null?0:m;peakMetric=baseMetric;
    flash('LEVEL 1 • '+cfg().label);updateHud()
  }
  function levelUp(){
    if(rwLevel>=MAX_LEVEL)return;
    rwLevel++;
    const challenge=(rwLevel===4||rwLevel===7||rwLevel===10);
    flash(challenge?'CHALLENGE LEVEL '+rwLevel:'LEVEL '+rwLevel,challenge);
    updateHud()
  }
  function syncMetricLevel(){
    const m=readMetric();if(m===null)return;
    peakMetric=Math.max(peakMetric,m);
    const progress=Math.max(0,peakMetric-baseMetric);
    while(rwLevel<MAX_LEVEL&&progress>=PER_LEVEL*rwLevel)levelUp()
  }
  function update(){
    const md=readMode(),playing=(md==='play'||md==='playing'||md==='running');
    if(NATIVE_LEVEL){
      rwLevel=Math.min(MAX_LEVEL,readNativeStage());
      if(banner&&bannerTimer&&Date.now()>bannerTimer){banner.classList.remove('show');bannerTimer=0}
      lastMode=md;return
    }
    if(playing&&!active)startSession();
    if(active){
      if(MODE==='metric'||MODE==='minefield'){
        if(playing)syncMetricLevel()
      }else if(MODE==='completion'){
        const won=(md==='win'||md==='won'||md==='complete'||md==='completed'||md==='victory');
        const wasWon=(lastMode==='win'||lastMode==='won'||lastMode==='complete'||lastMode==='completed'||lastMode==='victory');
        if(won&&!wasWon){completed++;if(rwLevel<MAX_LEVEL)levelUp()}
        if(md==='over'||md==='gameover'||md==='dead'||md==='lose'||md==='lost')active=false
      }
      if((MODE==='metric'||MODE==='minefield')&&(md==='over'||md==='gameover'||md==='win'||md==='won'||md==='complete'||md==='completed'))active=false
    }
    if(banner&&bannerTimer&&Date.now()>bannerTimer){banner.classList.remove('show');bannerTimer=0}
    updateHud();lastMode=md
  }

  if(SCALE_ENABLED){
    const nativeRAF=window.requestAnimationFrame.bind(window),clocks=new WeakMap();
    window.requestAnimationFrame=function(cb){
      return nativeRAF(real=>{
        let q=clocks.get(cb);
        if(!q){q={real,sim:real};clocks.set(cb,q)}
        else{const dr=Math.max(0,Math.min(50,real-q.real));q.real=real;q.sim+=dr*speedScale()}
        cb(q.sim)
      })
    }
  }
  setInterval(update,120);updateHud();
  window.__rwLevels=()=>({
    gameId:GAME_ID,native:NATIVE_LEVEL,mode:MODE,difficulty,level:currentStage(),maxLevel:MAX_LEVEL,
    scale:speedScale(),progress:progressValue(),perLevel:PER_LEVEL,nextAt:rwLevel>=MAX_LEVEL?null:nextThreshold(),
    metric:metricName,challenge:challengeActive()
  });
  return{get level(){return currentStage()},get difficulty(){return difficulty},scale:speedScale}
})();

const RETRO_LOCAL_STATS=(()=>{
 const GAME_ID="hellbyte-93.html",GAME_TITLE="HELLBYTE '93";let active=false,lastProgress=0;
 function mode(){try{if(typeof state!=='undefined')return String(state).toLowerCase()}catch(e){}return ''}
 function metric(){try{if(typeof score==='number'&&Number.isFinite(score))return{name:'score',value:Math.round(score),higher:true}}catch(e){}return{name:'score',value:0,higher:true}}
 function send(type,extra={}){try{parent.postMessage(Object.assign({source:'retro-world-game',type,gameId:GAME_ID,title:GAME_TITLE},extra),'*')}catch(e){}}
 function snap(){const q=metric();send('progress',{metric:q.name,value:q.value,higherBetter:q.higher})}
 setInterval(()=>{
   const now=Date.now(),md=mode(),playing=md==='play',
   won=['win','won','victory','complete'].includes(md),
   lost=['over','gameover','lost','dead','fail','failed'].includes(md);
   if(playing&&!active){active=true;send('start');snap();lastProgress=now}
   if(active&&playing&&now-lastProgress>1200){snap();lastProgress=now}
   if(active&&(won||lost)){const q=metric();snap();send('finish',{result:won?'win':'loss',metric:q.name,value:q.value,higherBetter:q.higher});active=false}
 },250);
 addEventListener('pagehide',()=>{if(active)snap()});
 return{snapshot:snap};
})();
