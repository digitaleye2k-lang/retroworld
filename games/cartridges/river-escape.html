<body><div class="wrap"><div class="top"><span class="game-brand">DIGITAL EYE</span><div class="title">RIVER ESCAPE</div><div class="rw-diffbox"><span>DIFFICULTY</span><select id="difficultySelect" aria-label="Game difficulty"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option></select></div><button id="sfxToggle" class="sfxbtn" type="button" onclick="SFX.toggle()">SFX: ON</button></div>
<div class="frame"><canvas id="g" width="640" height="480"></canvas></div><div class="help"><kbd>ARROWS/WASD</kbd> steer boat</div>
<div class="touch-controls" id="touchControls" aria-label="Mobile game controls">
  <div class="dpad">
    <button class="touch-btn up" data-touch-key="ArrowUp" aria-label="Up">▲</button>
    <button class="touch-btn left" data-touch-key="ArrowLeft" aria-label="Left">◀</button>
    <button class="touch-btn right" data-touch-key="ArrowRight" aria-label="Right">▶</button>
    <button class="touch-btn down" data-touch-key="ArrowDown" aria-label="Down">▼</button>
  </div>
  <div class="action-pad">
    <button class="touch-btn action" data-touch-key="SPACE" aria-label="Action">A</button>
    <button class="touch-btn start" data-touch-key="ENTER" aria-label="Start or restart">START</button>
  </div>
</div>
<div class="touch-hint">TOUCH: D-PAD + A • TAP CANVAS • HOLD CANVAS = SECONDARY ACTION</div>
</div>
<script>

const MOBILE_TOUCH=(()=>{
  const keyValue=v=>v==='SPACE'?' ':v==='ENTER'?'Enter':v;
  function fire(type,key){
    const ev=new KeyboardEvent(type,{key:keyValue(key),bubbles:true,cancelable:true});
    window.dispatchEvent(ev);
  }
  document.querySelectorAll('[data-touch-key]').forEach(btn=>{
    const key=btn.dataset.touchKey;
    const down=e=>{
      e.preventDefault();
      try{btn.setPointerCapture(e.pointerId)}catch(_){}
      btn.classList.add('pressed');
      fire('keydown',key);
    };
    const up=e=>{
      e.preventDefault();
      btn.classList.remove('pressed');
      fire('keyup',key);
    };
    btn.addEventListener('pointerdown',down,{passive:false});
    btn.addEventListener('pointerup',up,{passive:false});
    btn.addEventListener('pointercancel',up,{passive:false});
    btn.addEventListener('pointerleave',e=>{if(btn.classList.contains('pressed'))up(e)},{passive:false});
  });

  // Makes mouse-driven games work on phones too.
  // Tap = normal click, long-press = secondary/right click.
  const canvas=document.getElementById('g');
  if(canvas){
    let holdTimer=null,held=false,startX=0,startY=0;
    const mouse=(button,cx,cy)=>{
      canvas.dispatchEvent(new MouseEvent('mousedown',{
        bubbles:true,cancelable:true,button,
        clientX:cx,clientY:cy,view:window
      }));
    };
    canvas.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='touch')return;
      e.preventDefault(); held=false; startX=e.clientX; startY=e.clientY;
      holdTimer=setTimeout(()=>{held=true;mouse(2,startX,startY)},520);
    },{passive:false});
    canvas.addEventListener('pointermove',e=>{
      if(e.pointerType!=='touch'||!holdTimer)return;
      if(Math.hypot(e.clientX-startX,e.clientY-startY)>16){clearTimeout(holdTimer);holdTimer=null}
    },{passive:false});
    canvas.addEventListener('pointerup',e=>{
      if(e.pointerType!=='touch')return;
      e.preventDefault();
      if(holdTimer){clearTimeout(holdTimer);holdTimer=null}
      if(!held)mouse(0,e.clientX,e.clientY);
      held=false;
    },{passive:false});
    canvas.addEventListener('pointercancel',()=>{
      if(holdTimer)clearTimeout(holdTimer);holdTimer=null;held=false;
    },{passive:false});
  }

  // Block long-press browser UI (Select / Select All / copy callout / drag)
  // only inside the on-screen game controls.
  const touchRoot=document.getElementById('touchControls');
  if(touchRoot){
    ['contextmenu','selectstart','dragstart'].forEach(type=>{
      touchRoot.addEventListener(type,e=>e.preventDefault(),{capture:true});
    });
    touchRoot.addEventListener('touchstart',e=>e.preventDefault(),{passive:false,capture:true});
    touchRoot.addEventListener('touchmove',e=>e.preventDefault(),{passive:false,capture:true});

    // Some mobile browsers can still create a Selection during a long hold.
    document.addEventListener('selectionchange',()=>{
      const sel=window.getSelection&&window.getSelection();
      if(!sel||sel.rangeCount===0)return;
      const node=sel.anchorNode;
      const el=node&&(node.nodeType===1?node:node.parentElement);
      if(el&&touchRoot.contains(el)){
        try{sel.removeAllRanges()}catch(_){}
      }
    });
  }

  return {};
})();



const SFX=(()=>{
  let ac=null, master=null, engineOsc=null, engineGain=null;
  let enabled=true;
  try{ enabled=localStorage.getItem('retroWorldSFX')!=='off'; }catch(e){}
  function ensure(){
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=0.7; master.connect(ac.destination);
    }
    if(ac.state==='suspended') ac.resume();
    return ac;
  }
  function tone(freq=440,dur=.06,type='square',vol=.05,endFreq=null){
    if(!enabled) return;
    ensure();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(Math.max(20,freq),ac.currentTime);
    if(endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),ac.currentTime+dur);
    g.gain.setValueAtTime(Math.max(.0001,vol),ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+dur+.01);
  }
  function noise(dur=.12,vol=.05){
    if(!enabled) return;
    ensure();
    const len=Math.max(1,Math.floor(ac.sampleRate*dur));
    const buf=ac.createBuffer(1,len,ac.sampleRate), data=buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
    const s=ac.createBufferSource(), g=ac.createGain();
    s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(master); s.start();
  }
  function laser(){ tone(980,.09,'square',.045,260); }
  function enemyLaser(){ tone(330,.08,'sawtooth',.035,140); }
  function hit(){ tone(240,.045,'square',.045,125); }
  function paddle(){ tone(520,.035,'square',.04,620); }
  function wall(){ tone(300,.025,'square',.025); }
  function boom(big=false){ noise(big?.28:.15,big?.09:.055); tone(big?70:110,big?.25:.13,'sawtooth',big?.07:.045,big?30:55); }
  function pickup(){ tone(660,.055,'square',.04,880); setTimeout(()=>tone(990,.07,'square',.035,1320),45); }
  function success(){ tone(523,.08,'square',.04); setTimeout(()=>tone(659,.08,'square',.04),90); setTimeout(()=>tone(784,.14,'square',.04),180); }
  function fail(){ tone(180,.12,'sawtooth',.05,90); setTimeout(()=>tone(90,.18,'sawtooth',.04,45),90); }
  function jump(){ tone(260,.11,'square',.04,650); }
  function step(){ tone(115,.025,'square',.018); }
  function flag(){ tone(760,.04,'square',.025); }
  function flip(){ tone(420,.035,'square',.025); }
  function mismatch(){ tone(180,.1,'square',.035,130); }
  function cannon(){ noise(.07,.055); tone(95,.12,'square',.055,55); }
  function line(n=1){ tone(400+n*80,.07,'square',.04); setTimeout(()=>tone(650+n*90,.11,'square',.035),60); }
  function score(){ tone(700,.045,'square',.025,900); }
  function engine(on=true,freq=95,vol=.018){
    if(!enabled){ stopEngine(); return; }
    ensure();
    if(on){
      if(!engineOsc){

const PORTABLE_GAMEPAD=(()=>{
  const state={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false,' ':false,Enter:false};
  let raf=0,connected=false;

  function emit(key,down){
    if(state[key]===down)return;
    state[key]=down;
    window.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{
      key,bubbles:true,cancelable:true
    }));
  }

  function readButton(gp,i){return !!(gp&&gp.buttons&&gp.buttons[i]&&gp.buttons[i].pressed)}

  function loop(){
    const pads=navigator.getGamepads?navigator.getGamepads():[];
    let gp=null;
    for(const p of pads){if(p&&p.connected){gp=p;break}}

    if(gp){
      connected=true;
      const ax0=gp.axes&&gp.axes.length>0?gp.axes[0]:0;
      const ax1=gp.axes&&gp.axes.length>1?gp.axes[1]:0;
      const dead=.38;

      emit('ArrowLeft', ax0<-dead || readButton(gp,14));
      emit('ArrowRight',ax0> dead || readButton(gp,15));
      emit('ArrowUp',   ax1<-dead || readButton(gp,12));
      emit('ArrowDown', ax1> dead || readButton(gp,13));
      emit(' ',readButton(gp,0));
      emit('Enter',readButton(gp,9));
    }else if(connected){
      connected=false;
      Object.keys(state).forEach(k=>emit(k,false));
    }
    raf=requestAnimationFrame(loop);
  }

  addEventListener('gamepadconnected',()=>{
    if(!raf)raf=requestAnimationFrame(loop);
    try{SFX.tone(620,.05,'square',.02,820)}catch(e){}
  });

  if(navigator.getGamepads)raf=requestAnimationFrame(loop);
  return {};
})();

const RW_LEVEL_SYSTEM=(()=>{
  const GAME_ID="river-escape.html", KIND="action", NATIVE_LEVEL=false, SCALE_ENABLED=true;
  const MAX_LEVEL=10, MODE="metric", PER_LEVEL=300, PROGRESS_LABEL="SCORE";
  const sel=document.getElementById('difficultySelect');
  const DIFF={
    easy:{label:'EASY',base:.90,step:.042,challenge:.08},
    normal:{label:'NORMAL',base:1.00,step:.070,challenge:.15},
    hard:{label:'HARD',base:1.16,step:.098,challenge:.23}
  };
  let difficulty='normal',rwLevel=1,active=false,lastMode='',bannerTimer=0,challengeUntil=0;
  let baseMetric=0,peakMetric=0,completed=0,lastCompletionMode='',metricName=PROGRESS_LABEL;
  const frame=document.querySelector('.frame'),topbar=document.querySelector('.top');
  let hud=null,banner=null;

  function readMode(){
    try{if(typeof state!=='undefined')return String(state).toLowerCase()}catch(e){}
    try{if(typeof st!=='undefined')return String(st).toLowerCase()}catch(e){}
    return ''
  }
  function readNativeStage(){
    if(!NATIVE_LEVEL)return 1;
    try{const v=(1);if(Number.isFinite(v))return Math.max(1,Math.floor(v))}catch(e){}
    return 1
  }
  function readMetric(){
    try{
      if(MODE==='metric'){
        const v=(score);
        return Number.isFinite(v)?Number(v):null
      }
      if(MODE==='minefield'){
        if(!Array.isArray(reveal)||!Array.isArray(board))return null;
        let shown=0;
        for(let y=0;y<reveal.length;y++)for(let z=0;z<(reveal[y]||[]).length;z++)
          if(reveal[y][z]&&board[y]&&board[y][z]!==-1)shown++;
        return shown
      }
    }catch(e){}
    return null
  }
  function loadDifficulty(){
    let v='normal';try{v=localStorage.getItem('rwDifficulty:'+GAME_ID)||'normal'}catch(e){}
    if(!DIFF[v])v='normal';difficulty=v;if(sel)sel.value=v
  }
  function saveDifficulty(){
    if(sel&&DIFF[sel.value])difficulty=sel.value;
    try{localStorage.setItem('rwDifficulty:'+GAME_ID,difficulty)}catch(e){}
    updateHud()
  }
  loadDifficulty();if(sel)sel.addEventListener('change',saveDifficulty);
  function cfg(){return DIFF[difficulty]||DIFF.normal}
  function currentStage(){return NATIVE_LEVEL?Math.min(MAX_LEVEL,readNativeStage()):rwLevel}
  function challengeActive(){return Date.now()<challengeUntil}
  function speedScale(){
    if(!SCALE_ENABLED)return 1;
    const lv=currentStage();
    let s=cfg().base+(lv-1)*cfg().step+(challengeActive()?cfg().challenge:0);
    if(KIND==='cards')s=1+(s-1)*.48;
    if(KIND==='puzzle')s=1+(s-1)*.72;
    return Math.max(.78,Math.min(2.25,s))
  }

  if(!NATIVE_LEVEL&&topbar){
    hud=document.createElement('div');hud.className='rw-level-hud';
    hud.innerHTML='<span class="rw-level">LV 1/'+MAX_LEVEL+'</span><span class="rw-diff">NORMAL</span><span class="rw-next"></span><span class="rw-boss">CHALLENGE</span>';
    const diff=topbar.querySelector('.rw-diffbox');topbar.insertBefore(hud,diff||null)
  }
  if(!NATIVE_LEVEL&&frame){
    banner=document.createElement('div');banner.className='rw-level-banner';banner.textContent='LEVEL 1';frame.appendChild(banner)
  }
  function nextThreshold(){
    if(MODE==='metric'||MODE==='minefield')return PER_LEVEL*rwLevel;
    return null
  }
  function progressValue(){
    if(MODE==='metric'||MODE==='minefield')return Math.max(0,peakMetric-baseMetric);
    if(MODE==='completion')return completed;
    return 0
  }
  function updateHud(){
    if(!hud)return;
    const a=hud.querySelector('.rw-level'),d=hud.querySelector('.rw-diff'),n=hud.querySelector('.rw-next');
    if(a)a.textContent='LV '+rwLevel+'/'+MAX_LEVEL;
    if(d)d.textContent=cfg().label;
    if(n){
      if(rwLevel>=MAX_LEVEL)n.textContent='MAX';
      else if(MODE==='metric'||MODE==='minefield')n.textContent='NEXT '+Math.ceil(nextThreshold());
      else if(MODE==='completion')n.textContent='NEXT '+PROGRESS_LABEL;
      else n.textContent=''
    }
    hud.classList.toggle('boss',challengeActive())
  }
  function flash(text,challenge=false){
    if(!banner)return;
    banner.textContent=text;banner.classList.add('show');bannerTimer=Date.now()+1350;
    if(challenge){
      challengeUntil=Date.now()+7000;
      try{SFX.tone(150,.15,'sawtooth',.03,90)}catch(e){}
    }else try{SFX.tone(720,.06,'square',.025,960)}catch(e){}
  }
  function startSession(){
    active=true;rwLevel=1;completed=0;challengeUntil=0;
    const m=readMetric();baseMetric=m===null?0:m;peakMetric=baseMetric;
    flash('LEVEL 1 • '+cfg().label);updateHud()
  }
  function levelUp(){
    if(rwLevel>=MAX_LEVEL)return;
    rwLevel++;
    const challenge=(rwLevel===4||rwLevel===7||rwLevel===10);
    flash(challenge?'CHALLENGE LEVEL '+rwLevel:'LEVEL '+rwLevel,challenge);
    updateHud()
  }
  function syncMetricLevel(){
    const m=readMetric();if(m===null)return;
    peakMetric=Math.max(peakMetric,m);
    const progress=Math.max(0,peakMetric-baseMetric);
    while(rwLevel<MAX_LEVEL&&progress>=PER_LEVEL*rwLevel)levelUp()
  }
  function update(){
    const md=readMode(),playing=(md==='play'||md==='playing'||md==='running');
    if(NATIVE_LEVEL){
      rwLevel=Math.min(MAX_LEVEL,readNativeStage());
      if(banner&&bannerTimer&&Date.now()>bannerTimer){banner.classList.remove('show');bannerTimer=0}
      lastMode=md;return
    }
    if(playing&&!active)startSession();
    if(active){
      if(MODE==='metric'||MODE==='minefield'){
        if(playing)syncMetricLevel()
      }else if(MODE==='completion'){
        const won=(md==='win'||md==='won'||md==='complete'||md==='completed'||md==='victory');
        const wasWon=(lastMode==='win'||lastMode==='won'||lastMode==='complete'||lastMode==='completed'||lastMode==='victory');
        if(won&&!wasWon){completed++;if(rwLevel<MAX_LEVEL)levelUp()}
        if(md==='over'||md==='gameover'||md==='dead'||md==='lose'||md==='lost')active=false
      }
      if((MODE==='metric'||MODE==='minefield')&&(md==='over'||md==='gameover'||md==='win'||md==='won'||md==='complete'||md==='completed'))active=false
    }
    if(banner&&bannerTimer&&Date.now()>bannerTimer){banner.classList.remove('show');bannerTimer=0}
    updateHud();lastMode=md
  }

  if(SCALE_ENABLED){
    const nativeRAF=window.requestAnimationFrame.bind(window),clocks=new WeakMap();
    window.requestAnimationFrame=function(cb){
      return nativeRAF(real=>{
        let q=clocks.get(cb);
        if(!q){q={real,sim:real};clocks.set(cb,q)}
        else{const dr=Math.max(0,Math.min(50,real-q.real));q.real=real;q.sim+=dr*speedScale()}
        cb(q.sim)
      })
    }
  }
  setInterval(update,120);updateHud();
  window.__rwLevels=()=>({
    gameId:GAME_ID,native:NATIVE_LEVEL,mode:MODE,difficulty,level:currentStage(),maxLevel:MAX_LEVEL,
    scale:speedScale(),progress:progressValue(),perLevel:PER_LEVEL,nextAt:rwLevel>=MAX_LEVEL?null:nextThreshold(),
    metric:metricName,challenge:challengeActive()
  });
  return{get level(){return currentStage()},get difficulty(){return difficulty},scale:speedScale}
})();

const RETRO_LOCAL_STATS=(()=>{
  const GAME_ID="river-escape.html", GAME_TITLE="RIVER ESCAPE";
  let active=false,lastMode='',lastProgress=0;

  function mode(){
    try{if(typeof state!=='undefined')return String(state).toLowerCase()}catch(e){}
    try{if(typeof st!=='undefined')return String(st).toLowerCase()}catch(e){}
    return '';
  }

  function metric(){
    try{if(typeof score==='number'&&Number.isFinite(score))return {name:'score',value:Math.round(score),higher:true}}catch(e){}
    try{if(typeof sc==='number'&&Number.isFinite(sc))return {name:'score',value:Math.round(sc),higher:true}}catch(e){}
    try{if(typeof strokes==='number'&&Number.isFinite(strokes))return {name:'strokes',value:Math.round(strokes),higher:false}}catch(e){}
    try{if(typeof kills==='number'&&Number.isFinite(kills))return {name:'kills',value:Math.round(kills),higher:true}}catch(e){}
    return {name:'score',value:0,higher:true};
  }

  function send(type,extra={}){
    try{parent.postMessage(Object.assign({
      source:'retro-world-game',type,gameId:GAME_ID,title:GAME_TITLE
    },extra),'*')}catch(e){}
  }

  function snapshot(){
    const m=metric();
    send('progress',{metric:m.name,value:m.value,higherBetter:m.higher});
  }

  const timer=setInterval(()=>{
    const now=Date.now(), md=mode();
    const playing=(md==='play'||md==='playing'||md==='running');
    const won=(md==='win'||md==='won'||md==='victory'||md==='complete');
    const lost=(md==='over'||md==='gameover'||md==='lost'||md==='dead'||md==='fail'||md==='failed');

    if(playing&&!active){
      active=true;
      send('start');
      snapshot();
      lastProgress=now;
    }

    if(active&&playing&&now-lastProgress>1200){
      snapshot();
      lastProgress=now;
    }

    if(active&&(won||lost)){
      const mt=metric();
      snapshot();
      send('finish',{
        result:won?'win':'loss',
        metric:mt.name,
        value:mt.value,
        higherBetter:mt.higher
      });
      active=false;
    }

    lastMode=md;
  },250);

  addEventListener('pagehide',()=>{if(active)snapshot()});
  return {snapshot};
})();

</script></body></html>
