const T=40,N=72,WS=T*N,NB=8;

(function genCity(){

  const x0=bi*9+4,y0=bj*9+4,isHQ=(bi===5&&bj===2);let type='bldg';const r=rg();

  if(type==='hq'){setT(0,0,4,4,4);HQ={x:x0*T,y:y0*T,w:4*T,h:4*T,dx:(x0+2)*T,dy:(y0+4)*T+T*.5};bldgs.push({x:x0*T,y:y0*T,w:4*T,h:4*T,hq:1,hh:3});continue}

  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(s=>{const lx_=cx+s[0]*(1.5*T+9),ly_=cy+s[1]*(1.5*T+9);if(lx_>0&&ly_>0&&lx_<WS&&ly_<WS)lamps.push({x:lx_,y:ly_})})}
})();
const solidAt=(tx,ty)=>tx<0||ty<0||tx>=N||ty>=N||kind[ty][tx]===3||kind[ty][tx]===4;
const tileKind=(px,py)=>{const tx=Math.floor(px/T),ty=Math.floor(py/T);return(tx<0||ty<0||tx>=N||ty>=N)?3:kind[ty][tx]};

 for(let j=0;j<NB;j++)for(let k=0;k<NB;k++){const x0=9*j*T,y0=9*k*T,x1=(9*j+3)*T,y1=(9*k+3)*T;
