 const lift=Math.min(1,c.alt*1.6),fx=Math.cos(c.a),fy=Math.sin(c.a);let f=c.vx*fx+c.vy*fy,l=-c.vx*fy+c.vy*fx;

 {const top=bldgTopAlt(c.x,c.y);if(top>0&&c.alt<top&&!helipadAt(c.x,c.y)&&c.alt>.03){crashAir(c,'CRASHED INTO A BUILDING!');return}}

function harbourBerth(){return BERTHS.find(b=>b.pier===2&&!b.isle)||BERTHS[0]}
function clampW(v){return cl(v,200,WS-200)}
