name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build release APK
        working-directory: android-app
        run: gradle --no-daemon assembleRelease
      - name: Collect APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk RetroWorld.apk
      - uses: actions/upload-artifact@v4
        with: { name: RetroWorld-apk, path: RetroWorld.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest RetroWorld.apk --title "Retro World Android app" --notes "Sideload this APK on Android (allow install from unknown sources)." --latest=false
