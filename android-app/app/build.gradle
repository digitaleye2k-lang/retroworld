plugins { id 'com.android.application' }
android {
    namespace 'eu.cc.retroworld'
    compileSdk 34
    defaultConfig {
        applicationId 'eu.cc.retroworld'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            storeFile file('../retroworld.jks')
            storePassword 'retroworld'
            keyAlias 'retroworld'
            keyPassword 'retroworld'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
