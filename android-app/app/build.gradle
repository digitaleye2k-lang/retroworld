plugins { id 'com.android.application' }
android {
    namespace 'eu.cc.retroworld'
    compileSdk 34
    defaultConfig {
        applicationId 'eu.cc.retroworld'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        manifestPlaceholders = [admobAppId: ADMOB_APP_ID]
        resValue 'string', 'admob_banner_id', ADMOB_BANNER_ID
        resValue 'string', 'admob_interstitial_id', ADMOB_INTERSTITIAL_ID
    }
    signingConfigs {
        release {
            storeFile file('../retroworld.jks')
            storePassword 'retroworld'
            keyAlias 'retroworld'
            keyPassword 'retroworld'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.0.0'
}
